# Vorlage: Workflow „Software nachziehen“ für das Reisen-Repo einer Instanz (#161, #250).
# Einrichten: Datei nach .github/workflows/ des Reisen-Repos kopieren (docs/betrieb.md, „Neue Instanz einrichten“).
#
# Alle 30 Minuten, von Hand und angestoßen vom Server (veroeffentlichen.sh, sobald main der Software einen neuen Stand
# hat): Liegt auf main der Software (Submodul frieda/) ein neuerer Stand, wird das Submodul darauf gesetzt. Den Rest
# erledigt frieda/betrieb/software-nachziehen.sh aus diesem Stand: jede Reise umstellen (neu.py nachziehen), prüfen
# (Tor wie beim Veröffentlichen, #142, #168), Submodul und Reisen in einem Commit des Bots nach main übernehmen, bei
# rotem Tor ein Issue (Label software-nachziehen). Der Ablauf kommt so mit der Software; diese Vorlage ändert sich nicht.
# Nur vorwärts, ein Lauf gleichzeitig, nie erzwungen.
name: Software nachziehen

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: software-nachziehen
  cancel-in-progress: false

jobs:
  nachziehen:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          submodules: true

      - name: Neuer Stand?
        id: stand
        run: |
          alt=$(git -C frieda rev-parse HEAD)
          # Das Submodul ist ein flacher Klon. Vorwärts-Prüfung und Commit-Liste brauchen die volle Historie.
          git -C frieda fetch -q --unshallow origin main 2>/dev/null || git -C frieda fetch -q origin main
          neu=$(git -C frieda rev-parse origin/main)
          neu_da=ja
          if [ "$alt" = "$neu" ]; then
            neu_da=nein
          elif ! git -C frieda merge-base --is-ancestor "$alt" "$neu"; then
            # Nur vorwärts: ein Stand, der nicht auf dem eingebundenen aufbaut, wird nie übernommen.
            neu_da=nein
            echo "::warning::main der Software liegt nicht vor dem eingebundenen Stand, nichts übernommen"
          fi
          { echo "alt=$alt"; echo "neu=$neu"; echo "neu_da=$neu_da"; } >> "$GITHUB_OUTPUT"

      - name: Submodul setzen
        if: steps.stand.outputs.neu_da == 'ja'
        run: git -C frieda checkout -q "${{ steps.stand.outputs.neu }}"

      # Python in jedem Lauf: Umgestellt wird auch ohne neuen Software-Stand (#250)
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: frieda/engine/requirements.txt

      - name: Python-Pakete
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libcairo2
          pip install -r frieda/engine/requirements.txt

      # Umstellen, Tor, Commit und Issue: der Ablauf liegt in der Software (docs/betrieb.md, „Software nachziehen“)
      - name: Umstellen, prüfen, übernehmen
        env:
          GH_TOKEN: ${{ github.token }}
          ALT: ${{ steps.stand.outputs.alt }}
          NEU: ${{ steps.stand.outputs.neu }}
          NEU_DA: ${{ steps.stand.outputs.neu_da }}
        run: |
          skript=frieda/betrieb/software-nachziehen.sh
          if [ ! -x "$skript" ]; then
            echo "::error::$skript fehlt: Die eingebundene Software ist älter als dieser Workflow (#250). Das Submodul frieda/ auf einen neueren Stand von main setzen."
            exit 1
          fi
          "$skript"
