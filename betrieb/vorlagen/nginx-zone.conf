# Drosseln für Rückmeldedienst und Konnektor der Instanz __INSTANZ__ (gehört in den http-Block, z. B. /etc/nginx/conf.d/).
# Erzeugt von betrieb/einrichten.sh; je Instanz eine eigene Datei mit eigenen Zonennamen, damit sie nie mit einer gemeinsam
# genutzten Datei (etwa limit-req.conf) um Namen streitet.
#
# Eigene Adressen (Schleife und FR_EIGENE_ADRESSEN, etwa die Adresse des Servers selbst) zählen nicht ins Kontingent: Der
# Schlüssel ist für sie leer, und nginx rechnet Anfragen mit leerem Schlüssel nicht an. So verbrauchen die Prüfungen des
# Servers nichts von dem, was Besucher brauchen, und sie laufen weiter den echten Weg über nginx.
# Bedingung: Die Ausnahme ist sicher, solange die Software keine Funktion hat, mit der der Server eine fremde Adresse
# aufruft und deren Antwort nach außen weitergibt (docs/betrieb.md).
geo $__EIGEN__ {
    default 0;
    __EIGENE_ADRESSEN__
}
map $__EIGEN__ $__SCHLUESSEL__ {
    0 $binary_remote_addr;
    1 "";
}

# Claude-App (/mcp): Aufrufe kommen von gemeinsamen Adressen von Anthropic, deshalb großzügig statt streng je Nutzer
limit_req_zone $__SCHLUESSEL__ zone=__ZONE_MCP__:1m rate=10r/s;
# Anmelden (Code per Mail anfordern und einlösen): streng je Adresse; der Dienst begrenzt zusätzlich je E-Mail-Adresse und IP
limit_req_zone $__SCHLUESSEL__ zone=__ZONE_ANMELDEN__:1m rate=5r/m;
# Konto, Einladung und Kalender-Abo im Browser
limit_req_zone $__SCHLUESSEL__ zone=__ZONE_KONTO__:1m rate=30r/m;
