# nginx-Baustein für den Konnektor (Reisen in der Claude-App), einmal je Instanz; erzeugt von betrieb/einrichten.sh.
# Gehört in den server-Block der Instanz, neben die Reise-Bausteine (<FR_NGINX_SNIPPETS>/__INSTANZ__-konnektor.conf).
# Der geheime Teil steckt im Pfad dahinter (/__INSTANZ__-mcp/<token>); welche Reise und Rolle dazugehört, steht in
# __KONNEKTOR__/zugaenge.json. Unbekannte Tokens beantwortet der Dienst mit 404.

location ^~ /__INSTANZ__-mcp/ {
    client_max_body_size 64k;
    # Zone aus nginx-zone.conf, 30/min je Adresse
    limit_req zone=__ZONE__ burst=20 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:__KN_PORT__/;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 30s;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Client-Adresse für die Begrenzung im Dienst; nginx setzt sie selbst, ein mitgeschickter Wert zählt nicht
    proxy_set_header X-Real-IP         $remote_addr;
    # Das Dienst-Geheimnis schickt nur der Konnektor intern, nie ein Browser
    proxy_set_header X-Frieda-Dienst   "";

    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}
