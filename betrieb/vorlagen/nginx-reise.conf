# nginx-Baustein für eine Reise-Seite, erzeugt von betrieb/freischalten.sh (Platzhalter __…__ ersetzt es selbst).
# Liegt als <FR_NGINX_SNIPPETS>/__INSTANZ__-__REISE__.conf und wird im server-Block der Instanz eingebunden.
# Der Pfad enthält ein langes Zufallswort (__TOKEN__): Zugang nur über den geheimen Link, nie im Repo.
#
# ^~ ist nötig, sonst greifen allgemeine Regeln für Dateiendungen (.js/.jpg) weiter oben und liefern 404.
# add_header in einem location-Block schaltet geerbte Header ab, deshalb werden sie hier wiederholt.

location ^~ /__REISE__-__TOKEN__/ {
    alias __SEITEN__/__REISE__/;
    index index.html;
    try_files $uri $uri/ =404;

    add_header Cache-Control "no-cache";
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}

# Belege zu Buchungen (engine/belege.py, #76): Dateien bis 10 MB hochladen und ansehen, sonst wie /api/. Ändert sich diese
# Vorlage, erneuert freischalten.sh den Baustein jeder Reise mit ihrem Token.
location ^~ /__REISE__-__TOKEN__/api/belege/ {
    client_max_body_size 11m;
    limit_req zone=__ZONE__ burst=10 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:__RM_PORT__/__REISE__/belege/;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Frieda-Dienst   "";

    add_header Cache-Control "private, no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}

# Rückmeldedienst. Längerer Präfix gewinnt bei ^~, die Reihenfolge ist egal. Der Dienst (__INSTANZ__-rueckmeldungen)
# kennt die Reise am ersten Pfadteil; nginx schneidet Token-Präfix und /api/ ab.
location ^~ /__REISE__-__TOKEN__/api/ {
    client_max_body_size 16k;
    # Zone aus nginx-zone.conf (einrichten.sh), 30/min je Adresse
    limit_req zone=__ZONE__ burst=10 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:__RM_PORT__/__REISE__/;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Client-Adresse für die Begrenzung im Dienst; nginx setzt sie selbst, ein mitgeschickter Wert zählt nicht
    proxy_set_header X-Real-IP         $remote_addr;
    # Das Dienst-Geheimnis schickt nur der Konnektor intern, nie ein Browser
    proxy_set_header X-Frieda-Dienst   "";

    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}
