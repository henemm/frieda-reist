# Arten der zweiten Beispielreise (erfunden): ein Wochenende in der Stadt, ohne Wanderung, ohne Varianten, ohne Etappen
# und ohne Tagesseiten. Sie prüft, dass die Software nur Grundformen kennt (ADR-0001, Frage 1).
arten:
  stadt:
    grundform: ort
    name: Stadt
    farbe: schiefer
    beschreibung: "Beispielwert: die Stadt, in der man das Wochenende verbringt"
    lesetext:     # eine Stadt erzählt man anders als einen Etappenort (Beispielwert, #334)
      ueberblick: {name: Überblick, hilfe: "Was die Stadt für dieses Wochenende ausmacht"}
      essen:      {name: Essen, hilfe: "Küche der Gegend, wann man isst; ein bestimmtes Lokal ist ein Aufenthalt am Ort"}
      unterwegs:  {name: Unterwegs, hilfe: "Wie man sich in der Stadt bewegt"}
  gastzimmer:
    grundform: aufenthalt
    name: Gästezimmer bei Verwandten
    farbe: braun
    merkmale:
      schluessel: {name: Schlüssel, typ: text, hilfe: "Wer öffnet, wann ist jemand zu Hause", frage: "Wann seid ihr zu Hause?"}
      lage:       {name: Lage, typ: text, stufe: angeboten}
  essen:
    grundform: aufenthalt
    name: Essen
    farbe: oliv
    symbol: einkehr
    buchbar: true
    merkmale:
      geoeffnet: {name: Geöffnet am Reisedatum, typ: auswahl, werte: [ja, nein, unklar], veraenderlich: true, stufe: pflicht,
                  hilfe: "Website oder Anruf; Ruhetag beachten"}
  museum:
    grundform: aufenthalt
    name: Museum
    farbe: lila
    symbol: museum
    merkmale:
      geoeffnet: {name: Geöffnet am Reisedatum, typ: auswahl, werte: [ja, nein, unklar], veraenderlich: true, stufe: pflicht}
      eintritt:  {name: Eintritt, typ: geld, veraenderlich: true, rolle: kosten}
    lesetext:     # ein Museum erzählt man anders als eine Pension (Beispielwert, #334)
      sammlung: {name: Sammlung, hilfe: "Was es zu sehen gibt, in eigenen Worten"}
      zeit:     {name: Zeit, hilfe: "Wie lange man braucht, wann es ruhig ist"}
  bahn:
    grundform: bewegung
    name: Bahn
    farbe: schiefer
    symbol: bahn
    buchbar: true
    merkmale:
      preis: {name: Preis, typ: geld, veraenderlich: true, rolle: kosten, hilfe: "Fahrplanauskunft des Betreibers"}
      dauer: {name: Dauer, typ: text, veraenderlich: true}
  # Kategorien der Packliste (erfunden, Beispielwerte): ohne Gewicht und ohne Raum, ein Wochenende braucht beides nicht (ADR-0010)
  papiere:
    grundform: gegenstand
    name: Papiere
    farbe: blau
  kleidung:
    grundform: gegenstand
    name: Kleidung
    farbe: tuerkis
    merkmale:
      anzahl: {name: Anzahl, typ: zahl}
