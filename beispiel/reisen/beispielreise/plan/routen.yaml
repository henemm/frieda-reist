# Beispielreise – Routenmodell: alle Möglichkeiten, Entscheidungen und Kandidaten.
# Aufbau und Regeln: engine/routen.py. Status gewaehlt, verworfen, ersetzt setzt nur ein:e Organisator:in
# (reise.yaml, hier Ida); Vorschläge anderer höchstens vorgeschlagen oder favorisiert (mit Begründung).
# Die Reise ist erfunden; Orte und Wege gibt es wirklich. Kennzahlen der Etappen stehen im Etappen-Dossier
# (inhalt/etappen.md) und sind aus den schematischen Tracks gerechnet (Beispielwerte).

start: {datum: 2027-05-13, ort: O-01}
ende: {datum: 2027-05-16, ort: O-01}
fixpunkte:
  - {datum: 2027-05-13, ort: O-01, titel: "Ankunft mit dem Zug in Dresden (Beispiel)", quelle: "erfunden (Beispiel)"}
  - {datum: 2027-05-15, ort: O-04, titel: "Abendessen in Altendorf, Tisch um 19 Uhr reserviert (Beispiel)", quelle: "erfunden (Beispiel)"}

orte:   # Orte gibt es wirklich; Herkunft je Ort (Kern jedes Dings, docs/ontologie.md)
  O-01: {name: Dresden, quelle: "OpenStreetMap"}
  O-02: {name: Stadt Wehlen, quelle: "OpenStreetMap"}
  O-03: {name: Hohnstein, hinweis: "Burgstadt über dem Polenztal", quelle: "OpenStreetMap; Hinweis Wikipedia (W-05)"}
  O-04: {name: Altendorf, quelle: "OpenStreetMap"}
  O-05: {name: Bad Schandau, quelle: "OpenStreetMap"}
  O-06: {name: Lichtenhainer Wasserfall, hinweis: "Endhaltestelle der Kirnitzschtalbahn", quelle: "OpenStreetMap; Hinweis Wikipedia (W-06)"}

# Wanderetappen kommen aus dem Etappen-Dossier (Titel, Kennzahlen); hier nur Anfang und Ende.
strecken:
  E-01: {von: O-02, nach: O-03, art: wandern, quelle: "Etappen-Dossier (inhalt/etappen.md), Beispielwerte"}
  E-02: {von: O-03, nach: O-04, art: wandern, quelle: "Etappen-Dossier (inhalt/etappen.md), Beispielwerte"}
  E-03: {von: O-04, nach: O-05, art: wandern, quelle: "Etappen-Dossier (inhalt/etappen.md), Beispielwerte"}
  E-04: {von: O-04, nach: O-06, art: wandern, quelle: "Etappen-Dossier (inhalt/etappen.md), Beispielwerte"}
  # ab/an (#135) erscheinen mit Uhrzeit im Kalender (#77); hier erfundene Beispielwerte
  E-20: {titel: "S-Bahn Dresden → Stadt Wehlen, Fähre über die Elbe", von: O-01, nach: O-02, art: bahn, ab: "08:12", an: "08:40", quelle: "Beispiel; Fahrplan nicht geprüft"}
  E-21: {titel: "S-Bahn Bad Schandau → Dresden", von: O-05, nach: O-01, art: bahn, quelle: "Beispiel; Fahrplan nicht geprüft"}
  E-23: {titel: "Bus Bad Schandau → Dresden", von: O-05, nach: O-01, art: bus, quelle: "erfunden (Beispiel)"}
  E-22: {titel: "Kirnitzschtalbahn Lichtenhainer Wasserfall → Bad Schandau", von: O-06, nach: O-05, art: bahn, siehe: W-06, quelle: "Strecke laut Wikipedia (W-06); Fahrplan nicht geprüft"}

unterkuenfte:
  # Alle Unterkünfte sind erfunden. Preise und Angaben sind Beispielwerte, nicht nachschlagen.
  U-01:
    name: Hotel am Elbufer
    ort: O-01
    art: hotel
    hinweis: "erfundenes Beispielhotel in der Altstadt"
    adresse: {wert: "Terrassenufer 1, 01067 Dresden", quelle: "erfunden (Beispiel)", notiz: "Beispielwert"}
    # Buchungsstand: aus der Buchung B-01 (unten); ohne Buchung gilt „offen“, ein eigener Eintrag buchung: ginge auch
    quelle: "erfunden (Beispiel)"
    merkmale:
      # Wert je Datum (docs/alternativen.md): ein Eintrag ohne „gilt“ für alle übrigen Tage
      preis:
        - {wert: "120 €", quelle: "erfunden (Beispiel)", notiz: "Beispielwert, erfunden"}
        - {wert: "140 €", gilt: 2027-05-15, quelle: "erfunden (Beispiel)", notiz: "Beispielwert, erfunden: Samstag teurer"}
      fruehstueck: {wert: inklusive, quelle: "erfunden (Beispiel)", notiz: "Beispielwert, erfunden"}
      charakter: {wert: "Altes Bürgerhaus am Fluss, kleine Zimmer mit Blick auf die Elbe; abends ruhig (Beispielwert)", quelle: "erfunden (Beispiel)", notiz: "Beispielwert, erfunden"}
  U-02:
    name: Pension Burgblick
    ort: O-03
    art: pension
    frage: F-02
    hinweis: "erfunden; Doppelzimmer mit Blick auf die Burg"
    kontakt: "Tel. +49 00 0000 (Beispielwert)"
    quelle: "erfunden (Beispiel)"
    merkmale:
      preis: {wert: "85 €", quelle: "erfunden (Beispiel)", notiz: "Beispielwert, erfunden"}
      fruehstueck: {wert: inklusive, quelle: "erfunden (Beispiel)", notiz: "Beispielwert, erfunden"}
      abendessen: {wert: im Ort, quelle: "erfunden (Beispiel)", notiz: "Beispielwert, erfunden"}
      webseite: {wert: "https://example.org/pension-burgblick", quelle: "erfunden (Beispiel)", notiz: "Beispielwert, erfunden"}
      lage: {wert: "am Markt, zwei Minuten vom Malerweg", quelle: "erfunden (Beispiel)"}
  U-03:
    name: Gasthof Polenztal
    ort: O-03
    art: gasthof
    frage: F-02
    hinweis: "erfunden; unten im Tal, morgens 15 Minuten Anstieg zurück zum Weg"
    quelle: "erfunden (Beispiel)"
    merkmale:
      preis: {wert: "70 €", quelle: "erfunden (Beispiel)", notiz: "Beispielwert, erfunden"}
      abendessen: {wert: im Haus, quelle: "erfunden (Beispiel)", notiz: "Beispielwert, erfunden"}
  U-04:
    name: Wanderherberge Altendorf
    ort: O-04
    art: herberge
    hinweis: "erfunden; Mehrbettzimmer, Selbstversorgerküche"
    quelle: "erfunden (Beispiel)"
    merkmale:
      preis: {wert: "35 € pro Person", quelle: "erfunden (Beispiel)", notiz: "Beispielwert, erfunden"}
      fruehstueck: {wert: gegen Aufpreis, quelle: "erfunden (Beispiel)", notiz: "Beispielwert, erfunden"}
      zimmer: {wert: "Vierbettzimmer", quelle: "erfunden (Beispiel)"}

# Aufenthalte ohne Nacht (Paket O-5): Besichtigung, Essen, Besuch; stehen am Tag unter aufenthalte: in der Zeitleiste
aufenthalte:
  A-01:
    name: Burg Hohnstein
    ort: O-03
    art: besichtigung
    zeit: "nach der Wanderung, 16–18 Uhr"
    beginn: "16:00"   # Beispielwert, erfunden (#77, Kalender)
    ende: "18:00"
    hinweis: "erfundenes Beispiel; Burg über dem Polenztal"
    quelle: "erfunden (Beispiel)"
    merkmale:
      geoeffnet: {wert: ja, quelle: "erfunden (Beispiel)", geprueft: 2026-10-29}
      eintritt: {wert: "6 €", quelle: "erfunden (Beispiel)", geprueft: 2026-10-29}

# Buchungen (B-…, #76): eigenes Ding zu einer Unterkunft, einem Aufenthalt oder einer Strecke (fuer, auch mehrere).
# Felder: status (angefragt | gebucht | storniert), nummer, bei, preis, zahlung (Zahlstand, #166), bezahlt (Einzelheiten),
# frist (+ frist_was), storno (+ storno_bis), gebucht_am, merkmale (Merkmale der Buchung, je Art in plan/arten.yaml
# buchung_merkmale), wer, quelle (Herkunft, Pflicht), notiz, verlauf. Der Beleg (PDF, Bild) liegt nie im Repo: Die Person hängt ihn
# auf der Seite an die Buchung (Rückmeldedienst, docs/betrieb.md „Belege“). Alle Angaben hier sind erfunden.
buchungen:
  B-01:
    fuer: [U-01]
    status: gebucht
    nummer: "HE-2027-0415"
    bei: "direkt beim Hotel (Mail)"
    preis: "120 € für eine Nacht"
    zahlung: angezahlt   # Zahlstand (#166): offen | angezahlt | bezahlt | vor_ort | inklusive | erstattet
    bezahlt: "Anzahlung 30 €, Rest vor Ort (Beispielwert)"
    storno: "kostenlos bis 3 Tage vorher, danach eine Nacht"
    storno_bis: 2027-05-11
    gebucht_am: 2026-10-29
    wer: Ida
    quelle: "Buchungsbestätigung per Mail vom 29.10.2026 (erfunden, Beispiel)"
    verlauf:
      - {datum: 2026-10-29, wer: Ida, was: angelegt}
  B-02:
    fuer: [E-20]
    status: gebucht
    nummer: "DB-ABC123"
    bei: "bahn.de"
    preis: "19,90 € für zwei Personen"
    zahlung: bezahlt
    bezahlt: "Kreditkarte"
    frist: 2027-05-13
    frist_was: "Ticket in die App laden"
    storno: "Sparpreis, keine Erstattung"
    gebucht_am: 2026-10-29
    merkmale: {ticketart: Sparpreis}   # Merkmal der Buchung, festgelegt an der Art Bahn (plan/arten.yaml, Beispielwert)
    wer: Karl
    quelle: "Buchungsbestätigung bahn.de vom 29.10.2026 (erfunden, Beispiel)"
    verlauf:
      - {datum: 2026-10-29, wer: Karl, was: angelegt}
  B-03:
    fuer: [U-01]
    status: storniert
    nummer: "HE-2027-0388"
    bei: "direkt beim Hotel (Mail)"
    preis: "95 € für eine Nacht (Beispielwert)"
    zahlung: erstattet
    bezahlt: "Anzahlung 20 € zurück (Beispielwert)"
    storno: "kostenlos bis 3 Tage vorher"
    gebucht_am: 2026-10-27
    wer: Ida
    quelle: "erfundene Beispielbuchung (Beispielwert), Mail vom 27.10.2026"
    verlauf:
      - {datum: 2026-10-27, wer: Ida, was: angelegt}
      - {datum: 2026-10-29, wer: Ida, was: Status, grund: "Zimmer doppelt gebucht, die Buchung HE-2027-0415 gilt"}

tage:
  T-01: {titel: "Ankunft und Stadttag in Dresden", nacht: U-01, text: "Ankunft mittags mit dem Zug, Nachmittag in der Altstadt (Frauenkirche, Elbufer). Siehe Ortsseite O-01."}
  T-02: {titel: "Stadt Wehlen → Bastei → Hohnstein", strecken: [E-20, E-01], wahl: [V-02], aufenthalte: [A-01], nacht: V-03, text: "Erster Wandertag. Früh fahren: An der Bastei ist es ab dem späten Vormittag voll (Annahme)."}
  T-03: {titel: "Hohnstein → Brand → Altendorf", strecken: [E-02], nacht: U-04}
  T-04: {titel: "Altendorf → Schrammsteine → Bad Schandau, Zug nach Dresden", strecken: [E-03, E-21]}
  T-05: {titel: "Altendorf → Schrammsteine → Lichtenhainer Wasserfall, Kirnitzschtalbahn, Zug nach Dresden", strecken: [E-04, E-22, E-21]}
  T-06: {titel: "Mit dem Bus von Bad Schandau nach Dresden (erfundenes Beispiel)", strecken: [E-23]}

route: [T-01, T-02, T-03, V-01]

# Benannte Pläne: feste Kombinationen von Optionen (Ansicht „Varianten“).
plaene:
  - id: P-A
    kurz: Plan A
    titel: "Direkt hinunter nach Bad Schandau"
    farbe: a
    auswahl: [V-01.a, V-03.a]
    plus: ["kürzester letzter Tag", "früh am Bahnhof"]
    minus: ["ohne Kirnitzschtalbahn"]
  - id: P-B
    kurz: Plan B
    titel: "Über die Affensteine zur Kirnitzschtalbahn"
    farbe: b
    auswahl: [V-01.b, V-03.a]
    plus: ["Fahrt mit der historischen Straßenbahn", "mehr Felsen am letzten Tag"]
    minus: ["Abfahrt hängt am Fahrplan der Bahn"]

wahlstellen:
  V-01:
    titel: "Letzter Tag: Weg zum Zug"
    wann: planung
    frage: F-01
    text: "Beide Wege beginnen in Altendorf und führen über die Schrammsteinaussicht. Offen ist, wo der Abstieg endet."
    optionen:
      - id: V-01.a
        titel: "Abstieg nach Bad Schandau (Plan A)"
        folge: [T-04]
        quelle: "Etappen-Dossier Etappe 3 (Beispiel)"
        verlauf:
          - {datum: 2026-10-20, status: vorgeschlagen, wer: Claude, grund: "kürzeste Verbindung zum Bahnhof"}
      - id: V-01.b
        titel: "Zum Lichtenhainer Wasserfall und mit der Kirnitzschtalbahn zurück (Plan B)"
        folge: [T-05]
        quelle: "Etappen-Dossier Etappe 4 und Wikipedia (W-06), Beispiel"
        verlauf:
          - {datum: 2026-10-20, status: vorgeschlagen, wer: Claude}
          - {datum: 2026-10-22, status: favorisiert, wer: Karl, grund: "Karl möchte einmal mit der Kirnitzschtalbahn fahren"}
      # Erfundenes Beispiel für Regeln und Anschluss: Der Bus fährt ab Bad Schandau, der Weg von Altendorf dorthin
      # fehlt (der Vergleich zeigt „Lücke am Anfang“). Die Regeln sind ebenfalls erfunden.
      - id: V-01.c
        titel: "Mit dem Bus zurück (erfundenes Beispiel)"
        text: "Gepäck bleibt in der Pension Burgblick und wird unterwegs abgeholt (erfunden)."
        folge: [T-06]
        quelle: "erfunden (Beispiel)"
        erfordert: [V-03.a]
        schliesst_aus: [V-02.b]
        verlauf:
          - {datum: 2026-10-23, status: vorgeschlagen, wer: Claude}

  V-02:
    titel: "Tag 2: Zugang zum Hockstein"
    wann: unterwegs
    text: "Der Hockstein hat zwei Zugänge: die Steinbrücke und die Wolfsschlucht (Wikipedia, siehe W-05)."
    optionen:
      - id: V-02.a
        titel: "Über die Steinbrücke"
        quelle: "Wikipedia (W-05)"
        verlauf:
          - {datum: 2026-10-20, status: vorgeschlagen, wer: Ida, grund: "der übliche Zugang"}
      - id: V-02.b
        titel: "Durch die Wolfsschlucht"
        ausloeser: "nur bei trockenem Fels; Felsstufen bei Nässe vermutlich glatt (Annahme)"
        siehe: W-05
        quelle: "Wikipedia (W-05); Annahme zur Nässe"
        verlauf:
          - {datum: 2026-10-20, status: vorgeschlagen, wer: Ida, grund: "Abenteuer, wenn es trocken ist"}

  V-03:
    titel: Unterkunft in Hohnstein
    wann: planung   # art: (die Art der Dinge) kommt hier aus den Optionen: die Art der ersten Unterkunft
    frage: F-02
    optionen:
      - id: V-03.a
        titel: Pension Burgblick
        unterkuenfte: [U-02]
        quelle: "erfunden (Beispiel)"
        plus: ["direkt am Weg"]
        verlauf:
          - {datum: 2026-10-20, status: gewaehlt, wer: Ida, grund: "liegt am Weg, kein Anstieg am Morgen"}
      - id: V-03.b
        titel: Gasthof Polenztal
        unterkuenfte: [U-03]
        quelle: "erfunden (Beispiel)"
        plus: ["Abendessen im Haus"]
        minus: ["morgens 15 Minuten Anstieg"]
        verlauf:
          - {datum: 2026-10-20, status: verworfen, wer: Ida, grund: "Anstieg am Morgen"}
