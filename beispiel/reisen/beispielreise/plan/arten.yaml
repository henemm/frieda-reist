# Arten und Merkmale der Beispielreise (erfunden). Jede Reise legt ihre eigenen fest, im Gespräch im AI-Client;
# diese Datei ist Anschauung, kein Katalog (docs/ontologie.md, ADR-0001). Felder je Art: grundform (aufenthalt |
# bewegung | folge), name, farbe (blau, braun, lila, gruen, tuerkis, oliv, grau, rosa, schiefer), symbol (Zeichen der Seite:
# unterkunft, zelt, einkehr, ticket, museum, wandern, bus, bahn, schiff, flug, auto, rad, taxi; ohne Angabe das der Grundform),
# buchbar (hat einen Buchungsstand; Vorgabe: Aufenthalte ja, Bewegungen nein), summiert (Bewegung
# aus eigener Kraft: Gehzeit, Länge, Höhenmeter werden summiert), merkmale. Felder je Merkmal: name, typ (text | geld |
# zahl | auswahl mit werte), veraenderlich (braucht Prüfdatum), stufe (pflicht = nötig | empfohlen = gut zu wissen |
# angeboten = zusätzlich | aus), rolle (kosten: der Preis des Dings, Typ geld, den die Seite über die Reise summiert; die
# Herberge unten hat keine, weil ihr Preis pro Person gilt), auto
# (berechnet: Bewegung gehzeit, laenge, hoehenmeter; Folge tage, gehzeit, unterkuenfte, anschluss), hilfe, frage, auch.
arten:
  hotel:
    grundform: aufenthalt
    name: Hotel
    farbe: blau
    symbol: unterkunft
    merkmale:
      preis:       {name: Preis pro Nacht, typ: geld, veraenderlich: true, rolle: kosten,
                    hilfe: "Website des Hauses oder Buchungsportal, für das Reisedatum und zwei Personen",
                    frage: "Hast du einen Preis für die Nacht gesehen, und wo?"}
      fruehstueck: {name: Frühstück, typ: auswahl, werte: [inklusive, gegen Aufpreis, keins, unklar], veraenderlich: true,
                    frage: "Ist Frühstück im Preis drin?"}
      geoeffnet:   {name: Geöffnet am Reisedatum, typ: auswahl, werte: [ja, nein, unklar], veraenderlich: true, stufe: pflicht,
                    hilfe: "Saison und Betriebsferien auf der Website; im Zweifel anfragen (als Aufgabe)"}
      lage:        {name: Lage, typ: text, stufe: angeboten, hilfe: "Entfernung zum Weg oder zur Haltestelle; ruhig oder laut"}
  pension:
    grundform: aufenthalt
    name: Pension
    farbe: braun
    merkmale:
      preis:       {name: Preis pro Nacht, typ: geld, veraenderlich: true, rolle: kosten, hilfe: "Website oder Anruf; für zwei Personen"}
      fruehstueck: {name: Frühstück, typ: auswahl, werte: [inklusive, gegen Aufpreis, keins, unklar], veraenderlich: true}
      abendessen:  {name: Abendessen, typ: auswahl, werte: [im Haus, im Haus mit Vorbestellung, im Ort, keins, unklar],
                    hilfe: "Website oder Wanderführer; bei kleinen Häusern zählt die Vorbestellung"}
      lage:        {name: Lage, typ: text, stufe: angeboten}
      webseite:    {name: Webseite, typ: link, hilfe: "Offizielle Website des Hauses (nicht das Buchungsportal)"}
      geoeffnet:   {name: Geöffnet am Reisedatum, typ: auswahl, werte: [ja, nein, unklar], veraenderlich: true, stufe: pflicht,
                    hilfe: "Website oder Anruf; kleine Häuser haben Betriebsferien", frage: "Weißt du, ob das Haus an dem Tag offen hat?"}
  gasthof:
    grundform: aufenthalt
    name: Gasthof
    farbe: braun
    merkmale:
      preis:       {name: Preis pro Nacht, typ: geld, veraenderlich: true, rolle: kosten}
      abendessen:  {name: Abendessen, typ: auswahl, werte: [im Haus, im Haus mit Vorbestellung, im Ort, keins, unklar]}
      ruhetag:     {name: Ruhetag, typ: text, veraenderlich: true, stufe: angeboten, hilfe: "Website; Küche oft an einem Wochentag zu"}
  herberge:
    grundform: aufenthalt
    name: Herberge
    farbe: tuerkis
    merkmale:
      preis:       {name: Preis pro Person, typ: geld, veraenderlich: true, auch: [bett, uebernachtung]}
      fruehstueck: {name: Frühstück, typ: auswahl, werte: [inklusive, gegen Aufpreis, keins, unklar], veraenderlich: true}
      zimmer:      {name: Zimmer, typ: text, hilfe: "Schlafsaal oder Mehrbettzimmer, Bad auf dem Gang", frage: "Welches Zimmer würdet ihr nehmen?"}
      ausweis:     {name: Herbergsausweis nötig, typ: auswahl, werte: [ja, nein, unklar], stufe: angeboten}
  wandern:
    grundform: bewegung
    name: Wanderung
    symbol: wandern
    summiert: true
    merkmale:
      gehzeit:       {name: Gehzeit, auto: gehzeit}
      laenge:        {name: Länge, auto: laenge}
      hoehenmeter:   {name: Höhenmeter, auto: hoehenmeter}
      schwierigkeit: {name: Schwierigkeit, typ: text, hilfe: "Wanderführer; Stufen, Leitern, Trittsicherheit"}
      einkehr:       {name: Einkehr und Wasser, typ: text, stufe: angeboten, hilfe: "Wanderführer, OpenStreetMap"}
    # Gliederung des Lesetexts (Abschnitt Zusammenfassung, Ebene „Der Weg“): je Rubrik ein Absatz, der mit dem fetten
    # Stichwort beginnt. Aufbau wie in Wanderführern (Kurzzeile, Charakter, Verlauf, Höhepunkte, Anforderungen), dazu
    # Rubriken, die diese Reise wichtig findet. Erfunden als Anschauung, kein Katalog (docs/ontologie.md „Lesetext“).
    lesetext:
      charakter:    {name: Charakter, hilfe: "Wie sich der Tag anfühlt: Landschaft, Art des Wegs, Stimmung; zwei, drei Sätze"}
      verlauf:      {name: Verlauf, hilfe: "Der Weg in groben Zügen (Aufstieg, Höhe, Abstieg), keine Wegbeschreibung Punkt für Punkt"}
      hoehepunkte:  {name: Höhepunkte, hilfe: "Was man nicht verpassen sollte; Ausblicke, Bauten, Abstecher"}
      anforderungen: {name: Anforderungen, hilfe: "Kondition, Trittsicherheit, Schlüsselstellen, Orientierung; mit Herkunft"}
      ankommen:     {name: Ankommen, hilfe: "Wann man ungefähr ankommt und was am Ziel bleibt"}
  bahn:
    grundform: bewegung
    name: Bahn
    farbe: schiefer
    symbol: bahn
    buchbar: true
    merkmale:
      preis:        {name: Preis, typ: geld, veraenderlich: true, hilfe: "Fahrplanauskunft des Betreibers"}
      dauer:        {name: Dauer, typ: text, veraenderlich: true, hilfe: "Fahrplanauskunft für den Wochentag der Reise"}
      verkehrt:     {name: Fährt, typ: text, veraenderlich: true, hilfe: "Takt und Betriebstage; Saison beachten"}
      reservierung: {name: Reservierung, typ: auswahl, werte: [Pflicht, empfohlen, nicht nötig, unklar], veraenderlich: true, stufe: angeboten}
    lesetext:     # Eine Bahnfahrt erzählt man anders als eine Wanderung (Anschauung, erfunden)
      strecke:      {name: Strecke, hilfe: "Wohin, wie lange, wie oft man umsteigt"}
      fenster:      {name: Am Fenster, hilfe: "Was man unterwegs sieht und auf welcher Seite man sitzt"}
  bus:
    grundform: bewegung
    name: Bus
    farbe: schiefer
    symbol: bus
    merkmale:
      preis:    {name: Preis, typ: geld, veraenderlich: true}
      dauer:    {name: Dauer, typ: text, veraenderlich: true}
      verkehrt: {name: Fährt, typ: text, veraenderlich: true, hilfe: "Fahrplan; nicht jede Linie fährt täglich"}
  besichtigung:
    grundform: aufenthalt
    name: Besichtigung
    farbe: lila
    symbol: museum
    beschreibung: "Aufenthalt ohne Nacht: Burg, Museum, Aussicht mit Zeitfenster (Beispiel)"
    merkmale:
      geoeffnet:    {name: Geöffnet am Reisedatum, typ: auswahl, werte: [ja, nein, unklar], veraenderlich: true, stufe: pflicht,
                     hilfe: "Website; Winterpause und Ruhetage beachten"}
      eintritt:     {name: Eintritt, typ: geld, veraenderlich: true, hilfe: "Website; Ermäßigungen"}
      dauer:        {name: Dauer, typ: text, stufe: angeboten, hilfe: "Wie lange man etwa bleibt"}
  reiseteil:
    grundform: folge
    name: Reiseteil
    merkmale:
      tage:         {name: Tage, auto: tage}
      gehzeit:      {name: Gehzeit zusammen, auto: gehzeit}
      unterkuenfte: {name: Unterkünfte, auto: unterkuenfte}
      anschluss:    {name: Anschluss, auto: anschluss}
      kosten:       {name: Kosten grob, typ: geld, veraenderlich: true, stufe: angeboten,
                     hilfe: "Unterkünfte plus Fahrkarten, grob und für zwei Personen; Rechnung in die Notiz"}
