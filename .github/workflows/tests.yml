# Tests bei jeder Änderung: Engine-Tests und Browser-Prüfung (Chromium und WebKit).
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    # Die Suite lief seit 2.11.2026 20 Minuten hintereinander (#258) und läuft parallel (pytest-xdist, #322): gemessen 7 Minuten
    # mit drei Prozessen; Spielraum, damit ein langsamer Runner nicht abbricht. 40 statt 25 (#523): Hängt der Ubuntu-Spiegel,
    # verbrauchen die apt-Versuche vor dem Ausweichen auf den Paket-Cache bis zu 15 Minuten, danach laufen die Tests noch ganz
    timeout-minutes: 40
    # Zweiter Lauf mit den Einstellungen einer Instanz, wie veroeffentlichen.sh sie an pytest weitergibt (#202): Keine
    # Prüfung darf davon abhängen (conftest.py entfernt sie). So fiel 1.11.2026 eine Fixture erst auf dem Server auf.
    strategy:
      fail-fast: false
      matrix:
        umgebung: [leer, instanz]
    name: tests (${{ matrix.umgebung }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Hängt der Ubuntu-Spiegel, bricht apt einen stehenden Download nach 30 s ab und versucht es bis zu dreimal (#356).
      # Als Datei, damit es auch für das apt gilt, das Playwright aufruft; einzige Quelle dieser Optionen.
      # Lock::Timeout (#390): `timeout` erreicht das per sudo gestartete apt nicht; es läuft nach der Zeitgrenze weiter und
      # hält die dpkg-Sperre. Versuch 2 wartet darauf, statt sofort mit Exit 100 zu scheitern, und findet dann die Pakete vor.
      # Keep-Downloaded-Packages (#496): heruntergeladene Pakete bleiben in /var/cache/apt/archives für den Paket-Cache.
      - name: apt-Zeitgrenzen
        run: |
          printf '%s\n' 'Acquire::Retries "3";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' 'DPkg::Lock::Timeout "420";' \
            'APT::Keep-Downloaded-Packages "true";' 'Binary::apt::APT::Keep-Downloaded-Packages "true";' \
            | sudo tee /etc/apt/apt.conf.d/80-ci-zeitgrenzen
          sudo rm -f /etc/apt/apt.conf.d/docker-clean
      # Systempakete (rund 180 Pakete, 114 MB für Chromium und WebKit) zwischenspeichern (#496): Der Ubuntu-Spiegel lieferte
      # am 10.11.2026 nur 100–300 KB/s, zwei Versuche zu 240 s reichten nicht. Mit Treffer lädt apt nur, was neuer ist.
      # Getrennt in restore und save: gespeichert wird nach gelungener Installation, auch wenn später ein Test rot ist.
      - name: Paket-Cache laden
        id: apt-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/apt-pakete
          key: apt-${{ runner.os }}-${{ hashFiles('engine/tests/playwright/package-lock.json') }}
      - name: Pakete aus dem Cache bereitlegen
        run: |
          mkdir -p ~/apt-pakete
          find ~/apt-pakete -name '*.deb' -exec sudo cp -n -t /var/cache/apt/archives/ {} +
      - name: Python-Pakete
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libcairo2 nginx-core   # nginx: Prüfung der Vorlagen (test_betrieb.py)
          pip install -r engine/requirements.txt
      # Browser je Playwright-Version zwischenspeichern; die Systempakete kommen trotzdem aus apt (#356)
      - name: Browser-Cache
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('engine/tests/playwright/package-lock.json') }}
      # Eigene Zeitgrenze als Notbremse und zwei Versuche mit je 4 Minuten, statt bis zur Job-Grenze zu hängen (#356)
      - name: Playwright und Browser (feste Version aus engine/tests/playwright, wie auf jeder Instanz)
        timeout-minutes: 15
        run: |
          cd engine/tests/playwright
          npm ci --no-audit --no-fund
          ok=0
          for versuch in 1 2; do
            if [ "${{ steps.browser-cache.outputs.cache-hit }}" = "true" ]; then
              # Browser aus dem Cache: nur die Systempakete nachinstallieren
              timeout 240 npx playwright install-deps chromium webkit && { ok=1; break; }
            else
              timeout 240 npx playwright install --with-deps chromium webkit && { ok=1; break; }
            fi
            echo "::warning::Playwright-Installation, Versuch $versuch gescheitert (Exit-Code $?, 124 = Zeitgrenze von 240 s)"
          done
          # Hängt der Spiegel ganz (11.11.2026, #523: azure.archive und archive.ubuntu.com, apt wollte nur ein neueres
          # libsoup), die Systempakete aus dem Paket-Cache ohne Download installieren. Ein hängendes apt aus Versuch 2
          # wird vorher beendet; es hängt beim Laden, noch vor dpkg.
          if [ "$ok" != 1 ] && [ "${{ steps.browser-cache.outputs.cache-hit }}" = "true" ] && ls ~/apt-pakete/*.deb >/dev/null 2>&1; then
            sudo pkill -x apt-get || true
            sleep 3
            fehlend=()   # nur Pakete, die noch nicht installiert sind; ein installiertes nie auf die Cache-Fassung zurückstufen
            for d in ~/apt-pakete/*.deb; do
              dpkg -s "$(dpkg-deb -f "$d" Package)" >/dev/null 2>&1 || fehlend+=("$d")
            done
            if [ "${#fehlend[@]}" = 0 ] || sudo apt-get install -y -q --no-download --no-install-recommends "${fehlend[@]}"; then
              ok=1
              echo "::warning::Ubuntu-Spiegel antwortet nicht, Systempakete aus dem Paket-Cache installiert (#523)"
            fi
          fi
          if [ "$ok" != 1 ]; then
            echo "::error::Playwright-Installation zweimal gescheitert (Ubuntu-Spiegel oder Playwright-CDN antwortet nicht), Abbruch"
            exit 1
          fi
          echo "PLAYWRIGHT_MODUL=$PWD/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
      - name: Paket-Cache füllen
        if: steps.apt-cache.outputs.cache-hit != 'true'
        run: find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -exec cp -t ~/apt-pakete/ {} +
      - name: Paket-Cache speichern
        if: steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/apt-pakete
          key: ${{ steps.apt-cache.outputs.cache-primary-key }}
      - name: Einstellungen einer Instanz nachstellen
        if: matrix.umgebung == 'instanz'
        run: |
          {
            echo "FR_WURZEL=/srv/beispiel/_bau"; echo "FR_INSTANZ=beispiel"; echo "FR_TITEL=Beispiel-Reisen"
            echo "FR_SEITEN=/srv/beispiel"; echo "FR_DIENST=/srv/beispiel/_dienst"; echo "FR_ABLAGE=/srv/beispiel/_rueckmeldungen"
            echo "FR_KONNEKTOR=/srv/beispiel/_konnektor"; echo "FR_KONTEN=/srv/beispiel/_konten"
            echo "FR_RM_PORT=8781"; echo "FR_KN_PORT=8782"; echo "FR_SB_PORT=8783"; echo "FR_SCHREIBKOPIE=/srv/beispiel/_bau-schreiben"
            echo "FR_ADRESSE=https://reisen.example.org"; echo "FR_KN_ADRESSE=https://reisen.example.org"
            echo "FR_UMZUG_NACH=https://neu.example.org"; echo "FR_SPRACHEN=de,en"; echo "FR_KENNUNG=Beispiel-Reisen/1 (betrieb@example.org)"
            echo "FR_PYTHON=/srv/beispiel/_bau/engine/.venv/bin/python"; echo "FR_MELDEN=/srv/beispiel/_bau/betrieb/melden.sh"
            echo "FR_SPERREN=/tmp"; echo "FR_NACHZIEHEN_WORKFLOW=software-nachziehen.yml"; echo "FR_GEPRUEFT=0000000"
            echo "FR_WEGE_SPAETER=1"; echo "FR_BIBLIOTHEKEN_NEU=1"
            echo "FR_BASIS=https://reisen.example.org"; echo "FR_SMTP_HOST=smtp.example.org"; echo "FR_SMTP_PORT=587"
            echo "FR_SMTP_USER=beispiel"; echo "FR_SMTP_PASS=nicht-echt"; echo "FR_ABSENDER=reisen@example.org"; echo "FR_MELDEN_AN=betrieb@example.org"
            echo "RM_ABLAGE=/srv/beispiel/_rueckmeldungen"; echo "KN_SEITEN=/srv/beispiel"; echo "KN_ZUGAENGE=/srv/beispiel/_konnektor/zugaenge.json"
            echo "KN_BASIS=https://reisen.example.org"
          } >> "$GITHUB_ENV"
      - name: Tests
        run: python -m pytest -q -rs -n auto engine/tests
        env:
          RH_BILDER: ${{ github.workspace }}/bilder
      - name: Bilder der Bausteinseite (Handy und Rechner, hell und dunkel) zur Durchsicht
        if: always() && matrix.umgebung == 'leer'
        uses: actions/upload-artifact@v7
        with:
          name: bausteine
          path: bilder/
          if-no-files-found: ignore
      - name: Browser-Prüfung darf nicht übersprungen worden sein
        run: python -m pytest -q engine/tests/test_pwa.py -k offline_im_browser -rs | tee /tmp/pwa.txt; ! grep -qi skipped /tmp/pwa.txt
