# Grundliste der Merkmale für Alternativen (Optionen an Wahlstellen), je Bereich.
# Standard und Ablauf: docs/alternativen.md. 26.10.2026: Mischform – diese Liste gilt für alle
# Reisen, eine Reise ergänzt sie in plan/routen.yaml unter „merkmale:“, eine Wahlstelle unter „merkmale:“.
#
# Felder je Merkmal:
#   name           Anzeige auf der Seite
#   typ            text | geld | zahl | auswahl (dann „werte“)
#   veraenderlich  true: Wert braucht ein Prüfdatum (geprueft), sonst steht „ungeprüft“ daneben
#   auto           wird aus dem Plan berechnet (Kennzahlen der Strecken, Tage) und nie von Hand eingetragen
#   hilfe          wie Claude den Wert selbst recherchiert
#   frage          wie Claude den Bestimmer gezielt fragt, wenn die Recherche nichts ergibt

unterkunft:
  preis:
    name: Preis pro Nacht
    typ: geld
    veraenderlich: true
    hilfe: "Website des Hauses, Booking.com; für das Reisedatum und zwei Personen, mit oder ohne Frühstück angeben"
    frage: "Hast du einen Preis für die Nacht (für euch zu zweit)? Wo hast du ihn gesehen?"
  fruehstueck:
    name: Frühstück
    typ: auswahl
    werte: [inklusive, gegen Aufpreis, keins, unklar]
    veraenderlich: true
    hilfe: "Website, Buchungsportal; bei Widerspruch „unklar“ mit Notiz"
    frage: "Ist Frühstück im Preis drin?"
  abendessen:
    name: Abendessen
    typ: auswahl
    werte: [im Haus, im Haus mit Vorbestellung, im Ort, keins, unklar]
    hilfe: "Website, Wanderführer; bei Refugis zählt die Vorbestellung"
    frage: "Wollt ihr dort zu Abend essen, und weißt du, ob das Haus Essen anbietet?"
  geoeffnet:
    name: Geöffnet am Reisedatum
    typ: auswahl
    werte: [ja, nein, unklar]
    veraenderlich: true
    hilfe: "Saison und Betriebsferien auf der Website; im Zweifel per Mail anfragen (als Aufgabe)"
    frage: "Weißt du, ob das Haus an dem Tag offen hat?"
  zimmer:
    name: Zimmer
    typ: text
    hilfe: "Doppelzimmer, Schlafsaal, Bad im Zimmer oder auf dem Gang"
    frage: "Welches Zimmer würdet ihr nehmen?"
  lage:
    name: Lage
    typ: text
    hilfe: "Entfernung zum Weg, zur Haltestelle oder zur Ortsmitte; ruhig oder laut"
  stornierung:
    name: Stornierung
    typ: text
    veraenderlich: true
    hilfe: "Bedingungen im Buchungsportal, bis wann kostenlos"
    frage: "Kennst du die Stornobedingungen?"

strecke:
  gehzeit: {name: Gehzeit, typ: text, auto: gehzeit}
  laenge: {name: Länge, typ: text, auto: laenge}
  hoehenmeter: {name: Höhenmeter, typ: text, auto: hoehenmeter}
  schwierigkeit:
    name: Schwierigkeit
    typ: text
    hilfe: "Wanderführer, Komoot; Kettenstellen, Trittsicherheit, Markierung"
  einkehr:
    name: Einkehr und Wasser
    typ: text
    hilfe: "Wanderführer, OpenStreetMap; Bar, Brunnen, Laden unterwegs"
  bedingung:
    name: Geht nur, wenn
    typ: text
    hilfe: "Wetter, Jahreszeit, Sperrungen; bei Unterwegs-Wahlstellen steht der Auslöser zusätzlich in „ausloeser“"

route:
  tage: {name: Tage, typ: text, auto: tage}
  gehzeit: {name: Gehzeit zusammen, typ: text, auto: gehzeit}
  unterkuenfte: {name: Unterkünfte, typ: text, auto: unterkuenfte}
  anschluss: {name: Anschluss, typ: text, auto: anschluss}
  kosten:
    name: Kosten grob
    typ: geld
    veraenderlich: true
    hilfe: "Unterkünfte plus Fahrkarten, grob und für zwei Personen; Rechnung in die Notiz"
  verkehrsmittel:
    name: Verkehrsmittel
    typ: text
    hilfe: "Zug, Bus, Fähre, Mietwagen; was reserviert werden muss"
  fahrzeit:
    name: Fahrzeit zusammen
    typ: text
    veraenderlich: true
    hilfe: "Fahrplanauskunft für die Wochentage der Reise"

# Arten von Bewegungen (Strecken mit art: faehre, flug, bahn, bus, mietwagen). Die Art einer Strecke bestimmt die Liste;
# gemischte Optionen (z. B. Bahn und Fähre) nehmen die Liste „strecke“. Werte stehen an der Strecke (E-…) oder an der Option.
faehre:
  preis: {name: Preis, typ: geld, veraenderlich: true, hilfe: "Website der Reederei; Preis für das Reisedatum und die Personenzahl, mit Kabinenart", frage: "Hast du einen Preis für die Überfahrt?"}
  dauer: {name: Dauer, typ: text, veraenderlich: true, hilfe: "Fahrplan der Reederei; Abfahrts- und Ankunftszeit"}
  verkehrt: {name: Fährt, typ: text, veraenderlich: true, hilfe: "Fahrtage laut Fahrplan; nicht jede Linie fährt täglich", frage: "Weißt du, an welchen Tagen die Fähre fährt?"}
  buchung: {name: Buchung, typ: auswahl, werte: [nötig, empfohlen, nicht nötig, unklar], veraenderlich: true, hilfe: "Website der Reederei; Kabinen sind oft früh ausgebucht"}
  stornierung: {name: Stornierung, typ: text, veraenderlich: true, hilfe: "Bedingungen der Reederei"}
flug:
  preis: {name: Preis, typ: geld, veraenderlich: true, hilfe: "Flugsuche für das Reisedatum und die Personenzahl", frage: "Hast du einen Preis für den Flug?"}
  abflughafen: {name: Abflughafen, typ: text, hilfe: "Flughafen und Weg dorthin"}
  voraussetzung: {name: Voraussetzung, typ: text, hilfe: "z. B. Gabelflug (anderer Rückflughafen als Ankunft), Visum, Einreiseformular"}
  gepaeck: {name: Gepäck, typ: text, veraenderlich: true, hilfe: "Freigepäck laut Tarif"}
  umsteigen: {name: Umsteigen, typ: auswahl, werte: [direkt, mit Umstieg, unklar], veraenderlich: true, hilfe: "Flugsuche"}
  stornierung: {name: Stornierung, typ: text, veraenderlich: true, hilfe: "Tarifbedingungen"}
bahn:
  preis: {name: Preis, typ: geld, veraenderlich: true, hilfe: "Fahrplanauskunft des Betreibers"}
  dauer: {name: Dauer, typ: text, veraenderlich: true, hilfe: "Fahrplanauskunft für den Wochentag der Reise"}
  verkehrt: {name: Fährt, typ: text, veraenderlich: true, hilfe: "Takt und Betriebstage; Saison beachten"}
  reservierung: {name: Reservierung, typ: auswahl, werte: [Pflicht, empfohlen, nicht nötig, unklar], veraenderlich: true, hilfe: "Betreiber"}
bus:
  preis: {name: Preis, typ: geld, veraenderlich: true, hilfe: "Fahrplanauskunft des Betreibers"}
  dauer: {name: Dauer, typ: text, veraenderlich: true, hilfe: "Fahrplanauskunft für den Wochentag der Reise"}
  verkehrt: {name: Fährt, typ: text, veraenderlich: true, hilfe: "Takt und Betriebstage; Saison und Feiertage beachten"}
  reservierung: {name: Reservierung, typ: auswahl, werte: [Pflicht, empfohlen, nicht nötig, unklar], veraenderlich: true, hilfe: "Betreiber"}
mietwagen:
  preis: {name: Preis, typ: geld, veraenderlich: true, hilfe: "Vermieter oder Vergleichsportal, für die Mietdauer"}
  abholung: {name: Abholung, typ: text, hilfe: "Ort und Zeiten"}
  rueckgabe: {name: Rückgabe, typ: text, hilfe: "Ort und Zeiten; Aufpreis bei anderem Ort"}
  bedingung: {name: Bedingungen, typ: text, hilfe: "Führerschein, Mindestalter, Versicherung, Kaution"}

# Arten von Aufenthalten außer der Unterkunft: Essen und Erlebnisse. Eine Wahlstelle dieser Art hat keinen eigenen Baustein,
# sie sagt ihre Art mit „bereich: essen“ bzw. „bereich: erlebnis“ und hängt mit „an:“ an einen Tag, Ort oder eine Strecke.
essen:
  preis: {name: Preis, typ: geld, veraenderlich: true, hilfe: "Speisekarte oder Bewertungsportal; für zwei Personen mit Getränk"}
  kueche: {name: Küche, typ: text, hilfe: "Website, Bewertungsportal"}
  geoeffnet: {name: Geöffnet am Reisedatum, typ: auswahl, werte: [ja, nein, unklar], veraenderlich: true, hilfe: "Öffnungszeiten und Ruhetag; im Zweifel anrufen", frage: "Weißt du, ob es an dem Tag offen hat?"}
  reservierung: {name: Reservierung, typ: auswahl, werte: [nötig, empfohlen, nicht nötig, unklar], veraenderlich: true, hilfe: "Website, Telefon"}
  lage: {name: Lage, typ: text, hilfe: "Entfernung zur Unterkunft oder zum Weg"}
erlebnis:
  preis: {name: Preis, typ: geld, veraenderlich: true, hilfe: "Website des Anbieters; Eintritt oder Führung für zwei Personen"}
  dauer: {name: Dauer, typ: text, hilfe: "Website, Reiseführer; inklusive Anfahrt"}
  geoeffnet: {name: Geöffnet am Reisedatum, typ: auswahl, werte: [ja, nein, unklar], veraenderlich: true, hilfe: "Öffnungszeiten, Saison, Ruhetage", frage: "Weißt du, ob es an dem Tag offen hat?"}
  reservierung: {name: Reservierung, typ: auswahl, werte: [nötig, empfohlen, nicht nötig, unklar], veraenderlich: true, hilfe: "Website, Telefon"}
  lage: {name: Lage, typ: text, hilfe: "Entfernung zur Unterkunft oder zum Weg"}

allgemein: {}
