<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>Frieda Reist</title>
<!-- Pico CSS 2.1.1 (MIT, picocss.com), lokal ausgeliefert und vorab gespeichert; gilt nur in .pico (main, Rückmeldefenster) -->
<link rel="stylesheet" href="pico-2.1.1.min.css">
<!-- Leaflet 1.9.4 (BSD-2, leafletjs.com), lokal ausgeliefert, nur für die Karte in „Varianten“ -->
<link rel="stylesheet" href="leaflet-1.9.4.css">
<style>
/* Designsystem nach Atomic Design (docs/design.md): Tokens, Grundlagen, Atome, Moleküle, Organismen, Vorlagen,
   Rahmen der Seite, zuletzt die Breiten. Jeder Baustein steht einmal; was ein Baustein in einem anderen anders macht,
   steht beim umfassenden Baustein. Funktionen gleichen Namens im Skript zeichnen die Bausteine.
   Gesicht „Freundlich“ (B2, frieda-reist#52, 27.10.2026; vorher „Wanderführer“): heller Grund, frisches Grün, weiche
   Flächen ohne Rahmen, Etiketten in normaler Schreibweise, Kennzahlen als Kacheln. Schrift: Source Sans 3 für Titel und
   Text (OFL, lokal in engine/vendor/fonts, Lizenz dort), Zeichensätze latin und latin-ext (z. B. ō, ū). */
@font-face{font-family:"Source Sans 3";font-style:normal;font-weight:200 900;font-display:swap;src:url(source-sans-3-latin-ext-wght-normal.woff2) format("woff2-variations");
  unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C4,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:"Source Sans 3";font-style:normal;font-weight:200 900;font-display:swap;src:url(source-sans-3-latin-wght-normal.woff2) format("woff2-variations");
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

/* ==================== 1 Tokens: Farben, Schrift, Breiten, Maße der Leiste ==================== */
/* Farb-Tokens: --bg Grund, --card Fläche, --fg Text, --mut gedämpft (Etiketten, Nebentext), --line Linie, --acc/--acc2
   Akzent und helle Akzentfläche, --warn/--warnbg offen, --ocker Rand für „unterwegs“; Plan- und Kartenfarben
   dataviz-geprüft; --farbe-* Palette für die Arten der Reise (arten.yaml: farbe). Die Leiste ist Glas über dem Inhalt (Rahmen der Seite).
   Kontrast (WCAG): Text auf Grund und Fläche mindestens 4,5:1, hell und dunkel (geprüft 27.10.2026). */
:root{--font-text:"Source Sans 3",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
/* Schriftleiter (Product Owner 29.10.2026): fünf Stufen, jede Schriftgröße der Seite ist eine davon (Test). Titel einer
   Ansicht oder eines Tags; Untertitel einer Ebene, Gruppe oder Kachel; Text für Fließtext, Werte und Tabellen; Nebentext
   für Hinweise, Verlauf, Knöpfe; Etikett für Etiketten, Pillen, Datum. Ausnahmen mit eigener Größe: die Ziffer der
   Tagesnummer, die Beschriftung der Leiste unten (Rahmen) und die Karte (px, Leaflet). */
:root{--t-titel:1.75rem;--t-untertitel:1.2rem;--t-text:1.0625rem;--t-klein:0.875rem;--t-etikett:0.8125rem}
:root{--plan-a:#c62a2a;--plan-b:#008a7e;--plan-c:#7a4db0;--plan-d:#b07800;--sea:#d9e6ea;--land:#eceadf;--land-edge:#b7b4a3;--peak:#8a8573;--water:#9cc3d1;--bus:#6f7772;--skip:#9a9a90;--farbe-blau:#1f3b57;--farbe-braun:#8a4b2a;--farbe-lila:#6a4c93;--farbe-gruen:#2c6e49;--farbe-tuerkis:#3f7f8c;--farbe-oliv:#7a7a1f;--farbe-schiefer:#555a50;--farbe-rosa:#a0446a;--farbe-grau:#6f7772;--bg:#f8f8f5;--fg:#1d2420;--mut:#5b645e;--ocker:#6a756e;--card:#ffffff;--line:#e4e5df;--acc:#1f7a57;--acc2:#e3f1ea;--warn:#9a5b00;--warnbg:#fbeed6;--mark:#ffe58a}
@media (prefers-color-scheme:dark){:root{--plan-a:#e8507a;--plan-b:#2fa9a0;--plan-c:#a07ad6;--plan-d:#b98a00;--sea:#14232a;--land:#222823;--land-edge:#3d453e;--peak:#8d8a7c;--water:#2f5e70;--bus:#8d958f;--skip:#6d716c;--farbe-blau:#7fa9d6;--farbe-braun:#d39a6f;--farbe-lila:#b49ae0;--farbe-gruen:#5cbf86;--farbe-tuerkis:#79c3cf;--farbe-oliv:#c9c96a;--farbe-schiefer:#a9ad9f;--farbe-rosa:#e08fb0;--farbe-grau:#8d958f;--bg:#151816;--fg:#eceee9;--mut:#a5aca6;--ocker:#a5aca6;--card:#1d211e;--line:#2c312d;--acc:#6fd0a5;--acc2:#1f3329;--warn:#f0c46a;--warnbg:#3a3017;--mark:#6b5a10}}
/* Formen: Radien (klein für Knöpfe, normal für Karten, Kachel, groß für die Fläche, an der man handelt, Pille) und Schatten */
:root{--tint:color-mix(in srgb,var(--acc2) 60%,var(--bg));--r-klein:8px;--r:12px;--r-kachel:14px;--r-gross:18px;--r-pille:99px;
  --schatten:0 1px 2px rgba(20,30,25,.05),0 6px 24px rgba(20,30,25,.06);--schatten-klein:0 1px 3px rgba(20,30,25,.12)}
/* Breite: Kopf und alle Ansichten teilen --breite, Fließtext bleibt auf Lesebreite (--lese); Werte je Breite unten */
:root{--breite:860px;--lese:44rem}
:root{--tabbar-h:60px;--knopf:46px;--tabbar-gap:max(12px,calc(env(safe-area-inset-bottom,0px) - 10px));--tabbar-space:calc(var(--tabbar-h) + var(--tabbar-gap) + 24px);--hoehe-fehlt:0px}
/* --hoehe-fehlt: Als App vom Home-Bildschirm vergisst iOS nach dem Schließen der Tastatur manchmal die volle Höhe,
   bis die App neu startet; der untere Rand für „fixed“ liegt dann mitten im Bild. Das Skript („Höhe als App“) setzt
   den Fehlbetrag, die Leiste und alles, was unten sitzt, rücken um ihn nach unten. Sonst 0. */

/* ==================== 2 Grundlagen: Seite, Text, Pico CSS, Reisetexte ==================== */
/* Schriftgröße: alle Größen sind rem, am Rechner wächst die Wurzel (Handy und ab 760 px 16 px, ab 1100 px 17 px; Text damit 17 bzw. 18 px, Product Owner 29.10.2026). */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;font-size:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:var(--t-text)/1.55 var(--font-text)}
main{max-width:var(--breite);margin:0 auto;padding:14px 14px 0;overflow-wrap:break-word}
main :is(p,ul,ol,blockquote,dl):not(:where(.karte,.ding,.wm,.option,.steckbrief,.wm-karte,.fnbox) *){max-width:var(--lese)}
a{color:var(--acc)}
main code{overflow-wrap:anywhere}
details{margin:0 0 10px}
summary{cursor:pointer}
.ziel{scroll-margin-top:calc(70px + env(safe-area-inset-top))}
.blitz{animation:blitz 2s}
@keyframes blitz{0%,60%{outline:3px solid var(--acc)}100%{outline:3px solid transparent}}
mark{background:var(--mark);color:inherit;border-radius:3px}
.leer{color:var(--mut);padding:20px 0;text-align:center}
.meldung{font-size:var(--t-klein);color:var(--mut);margin:8px 0}
.unsichtbar{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px;border-radius:4px}
/* ---------- Pico CSS an die eigenen Farben binden (hell und dunkel folgen --bg/--fg/--acc) ---------- */
:root:not([data-theme=dark]):not([data-theme=light]){
  --pico-font-family:var(--font-text);
  --pico-background-color:var(--bg);--pico-color:var(--fg);--pico-muted-color:var(--mut);--pico-muted-border-color:var(--line);
  --pico-h1-color:var(--fg);--pico-h2-color:var(--fg);--pico-h3-color:var(--fg);--pico-h4-color:var(--fg);--pico-h5-color:var(--fg);--pico-h6-color:var(--fg);
  --pico-primary:var(--acc);--pico-primary-background:var(--acc);--pico-primary-border:var(--acc);--pico-primary-underline:color-mix(in srgb,var(--acc) 50%,transparent);
  --pico-primary-hover:var(--fg);--pico-primary-hover-background:color-mix(in srgb,var(--acc) 85%,var(--fg));--pico-primary-hover-border:var(--pico-primary-hover-background);
  --pico-primary-focus:color-mix(in srgb,var(--acc) 35%,transparent);--pico-primary-inverse:var(--bg);
  --pico-card-background-color:var(--card);--pico-card-sectioning-background-color:var(--card);
  --pico-form-element-background-color:var(--card);--pico-form-element-border-color:var(--line);--pico-form-element-color:var(--fg);
  --pico-form-element-focus-color:var(--acc);--pico-table-border-color:var(--line);--pico-table-row-stripped-background-color:var(--acc2);
  --pico-mark-background-color:var(--mark);--pico-mark-color:var(--fg);--pico-border-radius:10px}
.pico th{background:var(--acc2);font-weight:600}
.pico :is(h1,h2,h3,h4){font-family:var(--font-text);font-weight:700;text-wrap:balance;letter-spacing:-.01em}
/* Pico bringt eigene Größen für Überschriften, Knöpfe und Felder mit; hier gelten die Stufen der Schriftleiter */
.pico :is(h1,h2){--pico-font-size:var(--t-titel)}
.pico :is(h3,h4){--pico-font-size:var(--t-untertitel)}
.pico :is(h5,h6){--pico-font-size:var(--t-text)}
.pico :is(button,[role=button],[type=button],[type=submit],[type=reset],input,select,textarea){font-size:var(--t-text)}
.pico :is(code,kbd,samp,pre,small){font-size:var(--t-klein)}
.pico table{font-variant-numeric:tabular-nums}
.pico .tabelle table{margin:0}
.pico button.klein{font-size:var(--t-klein);padding:6px 12px}
.pico details.block>summary,.pico details.neben>summary,.pico details.weg>summary{margin:0}
/* ---------- Reisetexte: Tabellen, Bilder, Kartenpunkte im Text, Fußnoten (docs/design.md, Reisetexte) ---------- */
/* Tabellen (bauen.tabellen_ordnen): zweispaltig als Merkmalliste, breiter als Tabelle. Die Hülle .tabelle ist der
   Behälter: Ist sie schmal (unter 700 px, am Handy oder in der rechten Spalte), steht das Merkmal über dem Wert und jede
   Tabellenzeile wird ein Eintrag (erste Spalte fett, übrige „Spalte: Wert“, leere entfallen). Nichts steht seitlich über. */
.tabelle{container:tabelle / inline-size;overflow-x:auto;margin:.6em 0;-webkit-overflow-scrolling:touch}
dl.textmerkmale{margin:0}
dl.textmerkmale>div{display:grid;grid-template-columns:minmax(9rem,14rem) minmax(0,1fr);border-top:1px solid var(--line)}
dl.textmerkmale>div:last-child{border-bottom:1px solid var(--line)}
dl.textmerkmale dt{padding:8px 14px 8px 0;hyphens:auto;overflow-wrap:normal}
dl.textmerkmale dd{margin:0;padding:8px 0;overflow-wrap:break-word;min-width:0}
@container tabelle (max-width:699px){
  dl.textmerkmale>div{grid-template-columns:minmax(0,1fr);padding:8px 0}
  dl.textmerkmale dt{padding:0}
  dl.textmerkmale dd{padding:2px 0 0}
  .pico .tabelle.stapel :is(table,tbody,tr,td){display:block;width:auto}
  .pico .tabelle.stapel thead{display:none}
  .pico .tabelle.stapel tr{border-top:1px solid var(--line);padding:8px 0}
  .pico .tabelle.stapel tr:last-child{border-bottom:1px solid var(--line)}
  /* !important: Spaltenausrichtung aus dem Markdown steht als style an der Zelle */
  .pico .tabelle.stapel td{border:0;padding:1px 0;background:none;--pico-background-color:transparent;text-align:start!important}
  .pico .tabelle.stapel td:first-child{font-weight:700}
  .pico .tabelle.stapel td:not(:first-child)[data-spalte]::before{content:attr(data-spalte) ": ";color:var(--mut);font-size:var(--t-klein);font-weight:600}
  .pico .tabelle.stapel td.leer{display:none}
}
img{max-width:100%;height:auto;border-radius:6px}
a.bild{display:block;margin:6px 0;list-style:none}
a.bild span{display:block;font-size:var(--t-etikett);color:var(--mut)}
ul li:has(>a.bild){list-style:none;margin-left:-22px;font-size:var(--t-etikett);color:var(--mut)}
a.kp{white-space:nowrap}
a.kp::before{content:"";display:inline-block;width:.7em;height:.7em;margin-right:.18em;border-radius:50% 50% 50% 0;transform:rotate(-45deg) translateY(.05em);background:currentColor;opacity:.75}
.kp-blink{animation:kpblink 1.6s ease-out}
@keyframes kpblink{0%,40%{background:var(--warnbg)}100%{background:transparent}}
/* Fußnoten: Nummer antippen zeigt den Nachweis an der Stelle; Liste am Blockende (25.10.2026) */
.pico sup.fn{font-size:.72em;line-height:0}
.pico sup.fn button{all:unset;display:inline-block;line-height:1.3;min-width:1.2em;text-align:center;cursor:pointer;color:var(--acc);font-weight:600;padding:.1em .2em;border-radius:4px}
.pico sup.fn button[aria-expanded="true"]{background:var(--acc2)}
.pico sup.fn button:focus-visible{outline:2px solid var(--acc)}
.fnbox{display:block;margin:.3em 0 .5em;padding:.4em .6em;border-left:3px solid var(--acc);background:var(--card);font-size:var(--t-klein);line-height:1.4;color:var(--mut)}
ol.fussnoten{margin:1em 0 0;padding-top:.6em;border-top:1px solid var(--line);font-size:var(--t-etikett);line-height:1.4;color:var(--mut)}
ol.fussnoten li{margin:0 0 .25em;overflow-wrap:anywhere}

/* ==================== 3 Atome ==================== */
/* ---------- Atom Symbol (Lucide, eingebettet als <symbol>) ---------- */
.sym{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* ---------- Atom Zustand (chip): feste Namen, die Farbe folgt der Bedeutung ---------- */
.chip{font-size:var(--t-etikett);background:var(--acc2);color:var(--acc);border-radius:var(--r-pille);padding:2px 10px;max-width:100%;overflow-wrap:break-word}
.chip.plan{background:var(--acc);color:var(--bg);font-weight:700}
.chip.neben{background:transparent;color:var(--mut);border:1px solid var(--line)}
.chip.offen{background:var(--warnbg);color:var(--warn)}
.chip.weg{background:transparent;color:var(--mut);border:1px solid var(--line);text-decoration:line-through}
.chip.unterwegs{background:transparent;color:var(--ocker);border:1px solid var(--ocker)}
.chip.st-neu{background:var(--warnbg);color:var(--warn)}
.chip.st-uebernommen{background:var(--acc);color:var(--bg)}
.chip.st-rueckfrage{background:var(--warnbg);color:var(--warn);font-weight:700}
.chip.st-ausstehend{background:transparent;color:var(--mut);border:1px dashed var(--mut)}
.chip.ag-hoch,.chip.ag-ueber{background:var(--warnbg);color:var(--warn);font-weight:700}
.chip.ag-leise{background:transparent;color:var(--mut);border:1px solid var(--line)}
/* Lange Etiketten und Code brechen um, statt auf dem Handy seitlich überzustehen (Bildprüfung 2e): siehe .chip max-width */
/* Atom Wert (Designsystem 2d): Herkunft (Notiz, Prüfdatum, Quelle) hinter dem Wert selbst, erkennbar an der gepunkteten
   Linie (Regel 3 und 7, #58; bis 1.11.2026 hinter einem „i“); je Datum als Liste */
.pico button.mk-w{position:relative;display:inline;width:auto;min-height:0;margin:0;padding:0;border:0;border-radius:0;background:none;box-shadow:none;
  color:inherit;font:inherit;text-align:inherit;cursor:help;text-decoration:underline dotted var(--mut);text-decoration-thickness:1.5px;text-underline-offset:5px}
.pico button.mk-w::after{content:"";position:absolute;inset:-12px -4px}
.pico button.mk-w[aria-expanded="true"],.pico button.mk-w:hover{text-decoration-color:var(--acc)}
.pico button.mk-w:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:3px}
.mk-unklar,.pico button.mk-w.mk-unklar{color:var(--warn);font-weight:700}
.mk-luecke,.pico button.mk-w.mk-luecke{color:var(--warn)}
/* Herkunft schwebt über der Seite (auch über Tabellen mit seitlichem Rollen), Lage setzt mkZeige */
.mk-q{position:fixed;z-index:60;width:max-content;max-width:min(22rem,calc(100vw - 32px));padding:7px 11px;border:1px solid var(--line);
  border-radius:10px;background:var(--card);color:var(--fg);box-shadow:var(--schatten,0 4px 18px rgba(0,0,0,.14));
  font:400 var(--t-klein)/1.4 var(--font-text);white-space:normal;text-align:left;overflow-wrap:anywhere}
.mk-q[hidden]{display:none}
.mk-datum{display:block}
.mk-am{font-size:var(--t-etikett);font-weight:700;color:var(--ocker)}
.mk-am-tag{display:inline-block;margin-left:6px;font-size:var(--t-etikett);font-weight:700;color:var(--ocker);border:1px solid var(--ocker);border-radius:4px;padding:0 5px;vertical-align:1px}
.mk-chip{margin-left:6px;font-size:var(--t-etikett);padding:1px 7px}
.mk-leer{color:var(--mut);border-bottom:1px dashed var(--line)}
.mk-nichts{color:var(--mut)}
/* ---------- Atom Etikett: sagt, was etwas ist (Nacht, Gehzeit, Start …); normale Schreibweise, gedämpft ----------
   Ein Symbol davor (.etikett-sym) nur, wo es die Art sofort zeigt (Nacht, Wahl, Ort, Kennzahlen). */
:is(.etikett,.ding-art,.tagdatum,.kzn,.wv-etikett),dl.textmerkmale dt{font:600 var(--t-etikett)/1.3 var(--font-text);letter-spacing:0;text-transform:none;color:var(--mut)}
.etikett-sym{width:1rem;height:1rem;color:var(--acc)}
/* ---------- Atom Planfarbe: Punkt oder Linie ---------- */
.plan-linie{width:16px;border-top:4px solid var(--farbe);display:inline-block}
.punkt{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--farbe);margin-right:4px}
h2 .punkt,h2 i.punkt{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--farbe);margin-right:8px;vertical-align:middle}
/* ---------- Atom Kennung (zid): Rückmeldungen und Aufgaben zu einer Stelle (B2, frieda-reist#56, 27.10.2026) ----------
   „Symbol oder Wort, nie beides“: Anmerken braucht man nur vielleicht, deshalb nur die Sprechblase mit Tooltip, überall
   gleich. Leer blass (bei Hover und Fokus voll), mit Rückmeldungen grün gefüllt, die Zahl nur für offene, offene Aufgabe als Warnpunkt.
   Tippfläche 44 × 44 px. Die Kennung selbst (T-01 …) steht im Fenster, das sich öffnet, mit „Kopieren“.
   Deckkraft leer 0,7 statt der erprobten 0,55: so hat das Symbol 3:1 Kontrast (WCAG 1.4.11), hell und dunkel. */
.zid-box{position:relative;display:inline-flex;align-items:center;max-width:100%;vertical-align:middle}
.zid{font:var(--t-etikett) ui-monospace,Menlo,monospace;color:var(--mut);margin-left:8px;white-space:nowrap}   /* ohne Rückmeldungen: Kennung als Text */
/* .pico davor: sonst gewinnt Pico CSS mit hellem Text auf hellem Grund */
.pico button.zid{position:relative;display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;min-height:44px;padding:0;margin:0 -10px 0 0;
  border:0;border-radius:var(--r-klein);background:none;box-shadow:none;transition:none;cursor:pointer;opacity:.7;
  color:var(--mut);--pico-color:var(--mut);--pico-background-color:transparent;--pico-border-color:transparent}
.pico button.zid:focus-visible{opacity:1}
.pico button.zid:is(.hat-rm,.hat-ag){opacity:1}
.pico button.zid.hat-rm{color:var(--acc);--pico-color:var(--acc)}
button.zid .zid-blase{width:1.25rem;height:1.25rem}
button.zid.hat-rm .zid-blase{fill:var(--acc2)}
.zid-n{position:absolute;top:3px;right:1px;display:inline-flex;align-items:center;justify-content:center;min-width:1.2rem;height:1.2rem;padding:0 .3em;
  border-radius:var(--r-pille);background:var(--acc);color:var(--card);font:700 var(--t-etikett)/1 var(--font-text);font-variant-numeric:tabular-nums;box-shadow:0 0 0 2px var(--card)}
.zid-o{position:absolute;bottom:9px;right:8px;width:.6rem;height:.6rem;border-radius:50%;background:var(--warn);box-shadow:0 0 0 2px var(--card)}
/* In Titelzeilen sitzt die Kennung mit Abstand am rechten Rand, damit Tippen auf den Titel sie nicht trifft */
:is(summary,h2,.k,.titelzeile):has(>.zid-box){display:flex;align-items:center;gap:2px 16px;line-height:1.3}
:is(summary,h2,.k,.titelzeile):has(>.zid-box)>.punkt{margin-right:-8px}
:is(summary,h2,.k,.titelzeile)>.zid-box{margin:0 0 0 auto}
.titelzeile>:first-child{flex:1;min-width:0}
@media (hover:hover){
  .pico button.zid:hover{opacity:1;color:var(--acc);--pico-color:var(--acc)}
}
/* Unterwegs (Handy und Tablet) trägt nur, was man schon gelesen hat, eine Sprechblase: nicht der Kopf eines
   zugeklappten Blocks und nicht eine Vorschau (.vorschau: Karte oder Zeile, die zur ganzen Seite führt). Niemand merkt
   etwas an, bevor er den Inhalt gesehen hat; so wird die Seite ruhiger (Entscheidung 28.10.2026). Am Rechner bleibt sie. */
@media (max-width:1099px),(pointer:coarse){
  details:not([open])>summary .zid-box,.vorschau .zid-box{display:none}
}

/* ==================== 4 Moleküle ==================== */
/* ---------- Fläche: Karte und aufklappbarer Block ---------- */
.karte{display:block;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin:0 0 10px;color:inherit;text-decoration:none}
a.karte:active{background:var(--acc2)}
.karte .k{font-weight:700}
.karte .z{margin-top:4px;font-size:var(--t-text)}
.karte .z b{color:var(--mut);font-weight:600}
.karte .z.klein,.verlauf{font-size:var(--t-etikett);color:var(--mut)}
details.block{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
details.block>summary{padding:12px 14px;font-weight:600;cursor:pointer;min-height:44px}
details.block>.inhalt{padding:0 14px 8px}
details.weg>summary{font-size:var(--t-klein);color:var(--mut);padding:8px 0}
/* Fläche, an der man handelt (Tageskasten): weiß, ohne Rahmen, weicher Schatten, großer Radius. Sonst gibt es auf der
   Tagesseite keine Kästen; Lesetext steht ohne Rahmen. */
.karte.flaeche{border:0;border-radius:var(--r-gross);box-shadow:var(--schatten);padding:16px 18px}
/* Wahl-Modul ohne Rahmen (#58): kein Kasten im Kasten, die Karten der Möglichkeiten sind die Flächen */
.karte.wahl-modul{border:0;border-radius:0;background:none;padding:0;box-shadow:none}
details.block>.karte.wahl-modul{padding:0 14px 12px}
.pico .karte .k{font-size:var(--t-text)}
@media (hover:hover){
  a.karte:hover{border-color:var(--acc)}
}
/* ---------- Zustände in einer Reihe, Orte eines Abschnitts ---------- */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.ortchips{margin:2px 0 10px;align-items:center}
details.block>.ortchips{padding:0 14px}
/* ---------- Umschalter: ein Knopf gedrückt ---------- */
.umschalter{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 10px;padding:0;border:0;min-width:0}
.umschalter button{font:inherit;font-size:var(--t-klein);font-weight:600;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:var(--r-pille);padding:8px 13px;min-height:40px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.umschalter button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
/* Eigene Bedienelemente innerhalb von .pico behalten ihr Aussehen */
.pico :is(.umschalter button){width:auto;box-shadow:none;line-height:1.3;transition:none;
  --pico-background-color:var(--card);--pico-border-color:var(--line);--pico-color:var(--fg);background-color:var(--card);border:1px solid var(--line);border-radius:var(--r-pille)}
.pico .umschalter button{margin:0;font-size:var(--t-klein);font-weight:600;color:var(--fg);padding:8px 13px}
.pico .umschalter button[aria-pressed="true"]{--pico-background-color:var(--fg);background-color:var(--fg);color:var(--bg);border-color:var(--fg)}
@media (hover:hover){
  .umschalter button:hover{border-color:var(--acc)}
}
/* ---------- Reiter: Segmentleiste mit Pillen, genau ein Teil offen (Tagesseite: Unterwegs nachschlagen) ---------- */
.reiterleiste{display:flex;gap:4px;overflow-x:auto;padding:4px;margin:0 0 6px;border-radius:var(--r-pille);background:color-mix(in srgb,var(--line) 60%,transparent);
  width:max-content;max-width:100%;scrollbar-width:none}
.pico .reiterleiste button{flex:none;width:auto;margin:0;min-height:40px;padding:0 16px;border:0;border-radius:var(--r-pille);background:none;box-shadow:none;transition:none;
  color:var(--mut);--pico-color:var(--mut);--pico-background-color:transparent;font:600 var(--t-text)/1 var(--font-text);white-space:nowrap;cursor:pointer}
.pico .reiterleiste button[aria-selected="true"]{background:var(--card);color:var(--fg);--pico-color:var(--fg);box-shadow:var(--schatten-klein)}
@media (hover:hover){.pico .reiterleiste button:hover{color:var(--fg);--pico-color:var(--fg)}}
/* ---------- Ebenenkopf: Titel einer Ebene, rechts die Kennung ---------- */
.ebene-kopf{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px}
.pico .ebene-kopf h3{margin:0;font-size:var(--t-untertitel)}
/* ---------- Etikett eines Dings: was es ist, Punkt in der Farbe der Kategorie ---------- */
.ding-art{display:flex;align-items:center;gap:6px}
.ding-art .lg-k{width:9px;height:9px}
/* ---------- Kennzahlenleiste: Gehzeit, Aufstieg, Abstieg, Strecke als hellgrüne Kacheln mit Symbol; am Handy 2 × 2 ---------- */
.kz-huelle{container:kz / inline-size;margin:10px 0}
.kz{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:8px;margin:0}
.kz>div{background:var(--acc2);border-radius:var(--r-kachel);padding:10px 12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kzn{display:flex;align-items:center;gap:6px;color:var(--acc)}
.kzn .sym{width:1.05rem;height:1.05rem}
.kzw{font-size:var(--t-untertitel);font-weight:700;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
@container kz (max-width:419px){.kz{grid-auto-flow:row;grid-template-columns:repeat(2,minmax(0,1fr))}.kz>div:last-child:nth-child(odd){grid-column:1 / -1}}
/* ---------- Wegtabelle (#58): Wege mit Kennzahlen; Rechner Tabelle, Handy und Tablet je Weg ein Eintrag mit Zahlenzeile ---------- */
.pico .wege table{width:100%;font-size:var(--t-text)}
.pico .wege :is(th,td){vertical-align:top;background:none;--pico-background-color:transparent}
.pico .wege thead th{font-size:var(--t-klein);color:var(--mut);font-weight:600}
.pico .wege tbody th{font-weight:600}
.pico .wege .zahl{text-align:end;white-space:nowrap;font-variant-numeric:tabular-nums}
.wege-huelle{container:wege / inline-size;margin:.6em 0}
.wege-huelle>.tabelle{margin:0}
.wege-name{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pico .wege tbody th .chips{margin:2px 0 0}
/* Tabelle ab 960 px Behälterbreite und mit Maus; schmaler oder mit Finger (Tablet) je Weg ein Eintrag. Das Zeigergerät ist keine Breite
   und bleibt eine Media-Query (ADR-0002, Nachtrag Container-Queries). */
@container wege (max-width:959px){
  /* keine Tabelle mehr: die Hülle scrollt nicht (die Tippfläche des Anmerkens ragt sonst als Scrollbereich über den Rand) */
  .wege.tabelle{overflow:visible}
  .pico .wege :is(table,tbody,tr,th){display:block;width:auto}
  .pico .wege thead{display:none}
  .pico .wege tr{border-bottom:1px solid var(--line);padding:8px 0}
  .pico .wege :is(th,td){border:0;padding:0}
  .pico .wege td{display:inline;font-weight:600}
  .pico .wege td.leer{display:none}
  .pico .wege td:not(.leer)~td:not(.leer)::before{content:" · ";color:var(--mut);font-weight:400}
}
@media (pointer:coarse){@container wege (min-width:960px){
  /* keine Tabelle mehr: die Hülle scrollt nicht (die Tippfläche des Anmerkens ragt sonst als Scrollbereich über den Rand) */
    .wege.tabelle{overflow:visible}
    .pico .wege :is(table,tbody,tr,th){display:block;width:auto}
    .pico .wege thead{display:none}
    .pico .wege tr{border-bottom:1px solid var(--line);padding:8px 0}
    .pico .wege :is(th,td){border:0;padding:0}
    .pico .wege td{display:inline;font-weight:600}
    .pico .wege td.leer{display:none}
    .pico .wege td:not(.leer)~td:not(.leer)::before{content:" · ";color:var(--mut);font-weight:400}
}}
/* ---------- Merkmalliste (docs/alternativen.md) ---------- */
dl.mliste{margin:6px 0;font-size:var(--t-text)}
dl.mliste dt{font-size:var(--t-etikett);color:var(--mut);margin-top:6px}
dl.mliste dd{margin:0;overflow-wrap:anywhere}
/* ---------- Legende unter einer Karte ---------- */
.legende{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:var(--t-etikett);color:var(--mut);margin:6px 0}
.legende span{display:inline-flex;align-items:center;gap:6px}
.lg-k{width:11px;height:11px;border-radius:3px;background:var(--kat,var(--farbe-grau))}
.lg-u{width:16px;border-top:3px dotted var(--fg)}
.lg-s{width:16px;border-top:3px dotted var(--skip)}
.lg-b{width:16px;border-top:2px dashed var(--bus)}
.lg-sch{width:16px;border-top:3px dashed var(--plan-a)}
.legende i.rh-p.lg-p{width:12px;height:12px;border-width:1.5px;box-shadow:none}
.legende i{display:inline-block;width:12px;height:12px;margin-right:4px;vertical-align:-1px;border-width:1px}
/* ---------- Listenzeile: Wissen, Praxis, Quellen, Orte ---------- */
.wliste{display:flex;flex-direction:column}
.wzeile{display:flex;gap:14px;align-items:flex-start;padding:13px 0;border-bottom:1px solid var(--line);color:var(--fg);text-decoration:none}
.wliste .wzeile:last-child{border-bottom:0}
.wsym{flex:none;width:40px;height:40px;border-radius:50%;background:var(--acc2);color:var(--acc);display:flex;align-items:center;justify-content:center}
.typ-praxis .wsym{background:var(--warnbg);color:var(--warn)}
.typ-quelle .wsym{background:color-mix(in srgb,var(--mut) 16%,transparent);color:var(--mut)}
.wtext{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.wt{font:600 var(--t-untertitel)/1.25 var(--font-text);letter-spacing:-.01em;text-wrap:balance}
.wu{font-size:var(--t-text);line-height:1.4;color:var(--mut)}
.pico .wzeile>.zid-box{margin:3px 0 0;flex:none}
.pico .wzeile>.chip{flex:none;margin:9px 0 0}
.pico h2.listen-titel{display:flex;align-items:center;gap:10px}
.pico h2.listen-titel>.chip{font-size:var(--t-etikett)}
@media (hover:hover){.wzeile:hover .wt{color:var(--acc)}}
/* ---------- Buchung (B-…, #76) als Block am Ding, Belege darunter ---------- */
.buchung{margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.buchung .z.ueber{color:var(--warn)}
.buchung details.verlauf>summary{cursor:pointer}
/* ---------- Einzelheiten (Stand-Leiter, 31.10.2026): das eine Aufklappen eines Dings, offen bis zur Buchung ---------- */
details.einzelheiten{margin-top:6px}
details.einzelheiten>summary{cursor:pointer;color:var(--acc);font-size:var(--t-klein);font-weight:600;min-height:32px;display:flex;align-items:center}
details.einzelheiten[open]>summary{margin-bottom:4px}
/* Belege (31.10.2026): je Datei eine Zeile wie im Postfach, Aktionen im Menü „···“, Anhängen als Textknopf */
.belege{display:flex;flex-direction:column;gap:6px;margin:6px 0 2px}
.beleg{display:flex;align-items:center;gap:10px;padding:7px 10px;border:1px solid var(--line);border-radius:var(--r-klein);font-size:var(--t-text)}
.beleg-art{flex:none;min-width:34px;height:40px;padding:0 3px;border-radius:var(--r-klein);background:var(--acc2);color:var(--acc);display:grid;place-items:center;font-size:var(--t-etikett);font-weight:700}
.beleg-text{display:flex;flex-direction:column;min-width:0;flex:1}
.beleg-text a{font-weight:600;overflow-wrap:anywhere}
.beleg.weg a{text-decoration:line-through;color:var(--mut)}
.beleg-menue{position:relative;flex:none}
.pico .beleg-menue>summary{list-style:none;cursor:pointer;color:var(--mut);font-weight:700;letter-spacing:2px;padding:6px 8px;border-radius:var(--r-klein);min-height:40px;display:flex;align-items:center}
.pico .beleg-menue>summary::-webkit-details-marker,.pico .beleg-menue>summary::after{display:none}
.beleg-menue[open]>summary{background:var(--acc2)}
.beleg-menue-liste{position:absolute;right:0;top:calc(100% + 4px);z-index:5;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--schatten);padding:4px;display:flex;flex-direction:column;min-width:12rem}
.pico .beleg-menue-liste button{all:unset;cursor:pointer;padding:10px 12px;border-radius:var(--r-klein);font-size:var(--t-klein);color:var(--fg)}
.pico .beleg-menue-liste button:hover,.pico .beleg-menue-liste button:focus-visible{background:var(--acc2)}
.beleg-form{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.pico .beleg-plus{display:inline-flex;align-items:center;min-height:40px;margin:0;cursor:pointer;color:var(--acc);font-weight:600;font-size:var(--t-klein)}
.beleg-plus:focus-within{outline:2px solid var(--acc);outline-offset:2px;border-radius:var(--r-klein)}
.bl-meldung:empty{display:none}
/* ---------- Hinweiskasten: geht nicht auf ---------- */
.warnungen{background:var(--warnbg);color:var(--warn);border-radius:var(--r);padding:10px 14px;margin:0 0 12px}
.warnungen ul{margin:.3em 0 0;padding-left:20px}
/* ---------- Rückmeldung und Aufgabe als Eintrag ---------- */
.rmeintrag{border-top:1px solid var(--line);padding:9px 0}
.rmeintrag .kopfzeile{font-size:var(--t-etikett);color:var(--mut)}
.rmeintrag .text{white-space:pre-wrap;margin:3px 0}
.rmeintrag .antwort{font-size:var(--t-text);background:var(--acc2);border-radius:var(--r-klein);padding:6px 9px;margin-top:5px}
.ag{display:flex;gap:12px;align-items:flex-start;padding:12px 0}
.ag>.ag-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.ag-kopf{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.ag .titel{font-weight:600;line-height:1.35}
.ag.zu .titel{text-decoration:line-through;color:var(--mut)}
.ag-meta{display:flex;flex-wrap:wrap;gap:2px 6px;font-size:var(--t-klein);color:var(--mut)}
.ag-punkt{color:var(--line)}
.ag-frist{color:var(--fg);font-weight:600}
.ag-frist.ueber,.ag-wichtig{color:var(--warn);font-weight:600}
.ag-bezug{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.ag-bezug .chip{line-height:1.3;padding:3px 10px;text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ag-notiz{font-size:var(--t-text);color:var(--mut);line-height:1.45}
.pico button.ag-bearbeiten{flex:none;width:auto;margin:0;padding:4px 0;min-height:32px;border:0;background:none;box-shadow:none;color:var(--acc);font-size:var(--t-klein);font-weight:600}
.ag-liste{display:flex;flex-direction:column}
/* Offene Frage als Zeile: wie eine Aufgabe, ohne Haken; der Stand als Wort in seiner Farbe */
.frage{padding:12px 0}
.ag-liste>.frage+.frage{border-top:1px solid var(--line)}
.frage .titel{font-weight:600;line-height:1.4}
.frage.zu .titel{color:var(--mut)}
.pico .frage .ag-kopf>.zid-box{margin:0;flex:none}

.ag-liste>.ag+.ag{border-top:1px solid var(--line)}
.ag-liste>.rmeintrag:first-child{border-top:0}
.ag-gruppe{margin-top:22px}
.ag-gruppe h3.reise-titel{display:flex;align-items:center;gap:8px;font-size:var(--t-untertitel);margin:0 0 2px}
.ag-leiste{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin:12px 0 4px}
.pico .ag-leiste .reiterleiste{margin:0;display:inline-flex;max-width:100%}
.pico .reiterleiste button[aria-pressed="true"]{background:var(--card);color:var(--fg);--pico-color:var(--fg);box-shadow:var(--schatten-klein)}
.pico button.neu-knopf{width:auto;margin:0;min-height:44px;padding:0 18px;border-radius:var(--r-pille);font-weight:600}
.pico button.neu-knopf::before{content:"+";margin-right:6px;font-weight:700}
details.ag-erledigt{margin-top:22px;border-top:1px solid var(--line)}
.pico button.haken{width:30px;height:30px;flex:none;padding:0;margin:0;border-radius:var(--r-klein);border:2px solid var(--acc);background:transparent;color:var(--acc);font-size:var(--t-text);line-height:1;box-shadow:none}
.pico button.haken.an{background:var(--acc);color:var(--bg)}

/* ---------- Packliste (ADR-0010, #370): Summe, Mitnehmen und Zeile zum Packen ---------- */
.pack-summe{display:flex;flex-wrap:wrap;gap:2px 16px;margin:2px 0 8px;font-size:var(--t-klein);color:var(--mut)}
.pack-summe b{color:var(--fg);font-weight:700}
.pack-summe.gesamt{margin:6px 0 4px;font-size:var(--t-text)}
.pico a.mitnehmen,a.mitnehmen{display:flex;gap:8px;align-items:flex-start;margin:8px 0 0;font-size:var(--t-klein);color:var(--fg);text-decoration:none;max-width:var(--lese)}
a.mitnehmen b{font-weight:700}
a.mitnehmen:hover span{text-decoration:underline}
.pack-zeile{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
.pack-zeile .haken-platz{width:30px;height:30px;flex:none;display:inline-flex;align-items:center;justify-content:center;color:var(--acc);font-size:var(--t-text)}
.pack-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.pack-titel{font-weight:600;line-height:1.3}
.pack-unter{font-size:var(--t-klein);color:var(--mut);line-height:1.35}
.pack-zeile .chips{margin:3px 0 0}
.pack-zeile.gepackt .pack-titel{color:var(--mut);text-decoration:line-through}
.pack-zeile.weg{opacity:.65}
/* ==================== 5 Organismen ==================== */
/* ---------- Ding (Designsystem 2b, frieda-reist#18): Aufenthalt, Bewegung, Wahl als Zeile ---------- */
.ding{display:flex;gap:10px;align-items:flex-start;margin:10px 0 2px;padding-top:9px;border-top:1px solid var(--line)}
.ding-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ding-titel{font-weight:600;line-height:1.3}
.ding-unter{font-size:var(--t-klein);color:var(--mut);line-height:1.35}
.ding .chips{align-items:center;margin:4px 0 0}
.pico .ding ul{margin:4px 0 0}
.pico .ding>.zid-box{margin:2px 0 0;flex:none}
.karte>.ding-art{margin:0 0 3px}
/* Kontext unterwegs: Wahlen mit Auslöser stehen oben im Tag, mit Rahmen in Ocker */
.ding.wahl.vorn{border:2px solid var(--ocker);border-radius:var(--r);padding:10px 12px;margin:4px 0 10px}
/* ---------- Wahl-Modul (Designsystem 2c): Einstieg an der Stelle, Vergleich darunter; ab 700 px Tabelle, darunter Karten oder Tabelle ---------- */
.vergleich.mk th[scope=row]{text-align:left;color:var(--mut);font-weight:600;white-space:nowrap}
/* Mindestbreite klein (#58): bei 9em je Spalte war die Summe breiter als der Platz, alle Spalten blieben gleich schmal
   und ein langer Preis lief über fünfzehn Zeilen. So verteilt der Browser den Platz nach der Länge der Werte. */
.vergleich.mk td{vertical-align:top;min-width:6em}
/* Herkunftszeile (#58, #342): einmal je Möglichkeit, leise; nur auf Anfrage: in der Tabelle in den aufgeklappten Einzelheiten, in der Karte hinter „Quellen und Notizen“ (details) */
.herkunft{display:flex;flex-direction:column;gap:2px;font-size:var(--t-klein);color:var(--mut);overflow-wrap:anywhere}
.wm-karte details.wm-herkunft{border-top:1px solid var(--line);margin-top:8px;padding-top:6px;font-size:var(--t-klein);color:var(--mut)}
.wm-karte details.wm-herkunft>summary{cursor:pointer}
.wm-karte details.wm-herkunft .herkunft{margin-top:4px}
.wm-weitere>.herkunft{margin-top:6px}
/* Hero-Zeile (#343): ein Text ganz oben in der Möglichkeit über die volle Breite; in der Tabelle eine Zeile unter der Möglichkeit */
.hero{display:flex;flex-direction:column;gap:2px;overflow-wrap:anywhere}
.hero-name{font-size:var(--t-klein);color:var(--mut)}
.wm-karte .hero{margin:6px 0 8px}
.pico .wm-tab tr.wm-zeile:has(+ .wm-hero)>:is(th,td){border-bottom:0}
.pico .wm-tab tr.wm-hero>td{padding-top:0;padding-inline-start:calc(10px + 1em)}
.pico .wm-tab tr.wm-hero.an>td{background:var(--acc2)}
.pico .wm-tab tr.wm-hero.auf>td{background:var(--tint);border-bottom:0}
/* Einstieg „Alternativen vergleichen“: hellgrüne Pille mit Zahl; offen mit Rand statt Fläche */
.pico .wm-knopf{width:auto;margin:0;box-shadow:none;font:600 var(--t-klein)/1.2 var(--font-text);display:inline-flex;align-items:center;gap:8px;min-height:40px;
  padding:6px 8px 6px 14px;border-radius:var(--r-pille);border:1px solid transparent;background:var(--acc2);color:var(--acc);--pico-color:var(--acc);cursor:pointer}
.pico .wm-knopf[aria-expanded="true"]{background:transparent;border-color:var(--acc)}
.wm-n{background:var(--card);color:var(--acc);border-radius:var(--r-pille);min-width:22px;padding:1px 7px;font-size:var(--t-etikett);font-weight:700;text-align:center}
.wm-knopf[aria-expanded="true"] .wm-n{background:var(--acc2)}
.wm{margin:10px 0 4px;padding-top:10px;border-top:2px solid var(--acc)}
.wm[hidden]{display:none}
.wm-steuer{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;margin:0 0 8px}
.pico .wm-steuer label{display:flex;align-items:center;gap:6px;font-size:var(--t-text);min-height:40px;margin:0}
.pico .wm-steuer input[type=checkbox]{margin:0}
.umschalter:is(.wm-wahl,.wm-ansicht){margin:0 0 10px}   /* Knöpfe: Baustein umschalter (#38) */
.wm-wahl small{font-weight:400;opacity:.8;margin-left:4px}
.pico .wm-tab th{vertical-align:top}
.pico .wm-tab thead th .chips{margin:4px 0 0}
.pico .wm-tab tbody th[scope=row]{position:sticky;left:0;z-index:1;background:var(--card);box-shadow:1px 0 0 var(--line)}
/* alle Zellen auf der Kartenfarbe wie die feste erste Spalte, sonst wirkt die Tabelle zweifarbig */
.pico .wm-tab tbody td{background:var(--card)}
.pico .wm-tab :is(th,td).an{background:var(--acc2)}
.wm-karten{display:grid;gap:10px}
.art-uebersicht{display:grid;gap:18px;margin:12px 0}.art-uebersicht h3{margin:0 0 6px}.art-tabelle .wm-tab th a{font-weight:600}
/* Tabelle mit Möglichkeiten als Zeilen (Rechner): Kopf sortiert, Zeile klappt auf */
.pico .wm-sort{all:unset;cursor:pointer;font-weight:700}
.pico .wm-sort:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:4px}
.pico .wm-tab th[aria-sort] .wm-sort::after{content:" ↑"}
.pico .wm-tab tr.wm-zeile{cursor:pointer}
.pico .wm-tab tr.wm-zeile:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
@media (hover:hover){.pico .wm-tab tr.wm-zeile:hover>:is(th,td){background:var(--tint)}}
.pico .wm-tab tr.wm-zeile.an>:is(th,td){background:var(--acc2)}
.pico .wm-tab tbody th[scope=row]{white-space:normal;min-width:11em}
.wm-pfeil{display:inline-block;width:1em;color:var(--mut);transition:transform .15s}
tr.auf .wm-pfeil{transform:rotate(90deg)}
.wm-titel{display:block;font-weight:700}
.wm-unter{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;margin:4px 0 0 1em}
.pico .wm-tab:has(.wm-zeile){font-size:var(--t-text)}
.pico .wm-tab:has(.wm-zeile) :is(td,th){padding:9px 10px}
.pico .wm-tab tr.wm-zeile.auf>:is(th,td){background:var(--tint);border-bottom:0}
.pico .wm-tab tr.wm-mehr>td{background:var(--tint);padding:2px 14px 14px calc(10px + 1em)}
.pico .wm-tab tr.wm-zeile.an.auf>:is(th,td),.pico .wm-tab tr.wm-mehr.an>td{background:var(--acc2)}
.wm-einzelheiten{position:relative;display:flex;flex-direction:column;gap:6px;padding-right:44px;font-size:var(--t-text)}
.wm-einzelheiten>*{max-width:72ch}
.wm-einzelheiten>.zid-box{position:absolute;top:0;right:0}
.pico .wm-einzelheiten :is(dl.mliste,ul,.z){margin:0;font-size:inherit}
.pico .wm-einzelheiten :is(.z.klein,.verlauf){font-size:var(--t-klein)}
.pico .wm-einzelheiten ul.pm{padding:0}
.pico .wm-einzelheiten ul.pm li{list-style:none;margin:0}
.web-link{font-weight:600;white-space:nowrap}
.karten-links{display:inline-flex;flex-wrap:wrap;gap:4px 12px}
.wm-einzeln{margin-top:10px}
.wm-karte{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;background:var(--card)}
.wm-karte.an{border-color:var(--acc);box-shadow:inset 3px 0 0 var(--acc)}
/* Der Vergleich richtet sich nach der Breite seines Behälters, nicht des Fensters (#332, Schritt D; Entscheidung des Product Owners
   5.11.2026, Option B): breit (ab 960 px, mit Maus: planen) die Tabelle; mittel (630 bis 959 px) Karten, mit Maus dazu der
   Umschalter „Tabelle“, mit Finger nur Karten (#58: am Tablet war die Tabelle breiter als der Bildschirm); schmal (unter 630 px,
   Handy oder schmale Spalte) Karten oder Tabelle zum Umschalten. Das Zeigergerät ist keine Breite und bleibt eine Media-Query. */
.wm,.wm-gruppe{container:wm / inline-size}
/* Ein Behälter fängt die Ränder seiner Kinder ein (Layout-Containment). Damit der Abstand um den Vergleich bleibt, wie er war,
   trägt die Gruppe die Ränder von Vergleich (oben 10 px) und Einzelnem (unten 1 rem), und die Tabelle am Rechner endet ohne Rand
   (Abweichungen am Rechner: unter dem offenen Vergleich einer Entscheidung 6 px mehr, geschlossen 17 px mehr, auf der Bausteinseite unter einer Karte 7 px weniger). */
.wm-gruppe{margin:10px 0 1rem}
.wm-gruppe>.wm{margin-top:0}
.wm-gruppe>.wm[hidden]+.wm-einzeln{margin-top:0}
.wm-gruppe>.wm-einzeln{margin-bottom:0}
@media (pointer:fine){@container wm (min-width:960px){.wm:not(.art-tabelle) .wm-tabelle,.wm-gruppe>.wm{margin-bottom:0}.wm-karten,.wm-ansicht,.wm-wahl,.wm-anzahl,.pico details.wm-einzeln{display:none}.wm.ohne-tabelle .wm-karten{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}}}
@container wm (min-width:630px) and (max-width:959px){.wm-karten{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}}
@media (pointer:coarse){@container wm (min-width:630px){.wm-tabelle,.wm-ansicht{display:none}.wm-karten{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}}}
@container wm (max-width:629px){.wm[data-ansicht=karten] .wm-tabelle,.wm[data-ansicht=tabelle] .wm-karten{display:none}
  .pico .wm-tab th[scope=row]{white-space:normal;min-width:5.5em;max-width:6.5em;font-size:var(--t-klein);padding-left:6px;padding-right:6px}
  .pico .wm-tab td,.pico .wm-tab thead th{min-width:7.5em;padding-left:7px;padding-right:7px}}
@media (pointer:fine){@container wm (min-width:630px) and (max-width:959px){.wm[data-ansicht=karten] .wm-tabelle,.wm[data-ansicht=tabelle] .wm-karten{display:none}
  .pico .wm-tab th[scope=row]{white-space:normal;min-width:5.5em;max-width:6.5em;font-size:var(--t-klein);padding-left:6px;padding-right:6px}
  .pico .wm-tab td,.pico .wm-tab thead th{min-width:7.5em;padding-left:7px;padding-right:7px}}}
.option{border-top:1px solid var(--line);padding:8px 0 4px;margin-top:8px}
.option.aktiv{border-left:3px solid var(--acc);padding-left:10px;margin-left:-14px}
.option .k{font-weight:600}
.option ul{margin:.2em 0;padding-left:20px;font-size:var(--t-text)}
/* ---------- Tageskopf: große Nummer, Datum als Etikett, Titel ---------- */
.tagkopf{align-items:center!important;flex-wrap:nowrap!important}
.tagnr{flex:none;font:800 2.5rem/.9 var(--font-text);letter-spacing:-.02em;color:var(--acc);min-width:1.1em}
.tagtext{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.tagtitel{font:700 var(--t-untertitel)/1.25 var(--font-text);letter-spacing:-.01em;text-wrap:balance}
h2.tagkopf .tagnr{font-size:3.375rem}
h2.tagkopf .tagtitel{font-size:var(--t-titel);line-height:1.15}
.karte.tag .tagkopf .tagtitel{font-size:var(--t-text)}
.karte.tag .tagkopf .tagnr{font-size:2rem}
/* Wegverlauf: Punkte für Orte, gestrichelte Linie für Strecken, gepunktet für Bus/Bahn */
.wv{margin:8px 0 4px}
.wv-ort,.wv-strecke,.wv-aufenthalt{position:relative;padding-left:26px}
.wv-aufenthalt{margin:.25rem 0 .35rem}
.wv-aufenthalt .aufenthalt{padding:.35rem .6rem;border-left:3px solid var(--line);border-radius:var(--r-klein)}
.wv-ort{min-height:22px;display:flex;align-items:center}
.wv-punkt{position:absolute;left:3px;top:50%;width:12px;height:12px;margin-top:-6px;border-radius:50%;border:2.5px solid var(--acc);background:var(--card);box-sizing:border-box}
.wv-ort.start .wv-punkt{background:var(--acc)}
.wv-ort.ziel .wv-punkt{border-radius:3px;background:var(--fg);border-color:var(--fg)}
.wv-name{font-weight:600;display:flex;align-items:baseline;gap:8px}
.wv-strecke{padding-top:2px;padding-bottom:6px}
.wv-strecke::before{content:"";position:absolute;left:8px;top:-4px;bottom:-4px;border-left:2px dashed var(--acc)}
.wv-strecke.fahrt::before{border-left-style:dotted;border-left-color:var(--mut)}
.wv-strecke>.z{margin-top:0}
/* ---------- Ebenen der Tagesseite: Der Weg, Unterwegs nachschlagen, Hintergrund, Quellen und Prüfung, Orte ---------- */
.ebene{display:flex;flex-direction:column;gap:6px;min-width:0}
.weg-text{font-size:var(--t-text);line-height:1.6}
.weg-text p{margin:.4em 0}
.weg-unter{font-size:var(--t-text);color:var(--mut)}
.weg-unter p{margin:0}
.lese-abschnitt{padding:2px 0 8px}
.lese-abschnitt+.lese-abschnitt{padding-top:16px}
/* Lesespalte der Ortsseite (#58): Ebenen untereinander, am Rechner auf Lesebreite statt Kästen über die ganze Breite */
.lese-spalte{max-width:var(--lese);margin-top:8px}
.pico .lese-spalte .lese-kopf h4{font-size:var(--t-untertitel)}
/* unter einer Gruppenüberschrift (Ortsseite mit tiefe: „Highlights und Praktisches“) bleiben die Abschnitte eine Stufe kleiner */
.pico h3+.lese-spalte .lese-kopf h4{font-size:var(--t-text)}
.lese-kopf{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px}
.pico .lese-kopf h4{margin:0;font-size:var(--t-text)}
.lese-abschnitt .inhalt :is(h4,h5){font-size:var(--t-text);margin:1.1em 0 .3em}
/* Der Weg: nach gut vier Zeilen abgeschnitten, sanft ausgeblendet; „Weiterlesen“ zeigt alles */
.weg-text.kurz{max-height:7.4em;overflow:hidden;-webkit-mask-image:linear-gradient(#000 60%,transparent);mask-image:linear-gradient(#000 60%,transparent)}
.pico button.weiterlesen{align-self:flex-start;background:none;border:0;padding:6px 0;margin:0;min-height:44px;color:var(--acc);font-weight:600;box-shadow:none}
/* Unterwegs nachschlagen (umschaltender Bereich): getönter Streifen über die ganze Breite des Handys, am Rechner als
   getönte Fläche in der rechten Spalte; so ist sichtbar, was die Reiter umschalten */
.ebene-unterwegs{background:var(--tint);border-block:1px solid var(--line);margin-inline:-14px;padding:14px 14px 18px}
@media (min-width:760px){.ebene-unterwegs{margin-inline:-28px;padding-inline:28px}}
@media (min-width:1100px) and (pointer:fine){.ebene-unterwegs{margin-inline:0;padding:16px 20px 20px;border:1px solid var(--line);border-radius:var(--r-gross)}}
/* Hintergrund als Kapitel: zugeklappt, eine Zeile Vorschau, Zahl der Einträge */
.kapitel-liste{display:flex;flex-direction:column;border-top:1px solid var(--line)}
details.kapitel{border-bottom:1px solid var(--line)}
details.kapitel>summary{list-style:none;display:flex;align-items:center;gap:10px;min-height:56px;padding:8px 0;cursor:pointer}
details.kapitel>summary::-webkit-details-marker{display:none}
details.kapitel>summary::after{content:"";flex:none;width:8px;height:8px;margin:0 6px 4px 4px;border-right:2px solid var(--mut);border-bottom:2px solid var(--mut);transform:rotate(45deg);transition:transform .15s}
details.kapitel[open]>summary::after{transform:rotate(-135deg);margin-bottom:-4px}
.kap-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.kap-titel{font-weight:600;line-height:1.3;color:var(--fg)}
.kap-vorschau{font-size:var(--t-klein);color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
details.kapitel[open] .kap-vorschau{display:none}
.kap-zahl{flex:none;font-size:var(--t-etikett);font-weight:700;background:var(--acc2);color:var(--acc);border-radius:var(--r-pille);padding:1px 8px;font-variant-numeric:tabular-nums}
.pico details.kapitel>summary .zid-box{margin:0;flex:none}
.kap-inhalt{padding:0 0 14px}
.kap-inhalt :is(h4,h5){font-size:var(--t-text);margin:1.1em 0 .3em}
details.quellen{border-top:1px solid var(--line);margin:0}
details.quellen>summary{min-height:44px;display:flex;align-items:center;font-weight:600;color:var(--mut)}
.ortzeile{padding:10px 0}
.ortzeile .titelzeile a{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:var(--t-text);text-decoration:none}
.ortzeile-text{color:var(--mut);font-size:var(--t-text)}
.tag-karte{display:flex;flex-direction:column;gap:6px}
/* ---------- Steckbrief eines Plans und Tagesplan im Vergleich ---------- */
.steckbriefe{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:12px 0}
.steckbrief{border-top:4px solid var(--farbe);cursor:pointer}
.steckbrief.an{box-shadow:0 0 0 2px var(--farbe)}
.steckbrief dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:6px 0;font-size:var(--t-klein)}
.steckbrief dt{color:var(--mut)}
.steckbrief dd{margin:0}
.steckbrief ul{margin:4px 0;padding-left:18px;font-size:var(--t-klein)}
/* ---------- Reiseüberblick (28.10.2026): Kopf mit Zähler, Stand der Vorbereitung, Tag als Zeile ---------- */
/* Abschnitte untereinander mit einem Abstand (gap); kein Abschnitt bringt eigenen Außenabstand mit */
.reise{display:flex;flex-direction:column;gap:32px}
.pico .reise>*,.pico .reise :is(.kz-huelle,.legende,.tagzeilen){margin:0}
.reise>.reisekopf+.anab{margin-top:-16px}
.pico .reise h3.reise-titel{font:700 var(--t-untertitel)/1.3 var(--font-text);margin:0 0 6px}
.reise-karte{display:flex;flex-direction:column;gap:8px}
.pico .reise-karte .meldung{margin:0}
.reise-zahlen{display:flex;flex-direction:column;gap:10px}
.pico .reise-zahlen :is(.meldung,.mitreisende){margin:0}
.mitreisende{font-size:var(--t-text)}
.mitreisende .etikett{margin-right:6px}
.reisekopf{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
.reisekopf h2{margin:0}
/* An- und Abreise: eine Zeile wie die Zeitachse, kein Kasten (#58, Regel 6: sie führt nur zum Tag) */
.anab{display:block;padding:10px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);color:var(--fg);text-decoration:none}
.stand{display:flex;flex-direction:column;padding:16px 20px 4px}
.stand>.etikett{margin-bottom:2px}
.standzeile{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:44px;border-top:1px solid var(--line);color:var(--fg);text-decoration:none}
.stand .etikett+.standzeile{border-top:0}
.standwert{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.standwert.offen{color:var(--warn)}
a.standzeile .standwert::after{content:" ›";color:var(--mut);font-weight:400}
@media (hover:hover){a.standzeile:hover>span:first-child{color:var(--acc)}}
.tagzeilen{display:flex;flex-direction:column}
.anab ul{margin:4px 0 0;padding:0}
.pico .anab li{list-style:none;font-weight:600;line-height:1.35;margin:2px 0;color:var(--fg)}
@media (hover:hover){.pico .anab:hover li{color:var(--acc)}}

.tz-teil{padding:14px 0 4px}
.tagzeile,.terminzeile{display:grid;grid-template-columns:3.5rem minmax(0,1fr) auto auto;gap:3px 12px;align-items:baseline;padding:11px 0;border-top:1px solid var(--line);color:var(--fg);text-decoration:none}
.tagzeilen>:is(.tagzeile,.terminzeile):first-child{border-top:0}
.tagzeile.an{background:var(--acc2)}
.terminzeile.ueber .tz-datum{color:var(--warn)}
.terminzeile.ueber .tz-datum b{color:var(--warn)}
.fristen .tz-datum b{font-size:var(--t-text);line-height:1.5}
.fristen>.weiter{display:inline-block;margin-top:8px}
.tz-datum{grid-row:span 2;font-size:var(--t-etikett);line-height:1.25;color:var(--mut);font-variant-numeric:tabular-nums}
.tz-datum b{display:block;font-size:var(--t-untertitel);font-weight:800;color:var(--fg)}
.tz-titel{font-weight:600;line-height:1.3;text-wrap:pretty}
.tz-zeit{font-size:var(--t-klein);color:var(--mut);white-space:nowrap;font-variant-numeric:tabular-nums}
.tz-nacht{grid-column:2 / 4;display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:var(--t-klein);color:var(--mut)}
.pico .tagzeile>:is(.zid-box,span.zid){grid-column:4;grid-row:1 / span 2;align-self:center}
@media (hover:hover){:is(.tagzeile,.terminzeile):hover .tz-titel{color:var(--acc)}}
/* Zeitachse: Punkt und Linie links, je Tag eine Zeile mit genau einem Link (die ganze Zeile). Am Handy stehen Zeit und
   Nacht unter dem Titel, am Rechner in eigenen Spalten. */
.achse .tagzeile{grid-template-columns:20px 3.4rem minmax(0,1fr);position:relative;padding:12px 8px 12px 0;border-radius:10px;border-top:0}
.achse .tagzeile::before{content:"";position:absolute;left:6px;top:0;bottom:0;border-left:2px solid var(--line)}
.achse>.tagzeile:first-child::before{top:18px}
.achse>.tagzeile:last-child::before{bottom:calc(100% - 18px)}
.tz-punkt{grid-row:1 / span 3;align-self:start;width:14px;height:14px;margin-top:4px;border:2.5px solid var(--acc);border-radius:50%;background:var(--bg);position:relative}
.achse .tz-datum{grid-row:1 / span 3}
.achse .tz-titel,.achse .tz-zeit,.achse .tz-nacht{grid-column:3}
.tz-name{display:block}
.tz-marken{margin-top:4px}
.pico .tz-marken .chip{font-size:var(--t-etikett);white-space:normal;border-radius:var(--r-klein);text-align:left}
.achse .tagzeile:focus-visible,.achse .tagzeile.zurueck-hier{background:var(--acc2)}
@media (min-width:1100px){
  .achse .tagzeile{grid-template-columns:20px 3.4rem minmax(0,1.25fr) 8.5rem minmax(0,1fr);align-items:start}
  .reise-links .kartenbox{height:24rem;min-height:0}
  .achse .tz-titel{grid-column:3}
  .achse .tz-zeit{grid-column:4;grid-row:1;padding-top:1px}
  .achse .tz-nacht{grid-column:5;grid-row:1}
}
.vergleich td,.vergleich th{font-size:var(--t-text)}
.vergleich td.nr{font-weight:700;text-align:center}
.vergleich td.plan-nr{color:var(--farbe)}
.vergleich tr.an td{background:var(--acc2)}
.vergleich .nacht{display:inline-block;font-size:var(--t-etikett);font-weight:600;border-radius:4px;padding:0 6px;margin-top:2px;color:var(--bg);background:var(--kat,var(--farbe-grau))}
.vergleich .nacht.offen{background:transparent;color:var(--mut);border:1px dashed var(--mut)}
/* ---------- Karte (Leaflet): Übersicht, Etappe, Recherche ---------- */
.kartenbox{isolation:isolate;height:min(68vh,620px);min-height:320px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--sea)}
.kartenbox.leaflet-container{background:var(--sea);font:inherit}
.kartenbox.klein{height:240px;min-height:0;margin:8px 0 4px}
.rh-ort.rh-hier::after{width:14px;height:14px;border-radius:50%;background:var(--acc);border:2px solid var(--bg)}
.leaflet-container .rh-land{fill:var(--land);stroke:var(--land-edge)}
.leaflet-container .rh-see{fill:var(--water)}
.leaflet-container .rh-halo{stroke:var(--land)}
.leaflet-container .rh-plan-a{stroke:var(--plan-a)} .leaflet-container .rh-plan-b{stroke:var(--plan-b)}
.leaflet-container .rh-plan-c{stroke:var(--plan-c)} .leaflet-container .rh-plan-d{stroke:var(--plan-d)}
.leaflet-container .rh-gemeinsam{stroke:var(--mut)} .leaflet-container .rh-fahrt{stroke:var(--bus)} .leaflet-container .rh-skip{stroke:var(--skip)}
.rh-ort{background:none;border:0}
/* Etappen-Karte: Track, Punkte nach Kategorie, Kartenlinks im Text (25.10.2026) */
.ekarte{height:min(58vh,460px);min-height:280px}
.leaflet-container .rh-etappe{stroke:var(--acc)}
.rh-pw{background:none;border:0}
.rh-p{width:100%;height:100%;box-sizing:border-box;display:flex;align-items:center;justify-content:center;border-radius:50%;border:2px solid var(--card);box-shadow:0 1px 3px rgba(0,0,0,.35);color:#fff;font-size:11px;font-weight:700;line-height:1}
.rh-p .sym{width:14px;height:14px}
/* Farbe, Symbol und Namen der Kartenpunkte kommen aus plan/kategorien.yaml der Reise (--pk je Punkt, katFarbe) */
.rh-p{background:var(--pk,var(--farbe-grau))} .rh-p.kontrast{color:var(--bg)}
/* Recherche-Karten (Issue #64): Kategorie des Orts als Farbe, Legende unter der Karte, Regionswahl darüber */
.wkarte{margin:8px 0 12px}
.kartenlinks{display:flex;flex-direction:column;gap:2px;margin:4px 0}
.umschalter.regionen,.umschalter.kartenansichten{margin:0 0 8px}   /* Knöpfe: Baustein umschalter (#38) */
.rh-p.umriss{background:var(--card);color:var(--pk);border-color:var(--pk)}

.ziehhinweis{font-size:var(--t-etikett);color:var(--mut);margin:4px 0 0}

/* ---------- Rückmeldefenster ---------- */
dialog#rm{border:0;border-radius:16px 16px 0 0;padding:0;margin:auto 0 0;bottom:calc(0px - var(--hoehe-fehlt,0px));width:100%;max-width:100%;max-height:88vh;background:var(--card);color:var(--fg);box-shadow:var(--schatten)}
@media (min-width:700px){dialog#rm{margin:auto;max-width:600px;border-radius:16px}}
dialog#rm::backdrop{background:rgba(0,0,0,.35)}
#rm .rmkopf{position:sticky;top:0;background:var(--card);padding:14px 16px 8px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
#rm .rmkopf>div{flex:1}
#rm .rminhalt{padding:10px 16px calc(16px + env(safe-area-inset-bottom))}
#rm textarea,#wuForm textarea{min-height:110px;resize:vertical}
#rm .rmkopf .k{font-weight:700}
#rm .rmkopf .kennung{font-variant-numeric:tabular-nums}
/* Wunsch-Brett (Paket G): am Handy Spalten untereinander, leere weg; ab 700 px eine Reihe wie ein Brett, leere Spalten
   schmal, bei vielen Wünschen seitlich blättern (nur das Brett, nie die Seite) */
.brett-huelle{container:brett / inline-size;margin-top:6px}
.brett{display:flex;flex-direction:column}
.brett .spalte{min-width:0}
.brett .spalte h3{display:flex;align-items:center;gap:8px;font-size:var(--t-text);margin:18px 0 8px}
.brett .leer-spalte h3{color:var(--mut);font-weight:500}
@container brett (max-width:629px){.brett .leer-spalte{display:none}}
@container brett (min-width:630px){.brett{flex-direction:row;gap:12px;align-items:flex-start;overflow-x:auto;padding-bottom:6px}
  .brett .spalte{flex:1 1 220px;min-width:180px}.brett .leer-spalte{flex:0 0 auto;min-width:0}}
.wu-karte{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin:0 0 10px;overflow-wrap:anywhere;display:flex;flex-direction:column;gap:6px}
.wu-karte .chips:empty{display:none}
.pico .wu-karte .chips{margin:0}
.wu-kopf .text{font-weight:600;line-height:1.4}
.wu-karte.erlebt{border-color:var(--acc)}
.wu-karte.weg .text{color:var(--mut)}
.wu-kopf{display:flex;gap:10px;align-items:flex-start}
.wu-kopf .text{white-space:pre-wrap;flex:1;min-width:0}
.wu-karte .kopfzeile{font-size:var(--t-etikett);color:var(--mut)}
.wu-karte .antwort{font-size:var(--t-text);background:var(--acc2);border-radius:var(--r-klein);padding:6px 9px;margin-top:5px}
.wu-vorschlag{font-size:var(--t-text);border-left:3px solid var(--acc);padding:2px 0 2px 9px;margin-top:6px}
.wu-knoepfe{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.pico .wu-knoepfe button{margin:0}
.wu-zahl{min-width:1.6em;text-align:center;font-weight:600}
.wu-intro{max-width:var(--lese);color:var(--mut);margin:4px 0 18px}
.wu-bilanz{margin:24px 0 4px}
.wu-person{padding:4px 0}
/* Neuer Wunsch: Fläche, Wunsch über die ganze Breite, Link und Name nebeneinander, Senden rechts */
.pico details.wu-neu{margin:0 0 8px;max-width:var(--lese)}
.pico details.wu-neu>summary{display:flex;align-items:center;gap:8px;min-height:44px;font-weight:700;font-size:var(--t-untertitel);color:var(--fg);cursor:pointer}
.pico details.wu-neu[open]>summary{color:var(--fg)}
.pico details.wu-neu>summary .sym{width:1.2rem;height:1.2rem}
.pico #wuForm{display:flex;flex-direction:column;gap:12px;margin-top:8px}
.pico #wuForm label{display:flex;flex-direction:column;gap:6px;margin:0;font-weight:600;font-size:var(--t-text)}
.pico #wuForm :is(textarea,input){margin:0;font-weight:400}
.pico #wuForm .meldung{margin:0}
.pico #wuForm .meldung:empty{display:none}
.wu-optional{color:var(--mut);font-weight:400}
.wu-felder{display:grid;grid-template-columns:1fr;gap:12px}
#wuForm{container:wu / inline-size}
@container wu (min-width:630px){.wu-felder{grid-template-columns:1fr 1fr}}
.wu-name{display:flex;flex-direction:column;gap:6px}
.pico .wu-name :is(input,.meldung){margin:0}
.wu-senden{display:flex;justify-content:flex-end}
.pico .wu-senden button{width:auto;margin:0;padding:0 22px;min-height:44px;border-radius:var(--r-pille)}
.wu-leer{display:flex;flex-direction:column;align-items:center;gap:4px;max-width:var(--lese);margin:16px 0;padding:28px 16px;border:1.5px dashed color-mix(in srgb,var(--mut) 35%,transparent);border-radius:var(--r-gross)}
.wu-leer .sym{width:1.6rem;height:1.6rem;color:var(--acc);margin-bottom:4px}
.wu-leer b{color:var(--fg)}

/* ---------- Packliste (ADR-0010): Tabelle der Kategorie (Planen) und Gruppe (Packen) ---------- */
.pack-tabelle .wm-tab th[scope=row]{font-weight:600;color:var(--fg)}
.pico .pack-tabelle .wm-tab tfoot :is(th,td){font-weight:700;border-top:2px solid var(--line);background:var(--card)}
.pack-tabelle h3{display:flex;align-items:center;gap:6px}
.pico .pack-tabelle .wm-tab tr.weg>:is(th,td){opacity:.65}
.pack-gruppe{margin:0 0 14px}
.pack-gruppe>h3{display:flex;align-items:center;gap:10px;font-size:var(--t-untertitel);margin:18px 0 2px}
.pack-fortschritt{font-size:var(--t-klein);font-weight:400;color:var(--mut)}
.pico details.pack-weg{margin:14px 0 0;max-width:var(--lese)}
.pico details.pack-weg>summary{color:var(--mut);font-size:var(--t-klein)}
/* ==================== 6 Vorlagen: Teile der Ansichten ==================== */
.zurueck{display:inline-block;margin:0 0 8px;padding:6px 0;text-decoration:none;font-weight:600}
a.weiter{display:inline-block;margin-top:8px;font-weight:600;color:var(--acc);text-decoration:none}
.karte.tag .k{font-weight:600}
details.alternative{margin:0 0 10px 14px;border-left:3px solid var(--warn);padding-left:8px}
.blaettern{display:flex;justify-content:space-between;margin:14px 0}
details.neben>summary{font-weight:700;padding:10px 2px;color:var(--warn)}
.treffer .in{font-size:var(--t-etikett);color:var(--mut)}
.treffer .s{font-size:var(--t-text);margin-top:3px}
.pico h3.gruppe,.teil{font:700 var(--t-untertitel)/1.3 var(--font-text);letter-spacing:-.01em;color:var(--fg);margin:1.6em 0 .2em}

#agForm .zwei{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
/* ---------- Reise und Zu tun (Seitenordnung 28.10.2026): am Handy eine Spalte; am Rechner Reise mit Überblick links und
   Zeitachse rechts, Zu tun mit Entscheiden und Buchen nebeneinander ---------- */
.tun-raster{display:flex;flex-direction:column;gap:32px;margin-bottom:32px}
@media (min-width:1100px){
  .reise-seite{display:grid;grid-template-columns:minmax(0,24rem) minmax(0,1fr);gap:32px 56px;align-items:start}
  .tun-raster{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:32px 48px;align-items:start}
}
/* ---------- Tagesseite (B2): Reihenfolge je Gerät ----------
   Handy und Tablet (unterwegs): untereinander Tageskasten, Karte, Der Weg, Unterwegs nachschlagen, Orte, Hintergrund,
   Nacht, Quellen. Rechner (planen; breit und mit Maus): Tageskasten neben der Karte, darunter links lesen (Der Weg,
   Hintergrund, Nacht, Quellen), rechts nachschlagen. Die Nacht kommt wie der Tag zuletzt (Product Owner 31.10.2026);
   nur eine offene Wahl steht am Rechner über die volle Breite unter dem Tageskasten. */
.tagseite{display:flex;flex-direction:column;gap:36px;margin-top:8px}
.tagseite>*,.tag-oben>*{margin:0;min-width:0}
.tagseite{container:tagseite / inline-size}
.tag-oben{display:flex;flex-direction:column;gap:14px;order:1}
.tag-lesen,.tag-spalte{display:contents}
.ebene-weg{order:2}.ebene-unterwegs{order:3}.ebene-orte{order:4}.ebene-hintergrund{order:5}.ebene-nacht{order:6}.ebene-quellen{order:7}.tagseite>.blaettern{order:8}
.tagseite>.wahl-voll{order:1}
@media (min-width:1100px) and (pointer:fine){
  .tagseite{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,25rem);gap:36px 44px;align-items:start}
  .tag-oben,.tagseite>.blaettern,.tagseite>.nacht-voll,.tagseite>.wahl-voll{grid-column:1/-1}
  .tag-lesen,.tag-spalte{display:flex;flex-direction:column;gap:36px;order:3}
  .tagseite>.nacht-voll,.tagseite>.wahl-voll{order:2}
  .tagseite:not(:has(>.tag-lesen))>.tag-spalte{grid-column:1/-1}
}

/* Tageskasten neben der Karte: nach der Breite der Tagesseite (Behälter), am Rechner mit Maus (Zeigergerät bleibt Media-Query) */
@media (pointer:fine){@container tagseite (min-width:960px){.tag-oben{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:20px;align-items:start}}}

/* Packliste (Reiter): oben Planen oder Packen und, beim Packen, die Gruppierung */
.pack-kopf{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center}
.pack-kopf .umschalter{margin:0}
.pico .pack-kopf label{display:flex;align-items:center;gap:8px;margin:0;font-size:var(--t-klein)}
.pico .pack-kopf select{width:auto;margin:0;min-height:40px}
/* ==================== 7 Rahmen der Seite: Kopf, Meldungen, Glas, Leiste, Fuß ==================== */
/* ---------- Kopf: großer Titel am Seitenanfang (iOS Large Title), scrollt mit ---------- */
header{max-width:var(--breite);margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px 2px 16px}
header .t{font-family:var(--font-text);font-size:var(--t-titel);line-height:1.1;font-weight:700;letter-spacing:-.015em;margin:0;text-wrap:balance}
header .u{font-size:var(--t-text);color:var(--mut);margin-top:4px;text-wrap:balance}
header{position:relative}
header:has(.konto) .t{padding-right:6rem}
.konto{display:inline-flex;align-items:center;min-height:44px;padding:0 .25rem;font-size:var(--t-klein);color:var(--acc);text-decoration:none;max-width:9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header .konto{position:absolute;top:calc(10px + env(safe-area-inset-top));right:12px}
.meldungen{position:fixed;z-index:11;top:calc(10px + env(safe-area-inset-top));left:12px;right:12px;display:grid;justify-items:center;gap:8px;pointer-events:none}
.hinweis{pointer-events:auto;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 14px;border-radius:22px;font-size:var(--t-klein);max-width:520px}
.hinweis[hidden]{display:none}
.hinweis button{font:inherit;font-weight:600;border:0;border-radius:var(--r-pille);padding:6px 12px;background:var(--acc);color:var(--bg);cursor:pointer}
#offline{color:var(--warn);padding-right:14px}
/* Meldungen an die angemeldete Person in dieser Reise (#21): Hinweis mit den neuesten Meldungen, „Gelesen“ blendet sie aus */
#fuerDich{align-items:flex-start}#fuerDich .fd-text{flex:1;min-width:0;display:grid;gap:2px;padding:6px 0;overflow-wrap:anywhere}
#fuerDich a{color:var(--acc)}
/* ---------- Glas (Liquid Glass: 35 %, Blur 8px, Sättigung 170 %) ----------
   Leitbild: Inhalt läuft bis an die Ränder, Bedienelemente schweben als Glas darüber (iOS 26/27).
   Ohne backdrop-filter bleibt das Glas deckend, sonst stünde Text auf Text. */
.glas{background:var(--card);border:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.18);color:var(--fg)}
@supports ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){
  .glas{background:color-mix(in srgb,var(--card) 35%,transparent);-webkit-backdrop-filter:blur(8px) saturate(170%);backdrop-filter:blur(8px) saturate(170%);
        border-color:color-mix(in srgb,var(--fg) 14%,transparent);box-shadow:inset 0 1px 0 color-mix(in srgb,var(--fg) 10%,transparent),0 10px 30px rgba(0,0,0,.25)}
}
.rund{display:inline-flex;align-items:center;justify-content:center;width:var(--knopf);height:var(--knopf);border-radius:50%;padding:0;cursor:pointer;text-decoration:none}
/* ---------- Leiste: Glas über dem Inhalt mit Reitern, die Suche ist der letzte Reiter (B2, Fassung „Glas“, frieda-reist#55, 28.10.2026) ----------
   Stärker deckend als die Meldungen (58 % statt 35 %, Unschärfe 14 px), damit die Reiter über jedem Inhalt lesbar bleiben.
   Der gewählte Reiter ist eine hellgrüne Pille. Der Rand ist ein Schatten statt border, so behalten die Reiter ihre Breite.
   Ohne backdrop-filter bleibt die Leiste deckend weiß (dunkel: Fläche). */
nav{display:flex}
nav a{min-width:0;text-align:center;color:var(--mut);text-decoration:none;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.leiste{position:fixed;z-index:10;left:10px;right:10px;bottom:calc(var(--tabbar-gap) - var(--hoehe-fehlt));max-width:700px;margin:0 auto;display:flex;align-items:stretch;gap:2px;
  height:var(--tabbar-h);padding:5px;border-radius:22px;background:var(--card);box-shadow:0 0 0 1px var(--line),var(--schatten)}
@supports ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){
  .leiste{background:color-mix(in srgb,var(--card) 58%,transparent);-webkit-backdrop-filter:blur(14px) saturate(170%);backdrop-filter:blur(14px) saturate(170%);
    box-shadow:0 0 0 1px color-mix(in srgb,var(--fg) 10%,transparent),inset 0 1px 0 color-mix(in srgb,#fff 40%,transparent),0 10px 30px rgba(20,30,25,.18)}
}
nav{flex:1;min-width:0;display:flex;gap:2px}
nav a,#suchKnopf{flex:1 1 0;min-width:0;padding:0 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:var(--r);border:0;background:none;cursor:pointer;
      color:var(--mut);text-decoration:none;font:600 0.6562rem/1.1 var(--font-text);letter-spacing:-.01em;white-space:nowrap}
#suchKnopf{flex:0 1 calc(100% / 6)}
nav a span,#suchKnopf span{max-width:100%;overflow:hidden;text-overflow:ellipsis}
@media (max-width:380px){nav a,#suchKnopf{font-size:0.5938rem;letter-spacing:-.03em;padding:0 1px}}
nav a.on{color:var(--acc);background:color-mix(in srgb,var(--acc2) 85%,transparent);font-weight:700}
#suchfeld{flex:1;display:flex;align-items:center;gap:8px;padding:0 4px 0 14px;margin:0;color:var(--mut)}
#suchfeld[hidden]{display:none}
#suchfeld input::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
#suchfeld input{flex:1;min-width:0;border:0;background:none;color:var(--fg);font:inherit;font-size:var(--t-text);outline:none;padding:0}
#suchfeld input::placeholder{color:var(--mut);opacity:1}
#suchZu{border:0;background:color-mix(in srgb,var(--fg) 8%,transparent);color:var(--fg);width:44px;height:44px;border-radius:var(--r);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
body.sucht nav,body.sucht #suchKnopf{display:none}

/* ---------- Fuß: Release der Software (Product Owner 1.11.2026), auf jeder Seite, unauffällig unter dem Inhalt ----------
   Vorn der Reise-Stand (Epic #223): „Reise-Stand 42 · veröffentlicht 02.11., 09:47 · “; ein Tipp auf die Nummer zeigt die
   letzten Änderungen (reiseStandFuss). Dann „Frieda Release 412 · 9b4a397“, die Kennung führt zum Quellcode dieses Stands, „Auf Neueres prüfen“ fragt den Server und
   main und bietet „Jetzt aktualisieren“ oder (Organisator:innen) „Veröffentlichen anstoßen“ an (releaseFuss). Darunter die
   Verweis auf die Benachrichtigungen unter „Mein Konto“ (pushFuss, angemeldet). Der Fuß rückt in den Freiraum über der Leiste.
   Zuletzt steht immer die Rechtszeile (Baustein Rechtszeile, Molekül, #383): drei Links ab der Wurzel zu Datenschutz,
   Impressum und Alpha-Hinweis (Heimat dieser Seiten ist der Anmeldedienst, ADR-0003), Texte über data-t aus dem Katalog;
   deshalb ist der Fuß nie leer und nie verborgen. Auf den Anmeldeseiten steht dieselbe Zeile im Baustein fuss. */
.fuss{max-width:var(--breite);margin:calc(0px - var(--tabbar-space)) auto 0;padding:0 16px calc(var(--tabbar-space) + 16px);
  font-size:var(--t-klein);color:var(--mut);text-align:center;font-variant-numeric:tabular-nums}
.fuss[hidden],.fuss [hidden]{display:none}
.fuss a{color:inherit}
.fuss button{display:inline-flex;align-items:center;min-height:44px;margin:0;padding:0 4px;border:0;background:none;color:var(--acc);font:inherit;
  text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.fuss .fuss-stand{display:block}
/* Reise-Stand (Epic #223): die Nummer ist ein Knopf, er klappt die letzten Änderungen auf (Liste ohne Punkte, je Änderung
   Nummer, Zeit, Person, was; leise, linksbündig auf Lesebreite) */
.fuss .fuss-aenderungen{list-style:none;margin:4px auto 8px;padding:0;max-width:var(--lese);text-align:start}
.fuss .fuss-aenderungen li{padding:4px 0;border-top:1px solid var(--line)}
.fuss .fuss-aenderungen .wann{color:var(--fg)}
/* Sprache für Gäste (#188): eine kleine Zeile „Sprache: Deutsch · English“, Baustein umschalter als Textknöpfe;
   die gewählte Sprache steht in Tinte, ohne Unterstrich. Angemeldet gilt die Sprache des Kontos, die Zeile fehlt. */
.fuss .umschalter.fuss-sprachen{display:inline-flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:0;margin:0}
.fuss .fuss-sprachen button{min-height:44px;padding:0 4px;border:0;border-radius:0;background:none;color:var(--acc);font-weight:400;
  text-decoration:none}
/* Unterstrichen ist nur der Name (span), nicht der Trennpunkt davor (die Regel für Knöpfe im Fuß unterstreicht sonst alles) */
.fuss .fuss-sprachen button span{text-decoration:underline;text-underline-offset:2px}
.fuss .fuss-sprachen button[aria-pressed="true"]{background:none;color:var(--fg);cursor:default}
.fuss .fuss-sprachen button[aria-pressed="true"] span{text-decoration:none}
.fuss .fuss-sprachen button+button::before{content:"·";color:var(--mut);margin-inline-end:8px}
/* Rechtszeile (#383): leise Links nebeneinander, unterstrichen wie die übrigen Links im Fuß, Tippfläche 44 px hoch */
.fuss-recht{display:flex;flex-wrap:wrap;justify-content:center;gap:0 16px;margin:0}
.fuss-recht a{display:inline-flex;align-items:center;min-height:44px;padding-inline:4px;text-underline-offset:2px}
@media (hover:hover){nav a:hover,#suchKnopf:hover{color:var(--fg)} .rund:hover{border-color:var(--acc)}}
/* Zahl am Reiter „Zu tun“: offene Aufgaben + nicht gesendete Rückmeldungen */
nav a{position:relative}
nav a .zahl{position:absolute;top:3px;left:calc(50% + 4px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--acc);color:var(--bg);font-size:0.6562rem;font-weight:700;line-height:17px;text-align:center;letter-spacing:0}
nav a.warn .zahl{background:var(--warn)}

  /* Tage des Plans in zwei Spalten; ein Tag mit offenem Vergleich nimmt die ganze Breite */
  section.ziel:has(>.karte.ziel[id^="T-"]){display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px;align-items:start}
  section.ziel:has(>.karte.ziel[id^="T-"])>*{grid-column:1/-1;margin-top:0;margin-bottom:0}
  section.ziel:has(>.karte.ziel[id^="T-"])>.karte.ziel{grid-column:auto;margin:0}
  section.ziel:has(>.karte.ziel[id^="T-"])>.karte.ziel:has(.wm:not([hidden])){grid-column:1/-1}
}

  :root{--breite:1400px}
}
