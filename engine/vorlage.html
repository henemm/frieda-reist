<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f8f8f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151816" media="(prefers-color-scheme: dark)">
<title>Reisehandbuch</title>
<!-- Pico CSS 2.1.1 (MIT, picocss.com), lokal ausgeliefert und vorab gespeichert; gilt nur in .pico (main, Rückmeldefenster) -->
<link rel="stylesheet" href="pico-2.1.1.min.css">
<!-- Leaflet 1.9.4 (BSD-2, leafletjs.com), lokal ausgeliefert, nur für die Karte in „Varianten“ -->
<link rel="stylesheet" href="leaflet-1.9.4.css">
<style>
/* Designsystem nach Atomic Design (docs/design.md): Tokens, Grundlagen, Atome, Moleküle, Organismen, Vorlagen,
   Rahmen der Seite, zuletzt die Breiten. Jeder Baustein steht einmal; was ein Baustein in einem anderen anders macht,
   steht beim umfassenden Baustein. Funktionen gleichen Namens im Skript zeichnen die Bausteine.
   Gesicht „Freundlich“ (B2, frieda-reist#52, 27.10.2026; vorher „Wanderführer“): heller Grund, frisches Grün, weiche
   Flächen ohne Rahmen, Etiketten in normaler Schreibweise, Kennzahlen als Kacheln. Schrift: Source Sans 3 für Titel und
   Text (OFL, lokal in engine/vendor/fonts, Lizenz dort), Zeichensätze latin und latin-ext (z. B. ō, ū). */
@font-face{font-family:"Source Sans 3";font-style:normal;font-weight:200 900;font-display:swap;src:url(source-sans-3-latin-ext-wght-normal.woff2) format("woff2-variations");
  unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C4,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:"Source Sans 3";font-style:normal;font-weight:200 900;font-display:swap;src:url(source-sans-3-latin-wght-normal.woff2) format("woff2-variations");
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

/* ==================== 1 Tokens: Farben, Schrift, Breiten, Maße der Leiste ==================== */
/* Farb-Tokens: --bg Grund, --card Fläche, --fg Text, --mut gedämpft (Etiketten, Nebentext), --line Linie, --acc/--acc2
   Akzent und helle Akzentfläche, --warn/--warnbg offen, --ocker Rand für „unterwegs“; Plan- und Kartenfarben
   dataviz-geprüft; --kat-* Art der Unterkunft. Die Leiste ist Glas über dem Inhalt (Rahmen der Seite).
   Kontrast (WCAG): Text auf Grund und Fläche mindestens 4,5:1, hell und dunkel (geprüft 27.10.2026). */
:root{--font-text:"Source Sans 3",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
:root{--plan-a:#c62a2a;--plan-b:#008a7e;--plan-c:#7a4db0;--plan-d:#b07800;--sea:#d9e6ea;--land:#eceadf;--land-edge:#b7b4a3;--peak:#8a8573;--water:#9cc3d1;--bus:#6f7772;--skip:#9a9a90;--kat-hotel:#1f3b57;--kat-gasthaus:#8a4b2a;--kat-ferienwohnung:#6a4c93;--kat-huette:#2c6e49;--kat-herberge:#3f7f8c;--kat-camping:#7a7a1f;--kat-unterwegs:#555a50;--kat-privat:#a0446a;--kat-sonstige:#6f7772;--bg:#f8f8f5;--fg:#1d2420;--mut:#5b645e;--ocker:#6a756e;--card:#ffffff;--line:#e4e5df;--acc:#1f7a57;--acc2:#e3f1ea;--warn:#9a5b00;--warnbg:#fbeed6;--mark:#ffe58a}
@media (prefers-color-scheme:dark){:root{--plan-a:#e8507a;--plan-b:#2fa9a0;--plan-c:#a07ad6;--plan-d:#b98a00;--sea:#14232a;--land:#222823;--land-edge:#3d453e;--peak:#8d8a7c;--water:#2f5e70;--bus:#8d958f;--skip:#6d716c;--kat-hotel:#7fa9d6;--kat-gasthaus:#d39a6f;--kat-ferienwohnung:#b49ae0;--kat-huette:#5cbf86;--kat-herberge:#79c3cf;--kat-camping:#c9c96a;--kat-unterwegs:#a9ad9f;--kat-privat:#e08fb0;--kat-sonstige:#8d958f;--bg:#151816;--fg:#eceee9;--mut:#a5aca6;--ocker:#a5aca6;--card:#1d211e;--line:#2c312d;--acc:#6fd0a5;--acc2:#1f3329;--warn:#f0c46a;--warnbg:#3a3017;--mark:#6b5a10}}
/* Formen: Radien (klein für Knöpfe, normal für Karten, Kachel, groß für die Fläche, an der man handelt, Pille) und Schatten */
:root{--tint:color-mix(in srgb,var(--acc2) 60%,var(--bg));--r-klein:8px;--r:12px;--r-kachel:14px;--r-gross:18px;--r-pille:99px;
  --schatten:0 1px 2px rgba(20,30,25,.05),0 6px 24px rgba(20,30,25,.06);--schatten-klein:0 1px 3px rgba(20,30,25,.12)}
/* Breite: Kopf und alle Ansichten teilen --breite, Fließtext bleibt auf Lesebreite (--lese); Werte je Breite unten */
:root{--breite:860px;--lese:44rem}
:root{--tabbar-h:60px;--knopf:46px;--tabbar-gap:max(12px,calc(env(safe-area-inset-bottom,0px) - 10px));--tabbar-space:calc(var(--tabbar-h) + var(--tabbar-gap) + 24px);--hoehe-fehlt:0px}
/* --hoehe-fehlt: Als App vom Home-Bildschirm vergisst iOS nach dem Schließen der Tastatur manchmal die volle Höhe,
   bis die App neu startet; der untere Rand für „fixed“ liegt dann mitten im Bild. Das Skript („Höhe als App“) setzt
   den Fehlbetrag, die Leiste und alles, was unten sitzt, rücken um ihn nach unten. Sonst 0. */

/* ==================== 2 Grundlagen: Seite, Text, Pico CSS, Reisetexte ==================== */
/* Schriftgröße: alle Größen sind rem, am Rechner wächst die Wurzel (Handy 16 px, ab 760 px 17 px, ab 1100 px 19 px, ab 1700 px 20 px). */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;font-size:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:1.0625rem/1.55 var(--font-text)}
main{max-width:var(--breite);margin:0 auto;padding:14px 14px 0;overflow-wrap:break-word}
main :is(p,ul,ol,blockquote,dl):not(:where(.karte,.ding,.wm,.option,.steckbrief,.wm-karte,.fnbox) *){max-width:var(--lese)}
a{color:var(--acc)}
main code{overflow-wrap:anywhere}
details{margin:0 0 10px}
summary{cursor:pointer}
.ziel{scroll-margin-top:calc(70px + env(safe-area-inset-top))}
.blitz{animation:blitz 2s}
@keyframes blitz{0%,60%{outline:3px solid var(--acc)}100%{outline:3px solid transparent}}
mark{background:var(--mark);color:inherit;border-radius:3px}
.leer{color:var(--mut);padding:20px 0;text-align:center}
.meldung{font-size:0.875rem;color:var(--mut);margin:8px 0}
.unsichtbar{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px;border-radius:4px}
/* ---------- Pico CSS an die eigenen Farben binden (hell und dunkel folgen --bg/--fg/--acc) ---------- */
:root:not([data-theme=dark]):not([data-theme=light]){
  --pico-font-family:var(--font-text);
  --pico-background-color:var(--bg);--pico-color:var(--fg);--pico-muted-color:var(--mut);--pico-muted-border-color:var(--line);
  --pico-h1-color:var(--fg);--pico-h2-color:var(--fg);--pico-h3-color:var(--fg);--pico-h4-color:var(--fg);--pico-h5-color:var(--fg);--pico-h6-color:var(--fg);
  --pico-primary:var(--acc);--pico-primary-background:var(--acc);--pico-primary-border:var(--acc);--pico-primary-underline:color-mix(in srgb,var(--acc) 50%,transparent);
  --pico-primary-hover:var(--fg);--pico-primary-hover-background:color-mix(in srgb,var(--acc) 85%,var(--fg));--pico-primary-hover-border:var(--pico-primary-hover-background);
  --pico-primary-focus:color-mix(in srgb,var(--acc) 35%,transparent);--pico-primary-inverse:var(--bg);
  --pico-card-background-color:var(--card);--pico-card-sectioning-background-color:var(--card);
  --pico-form-element-background-color:var(--card);--pico-form-element-border-color:var(--line);--pico-form-element-color:var(--fg);
  --pico-form-element-focus-color:var(--acc);--pico-table-border-color:var(--line);--pico-table-row-stripped-background-color:var(--acc2);
  --pico-mark-background-color:var(--mark);--pico-mark-color:var(--fg);--pico-border-radius:10px}
.pico th{background:var(--acc2);font-weight:600}
.pico :is(h1,h2,h3,h4){font-family:var(--font-text);font-weight:700;text-wrap:balance;letter-spacing:-.01em}
.pico table{font-variant-numeric:tabular-nums}
.pico .tabelle table{margin:0}
.pico button.klein{font-size:0.875rem;padding:6px 12px}
.pico details.block>summary,.pico details.neben>summary,.pico details.weg>summary{margin:0}
/* ---------- Reisetexte: Tabellen, Bilder, Kartenpunkte im Text, Fußnoten (docs/design.md, Reisetexte) ---------- */
/* Tabellen (bauen.tabellen_ordnen): zweispaltig als Merkmalliste, breiter als Tabelle. Die Hülle .tabelle ist der
   Behälter: Ist sie schmal (unter 700 px, am Handy oder in der rechten Spalte), steht das Merkmal über dem Wert und jede
   Tabellenzeile wird ein Eintrag (erste Spalte fett, übrige „Spalte: Wert“, leere entfallen). Nichts steht seitlich über. */
.tabelle{container-type:inline-size;overflow-x:auto;margin:.6em 0;-webkit-overflow-scrolling:touch}
dl.textmerkmale{margin:0}
dl.textmerkmale>div{display:grid;grid-template-columns:minmax(9rem,14rem) minmax(0,1fr);border-top:1px solid var(--line)}
dl.textmerkmale>div:last-child{border-bottom:1px solid var(--line)}
dl.textmerkmale dt{padding:8px 14px 8px 0;hyphens:auto;overflow-wrap:normal}
dl.textmerkmale dd{margin:0;padding:8px 0;overflow-wrap:break-word;min-width:0}
@container (max-width:699px){
  dl.textmerkmale>div{grid-template-columns:minmax(0,1fr);padding:8px 0}
  dl.textmerkmale dt{padding:0}
  dl.textmerkmale dd{padding:2px 0 0}
  .pico .tabelle.stapel :is(table,tbody,tr,td){display:block;width:auto}
  .pico .tabelle.stapel thead{display:none}
  .pico .tabelle.stapel tr{border-top:1px solid var(--line);padding:8px 0}
  .pico .tabelle.stapel tr:last-child{border-bottom:1px solid var(--line)}
  /* !important: Spaltenausrichtung aus dem Markdown steht als style an der Zelle */
  .pico .tabelle.stapel td{border:0;padding:1px 0;background:none;--pico-background-color:transparent;text-align:start!important}
  .pico .tabelle.stapel td:first-child{font-weight:700}
  .pico .tabelle.stapel td:not(:first-child)[data-spalte]::before{content:attr(data-spalte) ": ";color:var(--mut);font-size:0.85rem;font-weight:600}
  .pico .tabelle.stapel td.leer{display:none}
}
img{max-width:100%;height:auto;border-radius:6px}
a.bild{display:block;margin:6px 0;list-style:none}
a.bild span{display:block;font-size:0.8125rem;color:var(--mut)}
ul li:has(>a.bild){list-style:none;margin-left:-22px;font-size:0.8125rem;color:var(--mut)}
a.kp{white-space:nowrap}
a.kp::before{content:"";display:inline-block;width:.7em;height:.7em;margin-right:.18em;border-radius:50% 50% 50% 0;transform:rotate(-45deg) translateY(.05em);background:currentColor;opacity:.75}
.kp-blink{animation:kpblink 1.6s ease-out}
@keyframes kpblink{0%,40%{background:var(--warnbg)}100%{background:transparent}}
/* Fußnoten: Nummer antippen zeigt den Nachweis an der Stelle; Liste am Blockende (25.10.2026) */
.pico sup.fn{font-size:.72em;line-height:0}
.pico sup.fn button{all:unset;display:inline-block;line-height:1.3;min-width:1.2em;text-align:center;cursor:pointer;color:var(--acc);font-weight:600;padding:.1em .2em;border-radius:4px}
.pico sup.fn button[aria-expanded="true"]{background:var(--acc2)}
.pico sup.fn button:focus-visible{outline:2px solid var(--acc)}
.fnbox{display:block;margin:.3em 0 .5em;padding:.4em .6em;border-left:3px solid var(--acc);background:var(--card);font-size:0.875rem;line-height:1.4;color:var(--mut)}
ol.fussnoten{margin:1em 0 0;padding-top:.6em;border-top:1px solid var(--line);font-size:0.8125rem;line-height:1.4;color:var(--mut)}
ol.fussnoten li{margin:0 0 .25em;overflow-wrap:anywhere}

/* ==================== 3 Atome ==================== */
/* ---------- Atom Symbol (Lucide, eingebettet als <symbol>) ---------- */
.sym{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* ---------- Atom Zustand (chip): feste Namen, die Farbe folgt der Bedeutung ---------- */
.chip{font-size:0.8125rem;background:var(--acc2);color:var(--acc);border-radius:99px;padding:2px 10px;max-width:100%;overflow-wrap:break-word}
.chip.plan{background:var(--acc);color:var(--bg);font-weight:700}
.chip.neben{background:var(--warnbg);color:var(--warn)}
.chip.offen{background:var(--warnbg);color:var(--warn)}
.chip.weg{background:transparent;color:var(--mut);border:1px solid var(--line);text-decoration:line-through}
.chip.unterwegs{background:transparent;color:var(--ocker);border:1px solid var(--ocker)}
.chip.st-neu{background:var(--warnbg);color:var(--warn)}
.chip.st-uebernommen{background:var(--acc);color:var(--bg)}
.chip.st-rueckfrage{background:var(--warnbg);color:var(--warn);font-weight:700}
.chip.st-ausstehend{background:transparent;color:var(--mut);border:1px dashed var(--mut)}
.chip.ag-hoch,.chip.ag-ueber{background:var(--warnbg);color:var(--warn);font-weight:700}
.chip.ag-leise{background:transparent;color:var(--mut);border:1px solid var(--line)}
/* Lange Etiketten und Code brechen um, statt auf dem Handy seitlich überzustehen (Bildprüfung 2e): siehe .chip max-width */
/* Atom Wert (Designsystem 2d): Wert vorn, Herkunft (Notiz, Prüfdatum, Quelle) hinter dem i; je Datum als Liste */
.mk-unklar{color:var(--warn);font-weight:700}
.mk-luecke{color:var(--warn)}
.pico button.mk-i{position:relative;width:20px;height:20px;min-height:0;padding:0;margin:0 0 0 6px;border-radius:50%;border:1px solid var(--line);
  background:var(--card);color:var(--mut);font:italic 700 0.75rem/18px var(--font-text);text-align:center;vertical-align:1px;box-shadow:none;cursor:pointer}
.pico button.mk-i::after{content:"";position:absolute;inset:-12px}
.pico button.mk-i[aria-expanded="true"]{background:var(--acc2);color:var(--acc);border-color:var(--acc)}
.mk-q{display:block;font-size:0.8125rem;line-height:1.35;color:var(--mut);margin:3px 0 0;overflow-wrap:anywhere}
.mk-q[hidden]{display:none}
.mk-datum{display:block}
.mk-am{font-size:0.7812rem;font-weight:700;color:var(--ocker)}
.mk-am-tag{display:inline-block;margin-left:6px;font-size:0.6875rem;font-weight:700;color:var(--ocker);border:1px solid var(--ocker);border-radius:4px;padding:0 5px;vertical-align:1px}
.mk-chip{margin-left:6px;font-size:0.6875rem;padding:1px 7px}
.mk-leer{color:var(--mut);border-bottom:1px dashed var(--line)}
.mk-nichts{color:var(--mut)}
/* ---------- Atom Etikett: sagt, was etwas ist (Nacht, Gehzeit, Start …); normale Schreibweise, gedämpft ----------
   Ein Symbol davor (.etikett-sym) nur, wo es die Art sofort zeigt (Nacht, Wahl, Ort, Kennzahlen). */
:is(.etikett,.ding-art,.tagdatum,.kzn,.wv-etikett),dl.textmerkmale dt{font:600 0.85rem/1.3 var(--font-text);letter-spacing:0;text-transform:none;color:var(--mut)}
.etikett-sym{width:1rem;height:1rem;color:var(--acc)}
/* ---------- Atom Planfarbe: Punkt oder Linie ---------- */
.plan-linie{width:16px;border-top:4px solid var(--farbe);display:inline-block}
.punkt{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--farbe);margin-right:4px}
h2 .punkt,h2 i.punkt{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--farbe);margin-right:8px;vertical-align:middle}
/* ---------- Atom Kennung (zid): Rückmeldungen und Aufgaben zu einer Stelle (B2, frieda-reist#56, 27.10.2026) ----------
   „Symbol oder Wort, nie beides“: Anmerken braucht man nur vielleicht, deshalb nur die Sprechblase mit Tooltip, überall
   gleich. Leer blass (bei Hover und Fokus voll), mit Rückmeldungen grün gefüllt mit Zahl, offene Aufgabe als Warnpunkt.
   Tippfläche 44 × 44 px. Die Kennung selbst (T-01 …) steht im Fenster, das sich öffnet, mit „Kopieren“.
   Deckkraft leer 0,7 statt der erprobten 0,55: so hat das Symbol 3:1 Kontrast (WCAG 1.4.11), hell und dunkel. */
.zid-box{position:relative;display:inline-flex;align-items:center;max-width:100%;vertical-align:middle}
.zid{font:0.6875rem ui-monospace,Menlo,monospace;color:var(--mut);margin-left:8px;white-space:nowrap}   /* ohne Rückmeldungen: Kennung als Text */
/* .pico davor: sonst gewinnt Pico CSS mit hellem Text auf hellem Grund */
.pico button.zid{position:relative;display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;min-height:44px;padding:0;margin:0 -10px 0 0;
  border:0;border-radius:var(--r-klein);background:none;box-shadow:none;transition:none;cursor:pointer;opacity:.7;
  color:var(--mut);--pico-color:var(--mut);--pico-background-color:transparent;--pico-border-color:transparent}
.pico button.zid:focus-visible{opacity:1}
.pico button.zid:is(.hat-rm,.hat-ag){opacity:1}
.pico button.zid.hat-rm{color:var(--acc);--pico-color:var(--acc)}
button.zid .zid-blase{width:1.25rem;height:1.25rem}
button.zid.hat-rm .zid-blase{fill:var(--acc2)}
.zid-n{position:absolute;top:3px;right:1px;display:inline-flex;align-items:center;justify-content:center;min-width:1.2rem;height:1.2rem;padding:0 .3em;
  border-radius:var(--r-pille);background:var(--acc);color:var(--card);font:700 0.72rem/1 var(--font-text);font-variant-numeric:tabular-nums;box-shadow:0 0 0 2px var(--card)}
.zid-o{position:absolute;bottom:9px;right:8px;width:.6rem;height:.6rem;border-radius:50%;background:var(--warn);box-shadow:0 0 0 2px var(--card)}
/* In Titelzeilen sitzt die Kennung mit Abstand am rechten Rand, damit Tippen auf den Titel sie nicht trifft */
:is(summary,h2,.k,.titelzeile):has(>.zid-box){display:flex;align-items:center;gap:2px 16px;line-height:1.3}
:is(summary,h2,.k,.titelzeile):has(>.zid-box)>.punkt{margin-right:-8px}
:is(summary,h2,.k,.titelzeile)>.zid-box{margin:0 0 0 auto}
.titelzeile>:first-child{flex:1;min-width:0}
@media (hover:hover){
  .pico button.zid:hover{opacity:1;color:var(--acc);--pico-color:var(--acc)}
}
/* Unterwegs (Handy und Tablet) trägt nur, was man schon gelesen hat, eine Sprechblase: nicht der Kopf eines
   zugeklappten Blocks und nicht eine Vorschau (.vorschau: Karte oder Zeile, die zur ganzen Seite führt). Niemand merkt
   etwas an, bevor er den Inhalt gesehen hat; so wird die Seite ruhiger (Entscheidung 28.10.2026). Am Rechner bleibt sie. */
@media (max-width:1099px),(pointer:coarse){
  details:not([open])>summary .zid-box,.vorschau .zid-box{display:none}
}

/* ==================== 4 Moleküle ==================== */
/* ---------- Fläche: Karte und aufklappbarer Block ---------- */
.karte{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 10px;color:inherit;text-decoration:none}
a.karte:active{background:var(--acc2)}
.karte .k{font-weight:700}
.karte .z{margin-top:4px;font-size:0.9375rem}
.karte .z b{color:var(--mut);font-weight:600}
.karte .z.klein,.verlauf{font-size:0.8125rem;color:var(--mut)}
details.block{background:var(--card);border:1px solid var(--line);border-radius:12px}
details.block>summary{padding:12px 14px;font-weight:600;cursor:pointer;min-height:44px}
details.block>.inhalt{padding:0 14px 8px}
details.weg>summary{font-size:0.875rem;color:var(--mut);padding:8px 0}
/* Fläche, an der man handelt (Tageskasten): weiß, ohne Rahmen, weicher Schatten, großer Radius. Sonst gibt es auf der
   Tagesseite keine Kästen; Lesetext steht ohne Rahmen. */
.karte.flaeche{border:0;border-radius:var(--r-gross);box-shadow:var(--schatten);padding:16px 18px}
.pico .karte .k{font-size:1rem}
@media (hover:hover){
  a.karte:hover{border-color:var(--acc)}
}
/* ---------- Zustände in einer Reihe, Orte eines Abschnitts ---------- */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.ortchips{margin:2px 0 10px;align-items:center}
details.block>.ortchips{padding:0 14px}
/* ---------- Umschalter: ein Knopf gedrückt ---------- */
.umschalter{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 10px;padding:0;border:0;min-width:0}
.umschalter button{font:inherit;font-size:0.875rem;font-weight:600;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:99px;padding:8px 13px;min-height:40px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.umschalter button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
/* Eigene Bedienelemente innerhalb von .pico behalten ihr Aussehen */
.pico :is(.umschalter button){width:auto;box-shadow:none;line-height:1.3;transition:none;
  --pico-background-color:var(--card);--pico-border-color:var(--line);--pico-color:var(--fg);background-color:var(--card);border:1px solid var(--line);border-radius:99px}
.pico .umschalter button{margin:0;font-size:0.875rem;font-weight:600;color:var(--fg);padding:8px 13px}
.pico .umschalter button[aria-pressed="true"]{--pico-background-color:var(--fg);background-color:var(--fg);color:var(--bg);border-color:var(--fg)}
@media (hover:hover){
  .umschalter button:hover{border-color:var(--acc)}
}
/* ---------- Reiter: Segmentleiste mit Pillen, genau ein Teil offen (Tagesseite: Unterwegs nachschlagen) ---------- */
.reiterleiste{display:flex;gap:4px;overflow-x:auto;padding:4px;margin:0 0 6px;border-radius:var(--r-pille);background:color-mix(in srgb,var(--line) 60%,transparent);
  width:max-content;max-width:100%;scrollbar-width:none}
.pico .reiterleiste button{flex:none;width:auto;margin:0;min-height:40px;padding:0 16px;border:0;border-radius:var(--r-pille);background:none;box-shadow:none;transition:none;
  color:var(--mut);--pico-color:var(--mut);--pico-background-color:transparent;font:600 0.9375rem/1 var(--font-text);white-space:nowrap;cursor:pointer}
.pico .reiterleiste button[aria-selected="true"]{background:var(--card);color:var(--fg);--pico-color:var(--fg);box-shadow:var(--schatten-klein)}
@media (hover:hover){.pico .reiterleiste button:hover{color:var(--fg);--pico-color:var(--fg)}}
/* ---------- Ebenenkopf: Titel einer Ebene, rechts die Kennung ---------- */
.ebene-kopf{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px}
.pico .ebene-kopf h3{margin:0;font-size:1.2rem}
/* ---------- Etikett eines Dings: was es ist, Punkt in der Farbe der Kategorie ---------- */
.ding-art{display:flex;align-items:center;gap:6px}
.ding-art .lg-k{width:9px;height:9px}
/* ---------- Kennzahlenleiste: Gehzeit, Aufstieg, Abstieg, Strecke als hellgrüne Kacheln mit Symbol; am Handy 2 × 2 ---------- */
.kz{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:8px;margin:10px 0}
.kz>div{background:var(--acc2);border-radius:var(--r-kachel);padding:10px 12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kzn{display:flex;align-items:center;gap:6px;color:var(--acc)}
.kzn .sym{width:1.05rem;height:1.05rem}
.kzw{font-size:1.15rem;font-weight:700;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
@media (max-width:520px){.kz{grid-auto-flow:row;grid-template-columns:repeat(2,minmax(0,1fr))}.kz>div:last-child:nth-child(odd){grid-column:1 / -1}}
/* ---------- Merkmalliste (docs/alternativen.md) ---------- */
dl.mliste{margin:6px 0;font-size:0.9062rem}
dl.mliste dt{font-size:0.7812rem;color:var(--mut);margin-top:6px}
dl.mliste dd{margin:0;overflow-wrap:anywhere}
/* ---------- Legende unter einer Karte ---------- */
.legende{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:0.8125rem;color:var(--mut);margin:6px 0}
.legende span{display:inline-flex;align-items:center;gap:6px}
.lg-k{width:11px;height:11px;border-radius:3px;background:var(--kat,var(--kat-sonstige))}
.lg-u{width:16px;border-top:3px dotted var(--fg)}
.lg-s{width:16px;border-top:3px dotted var(--skip)}
.lg-b{width:16px;border-top:2px dashed var(--bus)}
.lg-f{width:18px;border-top:3px dashed var(--fg)}
.legende i{display:inline-block;width:12px;height:12px;margin-right:4px;vertical-align:-1px;border-width:1px}
/* ---------- Listenzeile: Wissen, Praxis, Quellen, Orte ---------- */
.wliste{display:flex;flex-direction:column}
.wzeile{display:flex;gap:14px;align-items:flex-start;padding:13px 0;border-bottom:1px solid var(--line);color:var(--fg);text-decoration:none}
.wliste .wzeile:last-child{border-bottom:0}
.wsym{flex:none;width:40px;height:40px;border-radius:50%;background:var(--acc2);color:var(--acc);display:flex;align-items:center;justify-content:center}
.typ-praxis .wsym{background:var(--warnbg);color:var(--warn)}
.typ-quelle .wsym{background:color-mix(in srgb,var(--mut) 16%,transparent);color:var(--mut)}
.wtext{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.wt{font:600 1.1875rem/1.25 var(--font-text);letter-spacing:-.01em;text-wrap:balance}
.wu{font-size:0.9062rem;line-height:1.4;color:var(--mut)}
.pico .wzeile>.zid-box{margin:3px 0 0;flex:none}
@media (hover:hover){.wzeile:hover .wt{color:var(--acc)}}
/* ---------- Hinweiskasten: geht nicht auf, Mahnung ---------- */
.warnungen{background:var(--warnbg);color:var(--warn);border-radius:12px;padding:10px 14px;margin:0 0 12px}
.warnungen ul{margin:.3em 0 0;padding-left:20px}
/* ---------- Rückmeldung und Aufgabe als Eintrag ---------- */
.rmeintrag{border-top:1px solid var(--line);padding:9px 0}
.rmeintrag .kopfzeile{font-size:0.8125rem;color:var(--mut)}
.rmeintrag .text{white-space:pre-wrap;margin:3px 0}
.rmeintrag .antwort{font-size:0.9375rem;background:var(--acc2);border-radius:8px;padding:6px 9px;margin-top:5px}
.ag{display:flex;gap:12px;align-items:flex-start;padding:12px 0}
.ag>.ag-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.ag-kopf{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.ag .titel{font-weight:600;line-height:1.35}
.ag.zu .titel{text-decoration:line-through;color:var(--mut)}
.ag-meta{display:flex;flex-wrap:wrap;gap:2px 6px;font-size:0.875rem;color:var(--mut)}
.ag-punkt{color:var(--line)}
.ag-frist{color:var(--fg);font-weight:600}
.ag-frist.ueber,.ag-wichtig{color:var(--warn);font-weight:600}
.ag-bezug{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.ag-bezug a{font-size:0.8125rem;line-height:1.3;padding:3px 10px;border-radius:var(--r-pille);background:var(--acc2);color:var(--acc);text-decoration:none;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ag-notiz{font-size:0.9375rem;color:var(--mut);line-height:1.45}
.pico button.ag-bearbeiten{flex:none;width:auto;margin:0;padding:4px 0;min-height:32px;border:0;background:none;box-shadow:none;color:var(--acc);font-size:0.875rem;font-weight:600}
.ag-liste{display:flex;flex-direction:column}
/* Offene Frage als Zeile: wie eine Aufgabe, ohne Haken; der Stand als Wort in seiner Farbe */
.frage{padding:12px 0}
.ag-liste>.frage+.frage{border-top:1px solid var(--line)}
.frage .titel{font-weight:600;line-height:1.4}
.frage.zu .titel{color:var(--mut)}
.pico .frage .ag-kopf>.zid-box{margin:0;flex:none}

.ag-liste>.ag+.ag{border-top:1px solid var(--line)}
.ag-liste>.rmeintrag:first-child{border-top:0}
.ag-gruppe{margin-top:22px}
.ag-gruppe h3.reise-titel{display:flex;align-items:center;gap:8px;font-size:1.1rem;margin:0 0 2px}
.ag-leiste{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin:12px 0 4px}
.pico .ag-leiste .reiterleiste{margin:0;display:inline-flex;max-width:100%}
.pico .reiterleiste button[aria-pressed="true"]{background:var(--card);color:var(--fg);--pico-color:var(--fg);box-shadow:var(--schatten-klein)}
.pico button.neu-knopf{width:auto;margin:0;min-height:44px;padding:0 18px;border-radius:var(--r-pille);font-weight:600}
.pico button.neu-knopf::before{content:"+";margin-right:6px;font-weight:700}
details.ag-erledigt{margin-top:22px;border-top:1px solid var(--line)}
.pico button.haken{width:30px;height:30px;flex:none;padding:0;margin:0;border-radius:8px;border:2px solid var(--acc);background:transparent;color:var(--acc);font-size:1.0625rem;line-height:1;box-shadow:none}
.pico button.haken.an{background:var(--acc);color:var(--bg)}

/* ==================== 5 Organismen ==================== */
/* ---------- Ding (Designsystem 2b, frieda-reist#18): Aufenthalt, Bewegung, Wahl als Zeile ---------- */
.ding{display:flex;gap:10px;align-items:flex-start;margin:10px 0 2px;padding-top:9px;border-top:1px solid var(--line)}
.ding-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ding-titel{font-weight:600;line-height:1.3}
.ding-unter{font-size:0.875rem;color:var(--mut);line-height:1.35}
.ding .chips{align-items:center;margin:4px 0 0}
.pico .ding ul{margin:4px 0 0}
.pico .ding>.zid-box{margin:2px 0 0;flex:none}
.karte>.ding-art{margin:0 0 3px}
/* Kontext unterwegs: Wahlen mit Auslöser stehen oben im Tag, mit Rahmen in Ocker */
.ding.wahl.vorn{border:2px solid var(--ocker);border-radius:12px;padding:10px 12px;margin:4px 0 10px}
/* ---------- Wahl-Modul (Designsystem 2c): Einstieg an der Stelle, Vergleich darunter; ab 700 px Tabelle, darunter Karten oder Tabelle ---------- */
.vergleich.mk th[scope=row]{text-align:left;color:var(--mut);font-weight:600;white-space:nowrap}
.vergleich.mk td{vertical-align:top;min-width:9em}
/* Einstieg „Alternativen vergleichen“: hellgrüne Pille mit Zahl; offen mit Rand statt Fläche */
.pico .wm-knopf{width:auto;margin:0;box-shadow:none;font:600 0.875rem/1.2 var(--font-text);display:inline-flex;align-items:center;gap:8px;min-height:40px;
  padding:6px 8px 6px 14px;border-radius:var(--r-pille);border:1px solid transparent;background:var(--acc2);color:var(--acc);--pico-color:var(--acc);cursor:pointer}
.pico .wm-knopf[aria-expanded="true"]{background:transparent;border-color:var(--acc)}
.wm-n{background:var(--card);color:var(--acc);border-radius:var(--r-pille);min-width:22px;padding:1px 7px;font-size:0.7812rem;font-weight:700;text-align:center}
.wm-knopf[aria-expanded="true"] .wm-n{background:var(--acc2)}
.wm{margin:10px 0 4px;padding-top:10px;border-top:2px solid var(--acc)}
.wm[hidden]{display:none}
.wm-steuer{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;margin:0 0 8px}
.pico .wm-steuer label{display:flex;align-items:center;gap:6px;font-size:0.9062rem;min-height:40px;margin:0}
.pico .wm-steuer input[type=checkbox]{margin:0}
.wm-wahl,.wm-ansicht{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px;padding:0;border:0;min-width:0}
.pico :is(.wm-wahl,.wm-ansicht) button{width:auto;margin:0;box-shadow:none;font:600 0.8438rem/1.2 var(--font-text);border-radius:99px;border:1px solid var(--line);
  background:var(--card);color:var(--fg);padding:6px 12px;min-height:40px;cursor:pointer}
.pico :is(.wm-wahl,.wm-ansicht) button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--bg)}
.wm-wahl small{font-weight:400;opacity:.8;margin-left:4px}
.pico .wm-tab th{vertical-align:top}
.pico .wm-tab thead th .chips{margin:4px 0 0}
.pico .wm-tab tbody th[scope=row]{position:sticky;left:0;z-index:1;background:var(--card);box-shadow:1px 0 0 var(--line)}
.pico .wm-tab :is(th,td).an{background:var(--acc2)}
.wm-karten{display:grid;gap:10px}
.wm-karte{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card)}
.wm-karte.an{border-color:var(--acc);box-shadow:inset 3px 0 0 var(--acc)}
@media (min-width:700px){.wm-karten,.wm-ansicht{display:none}.wm.ohne-tabelle .wm-karten{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}}
@media (max-width:699px){.wm[data-ansicht=karten] .wm-tabelle,.wm[data-ansicht=tabelle] .wm-karten{display:none}
  .pico .wm-tab th[scope=row]{white-space:normal;min-width:5.5em;max-width:6.5em;font-size:0.7812rem;padding-left:6px;padding-right:6px}
  .pico .wm-tab td,.pico .wm-tab thead th{min-width:7.5em;padding-left:7px;padding-right:7px}}
.option{border-top:1px solid var(--line);padding:8px 0 4px;margin-top:8px}
.option.aktiv{border-left:3px solid var(--acc);padding-left:10px;margin-left:-14px}
.option .k{font-weight:600}
.option ul{margin:.2em 0;padding-left:20px;font-size:0.9375rem}
/* ---------- Tageskopf: große Nummer, Datum als Etikett, Titel ---------- */
.tagkopf{align-items:center!important;flex-wrap:nowrap!important}
.tagnr{flex:none;font:800 2.5rem/.9 var(--font-text);letter-spacing:-.02em;color:var(--acc);min-width:1.1em}
.tagtext{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.tagtitel{font:700 1.1875rem/1.25 var(--font-text);letter-spacing:-.01em;text-wrap:balance}
h2.tagkopf .tagnr{font-size:3.375rem}
h2.tagkopf .tagtitel{font-size:1.6875rem;line-height:1.15}
.karte.tag .tagkopf .tagtitel{font-size:1.0625rem}
.karte.tag .tagkopf .tagnr{font-size:2rem}
/* Wegverlauf: Punkte für Orte, gestrichelte Linie für Strecken, gepunktet für Bus/Bahn */
.wv{margin:8px 0 4px}
.wv-ort,.wv-strecke{position:relative;padding-left:26px}
.wv-ort{min-height:22px;display:flex;align-items:center}
.wv-punkt{position:absolute;left:3px;top:50%;width:12px;height:12px;margin-top:-6px;border-radius:50%;border:2.5px solid var(--acc);background:var(--card);box-sizing:border-box}
.wv-ort.start .wv-punkt{background:var(--acc)}
.wv-ort.ziel .wv-punkt{border-radius:3px;background:var(--fg);border-color:var(--fg)}
.wv-name{font-weight:600;display:flex;align-items:baseline;gap:8px}
.wv-strecke{padding-top:2px;padding-bottom:6px}
.wv-strecke::before{content:"";position:absolute;left:8px;top:-4px;bottom:-4px;border-left:2px dashed var(--acc)}
.wv-strecke.fahrt::before{border-left-style:dotted;border-left-color:var(--mut)}
.wv-strecke>.z{margin-top:0}
/* ---------- Ebenen der Tagesseite: Der Weg, Unterwegs nachschlagen, Hintergrund, Quellen und Prüfung, Orte ---------- */
.ebene{display:flex;flex-direction:column;gap:6px;min-width:0}
.weg-text{font-size:1.08rem;line-height:1.6}
.weg-text p{margin:.4em 0}
.weg-unter{font-size:0.9rem;color:var(--mut)}
.weg-unter p{margin:0}
.lese-abschnitt{padding:2px 0 8px}
.lese-abschnitt+.lese-abschnitt{padding-top:16px}
.lese-kopf{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px}
.pico .lese-kopf h4{margin:0;font-size:1.05rem}
.lese-abschnitt .inhalt :is(h4,h5){font-size:1rem;margin:1.1em 0 .3em}
/* Der Weg: nach gut vier Zeilen abgeschnitten, sanft ausgeblendet; „Weiterlesen“ zeigt alles */
.weg-text.kurz{max-height:7.4em;overflow:hidden;-webkit-mask-image:linear-gradient(#000 60%,transparent);mask-image:linear-gradient(#000 60%,transparent)}
.pico button.weiterlesen{align-self:flex-start;background:none;border:0;padding:6px 0;margin:0;min-height:44px;color:var(--acc);font-weight:600;box-shadow:none}
/* Unterwegs nachschlagen (umschaltender Bereich): getönter Streifen über die ganze Breite des Handys, am Rechner als
   getönte Fläche in der rechten Spalte; so ist sichtbar, was die Reiter umschalten */
.ebene-unterwegs{background:var(--tint);border-block:1px solid var(--line);margin-inline:-14px;padding:14px 14px 18px}
@media (min-width:760px){.ebene-unterwegs{margin-inline:-28px;padding-inline:28px}}
@media (min-width:1100px) and (pointer:fine){.ebene-unterwegs{margin-inline:0;padding:16px 20px 20px;border:1px solid var(--line);border-radius:var(--r-gross)}}
/* Hintergrund als Kapitel: zugeklappt, eine Zeile Vorschau, Zahl der Einträge */
.kapitel-liste{display:flex;flex-direction:column;border-top:1px solid var(--line)}
details.kapitel{border-bottom:1px solid var(--line)}
details.kapitel>summary{list-style:none;display:flex;align-items:center;gap:10px;min-height:56px;padding:8px 0;cursor:pointer}
details.kapitel>summary::-webkit-details-marker{display:none}
details.kapitel>summary::after{content:"";flex:none;width:8px;height:8px;margin:0 6px 4px 4px;border-right:2px solid var(--mut);border-bottom:2px solid var(--mut);transform:rotate(45deg);transition:transform .15s}
details.kapitel[open]>summary::after{transform:rotate(-135deg);margin-bottom:-4px}
.kap-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.kap-titel{font-weight:600;line-height:1.3;color:var(--fg)}
.kap-vorschau{font-size:0.85rem;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
details.kapitel[open] .kap-vorschau{display:none}
.kap-zahl{flex:none;font-size:0.75rem;font-weight:700;background:var(--acc2);color:var(--acc);border-radius:99px;padding:1px 8px;font-variant-numeric:tabular-nums}
.pico details.kapitel>summary .zid-box{margin:0;flex:none}
.kap-inhalt{padding:0 0 14px}
.kap-inhalt :is(h4,h5){font-size:1rem;margin:1.1em 0 .3em}
details.quellen{border-top:1px solid var(--line);margin:0}
details.quellen>summary{min-height:44px;display:flex;align-items:center;font-weight:600;color:var(--mut)}
.ortzeile{padding:10px 0}
.ortzeile .titelzeile a{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:1.05rem;text-decoration:none}
.ortzeile-text{color:var(--mut);font-size:0.92rem}
.tag-karte{display:flex;flex-direction:column;gap:6px}
/* ---------- Steckbrief eines Plans und Tagesplan im Vergleich ---------- */
.steckbriefe{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:12px 0}
.steckbrief{border-top:4px solid var(--farbe);cursor:pointer}
.steckbrief.an{box-shadow:0 0 0 2px var(--farbe)}
.steckbrief dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:6px 0;font-size:0.875rem}
.steckbrief dt{color:var(--mut)}
.steckbrief dd{margin:0}
.steckbrief ul{margin:4px 0;padding-left:18px;font-size:0.875rem}
/* ---------- Reiseüberblick (28.10.2026): Kopf mit Zähler, Stand der Vorbereitung, Tag als Zeile ---------- */
/* Abschnitte untereinander mit einem Abstand (gap); kein Abschnitt bringt eigenen Außenabstand mit */
.reise{display:flex;flex-direction:column;gap:32px}
.pico .reise>*,.pico .reise :is(.kz,.legende,.tagzeilen){margin:0}
.reise>.reisekopf+.anab{margin-top:-16px}
.pico .reise h3.reise-titel{font:700 1.2rem/1.3 var(--font-text);margin:0 0 6px}
.reise-karte{display:flex;flex-direction:column;gap:8px}
.pico .reise-karte .meldung{margin:0}
.reise-zahlen{display:flex;flex-direction:column;gap:10px}
.pico .reise-zahlen :is(.meldung,.mitreisende){margin:0}
.mitreisende{font-size:0.9375rem}
.mitreisende .etikett{margin-right:6px}
.reisekopf{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
.reisekopf h2{margin:0}
.pico .karte.anab{padding:14px 18px}
.stand{display:flex;flex-direction:column;padding:16px 20px 4px}
.stand>.etikett{margin-bottom:2px}
.standzeile{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:44px;border-top:1px solid var(--line);color:var(--fg);text-decoration:none}
.stand .etikett+.standzeile{border-top:0}
.standwert{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.standwert.offen{color:var(--warn)}
a.standzeile .standwert::after{content:" ›";color:var(--mut);font-weight:400}
@media (hover:hover){a.standzeile:hover>span:first-child{color:var(--acc)}}
.tagzeilen{display:flex;flex-direction:column}
.anab ul{margin:4px 0 0;padding:0}
.pico .anab li{list-style:none;font-weight:600;line-height:1.35;margin:2px 0;color:var(--fg)}

.tz-teil{padding:14px 0 4px}
.tagzeile{display:grid;grid-template-columns:3.5rem minmax(0,1fr) auto auto;gap:3px 12px;align-items:baseline;padding:11px 0;border-top:1px solid var(--line);color:var(--fg);text-decoration:none}
.tagzeilen>.tagzeile:first-child{border-top:0}
.tagzeile.an{background:var(--acc2)}
.tagzeile.ueber .tz-datum{color:var(--warn)}
.tagzeile.ueber .tz-datum b{color:var(--warn)}

/* ---------- Rückmeldefenster ---------- */

/* Wunsch-Brett (Paket G): am Handy Spalten untereinander, leere weg; ab 700 px eine Reihe wie ein Brett, leere Spalten

  .brett .spalte{flex:1 1 220px;min-width:180px}.brett .leer-spalte{flex:0 0 auto;min-width:0}}
.wu-karte{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin:0 0 10px;overflow-wrap:anywhere;display:flex;flex-direction:column;gap:6px}

/* Neuer Wunsch: Fläche, Wunsch über die ganze Breite, Link und Name nebeneinander, Senden rechts */

.pico details.wu-neu>summary{display:flex;align-items:center;gap:8px;min-height:44px;font-weight:700;font-size:1.1rem;color:var(--fg);cursor:pointer}

/* ==================== 6 Vorlagen: Teile der Ansichten ==================== */
.zurueck{display:inline-block;margin:0 0 8px;padding:6px 0;text-decoration:none;font-weight:600}

/* ---------- Tagesseite (B2): Reihenfolge je Gerät ----------
   Handy und Tablet (unterwegs): untereinander Tageskasten, Karte, Der Weg, Unterwegs nachschlagen, Orte, Hintergrund,
   Quellen. Rechner (planen; breit und mit Maus): Tageskasten neben der Karte, darunter links lesen, rechts nachschlagen. */
.tagseite{display:flex;flex-direction:column;gap:36px;margin-top:8px}
.tagseite>*,.tag-oben>*{margin:0;min-width:0}
.tag-oben{display:flex;flex-direction:column;gap:14px;order:1}
.tag-lesen,.tag-spalte{display:contents}
.ebene-weg{order:2}.ebene-unterwegs{order:3}.ebene-orte{order:4}.ebene-hintergrund{order:5}.ebene-quellen{order:6}.tagseite>.blaettern{order:7}
@media (min-width:1100px) and (pointer:fine){
  .tagseite{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,25rem);gap:36px 44px;align-items:start}
  .tag-oben{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:20px;align-items:start}
  .tag-oben,.tagseite>.blaettern{grid-column:1/-1}
  .tag-lesen,.tag-spalte{display:flex;flex-direction:column;gap:36px;order:2}
  .tagseite:not(:has(>.tag-lesen))>.tag-spalte{grid-column:1/-1}
}

/* ==================== 7 Rahmen der Seite: Kopf, Meldungen, Glas, Leiste ==================== */
/* ---------- Kopf: großer Titel am Seitenanfang (iOS Large Title), scrollt mit ---------- */
header{max-width:var(--breite);margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px 2px 16px}
header .t{font-family:var(--font-text);font-size:2rem;line-height:1.1;font-weight:700;letter-spacing:-.015em;margin:0;text-wrap:balance}
header .u{font-size:0.9375rem;color:var(--mut);margin-top:4px;text-wrap:balance}
header{position:relative}
header:has(.konto) .t{padding-right:6rem}
.konto{display:inline-flex;align-items:center;min-height:44px;padding:0 .25rem;font-size:0.875rem;color:var(--acc);text-decoration:none;max-width:9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header .konto{position:absolute;top:calc(10px + env(safe-area-inset-top));right:12px}
.meldungen{position:fixed;z-index:11;top:calc(10px + env(safe-area-inset-top));left:12px;right:12px;display:grid;justify-items:center;gap:8px;pointer-events:none}
.hinweis{pointer-events:auto;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 14px;border-radius:22px;font-size:0.8438rem;max-width:520px}
.hinweis[hidden]{display:none}
.hinweis button{font:inherit;font-weight:600;border:0;border-radius:99px;padding:6px 12px;background:var(--acc);color:var(--bg);cursor:pointer}
#offline{color:var(--warn);padding-right:14px}
/* ---------- Glas (Liquid Glass: 35 %, Blur 8px, Sättigung 170 %) ----------
   Leitbild: Inhalt läuft bis an die Ränder, Bedienelemente schweben als Glas darüber (iOS 26/27).
   Ohne backdrop-filter bleibt das Glas deckend, sonst stünde Text auf Text. */
.glas{background:var(--card);border:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.18);color:var(--fg)}
@supports ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){
  .glas{background:color-mix(in srgb,var(--card) 35%,transparent);-webkit-backdrop-filter:blur(8px) saturate(170%);backdrop-filter:blur(8px) saturate(170%);
        border-color:color-mix(in srgb,var(--fg) 14%,transparent);box-shadow:inset 0 1px 0 color-mix(in srgb,var(--fg) 10%,transparent),0 10px 30px rgba(0,0,0,.25)}
}
.rund{display:inline-flex;align-items:center;justify-content:center;width:var(--knopf);height:var(--knopf);border-radius:50%;padding:0;cursor:pointer;text-decoration:none}
/* ---------- Leiste: Glas über dem Inhalt mit Reitern, die Suche ist der letzte Reiter (B2, Fassung „Glas“, frieda-reist#55, 28.10.2026) ----------
   Stärker deckend als die Meldungen (58 % statt 35 %, Unschärfe 14 px), damit die Reiter über jedem Inhalt lesbar bleiben.
   Der gewählte Reiter ist eine hellgrüne Pille. Der Rand ist ein Schatten statt border, so behalten die Reiter ihre Breite.
   Ohne backdrop-filter bleibt die Leiste deckend weiß (dunkel: Fläche). */
nav{display:flex}
nav a{min-width:0;text-align:center;color:var(--mut);text-decoration:none;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.leiste{position:fixed;z-index:10;left:10px;right:10px;bottom:calc(var(--tabbar-gap) - var(--hoehe-fehlt));max-width:700px;margin:0 auto;display:flex;align-items:stretch;gap:2px;
  height:var(--tabbar-h);padding:5px;border-radius:22px;background:var(--card);box-shadow:0 0 0 1px var(--line),var(--schatten)}
@supports ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){
  .leiste{background:color-mix(in srgb,var(--card) 58%,transparent);-webkit-backdrop-filter:blur(14px) saturate(170%);backdrop-filter:blur(14px) saturate(170%);
    box-shadow:0 0 0 1px color-mix(in srgb,var(--fg) 10%,transparent),inset 0 1px 0 color-mix(in srgb,#fff 40%,transparent),0 10px 30px rgba(20,30,25,.18)}
}
nav{flex:1;min-width:0;display:flex;gap:2px}
nav a,#suchKnopf{flex:1 1 0;min-width:0;padding:0 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:12px;border:0;background:none;cursor:pointer;
      color:var(--mut);text-decoration:none;font:600 0.6562rem/1.1 var(--font-text);letter-spacing:-.01em;white-space:nowrap}
#suchKnopf{flex:0 1 calc(100% / 6)}
nav a span,#suchKnopf span{max-width:100%;overflow:hidden;text-overflow:ellipsis}
@media (max-width:380px){nav a,#suchKnopf{font-size:0.5938rem;letter-spacing:-.03em;padding:0 1px}}
nav a.on{color:var(--acc);background:color-mix(in srgb,var(--acc2) 85%,transparent);font-weight:700}
#suchfeld{flex:1;display:flex;align-items:center;gap:8px;padding:0 4px 0 14px;margin:0;color:var(--mut)}
#suchfeld[hidden]{display:none}
#suchfeld input::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
#suchfeld input{flex:1;min-width:0;border:0;background:none;color:var(--fg);font:inherit;font-size:1.0625rem;outline:none;padding:0}
#suchfeld input::placeholder{color:var(--mut);opacity:1}
#suchZu{border:0;background:color-mix(in srgb,var(--fg) 8%,transparent);color:var(--fg);width:44px;height:44px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
body.sucht nav,body.sucht #suchKnopf{display:none}
body::after{content:"";position:fixed;z-index:9;left:0;right:0;bottom:calc(0px - var(--hoehe-fehlt));height:var(--tabbar-space);pointer-events:none;
    background:linear-gradient(to bottom,transparent,color-mix(in srgb,var(--bg) 70%,transparent))}
main{padding-bottom:calc(var(--tabbar-space) + 16px)}
@media (hover:hover){nav a:hover,#suchKnopf:hover{color:var(--fg)} .rund:hover{border-color:var(--acc)}}
/* Zahl am Reiter „Offen“: offene Aufgaben + nicht gesendete Rückmeldungen */
nav a{position:relative}
nav a .zahl{position:absolute;top:3px;left:calc(50% + 4px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--acc);color:var(--bg);font-size:0.6562rem;font-weight:700;line-height:17px;text-align:center;letter-spacing:0}
nav a.warn .zahl{background:var(--warn)}

/* ==================== 8 Breiten ==================== */
@media (min-width:700px){
  :root{--tabbar-h:68px;--knopf:50px}
  nav a,#suchKnopf{font-size:0.75rem;gap:3px}
  .sym{width:24px;height:24px}
  header .t{font-size:2.25rem}
}
@media (min-width:760px){
  :root{--breite:920px}
  html{font-size:106.25%}

}
@media (min-width:1100px){
  :root{--breite:1280px}
  html{font-size:118.75%}
  /* Tage des Plans in zwei Spalten; ein Tag mit offenem Vergleich nimmt die ganze Breite */
  section.ziel:has(>.karte.ziel[id^="T-"]){display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px;align-items:start}
  section.ziel:has(>.karte.ziel[id^="T-"])>*{grid-column:1/-1;margin-top:0;margin-bottom:0}
  section.ziel:has(>.karte.ziel[id^="T-"])>.karte.ziel{grid-column:auto;margin:0}
  section.ziel:has(>.karte.ziel[id^="T-"])>.karte.ziel:has(.wm:not([hidden])){grid-column:1/-1}
}

  :root{--breite:1400px}
  html{font-size:125%}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

<body>
<!--__SYMBOLE__-->
<header>
  <h1 class="t" id="titel"></h1><div class="u" id="untertitel"></div>
</header>
<div class="meldungen">
  <div id="neu" class="hinweis glas" role="status" hidden>Neue Version des Handbuchs bereit. <button type="button" id="neuLaden">Aktualisieren</button></div>
  <div id="offline" class="hinweis glas" role="status" hidden>Ohne Netz: gespeicherter Stand. Rückmeldungen werden nachgereicht, Aufgaben erst wieder mit Netz änderbar.</div>
</div>
<main id="main" class="pico"></main>
<dialog id="rm" class="pico"></dialog>
<div class="leiste">
  <nav id="nav" aria-label="Kategorien"></nav>
  <button type="button" id="suchKnopf" aria-label="Suchen (Taste /)" aria-expanded="false" aria-controls="suchfeld"><svg class="sym" aria-hidden="true"><use href="#i-suche"/></svg><span aria-hidden="true">Suche</span></button>
  <form id="suchfeld" role="search" hidden>
    <svg class="sym" aria-hidden="true"><use href="#i-suche"/></svg>
    <input id="suche" type="search" placeholder="Ort, Stichwort, ID …" aria-label="Im Handbuch suchen" autocomplete="off" autocapitalize="off" enterkeyhint="search">
    <button type="button" id="suchZu" aria-label="Suche schließen"><svg class="sym" aria-hidden="true"><use href="#i-zu"/></svg></button>
  </form>
</div>
<script src="leaflet-1.9.4.js"></script>
<!-- protomaps-leaflet 5.1.0 (BSD-3, protomaps.com) für die Offline-Grundkarte; nur mit Grundkarte eingefügt -->
<!--__GRUNDKARTE__-->
<script>
"use strict";
const D = /*__DATEN__*/null;

/* ---------- Hilfen ---------- */
const $ = (s, w = document) => w.querySelector(s);
function el(tag, attrs, ...kinder) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === false || v == null) continue;
    if (k === "html") e.innerHTML = v;
    else if (k === "class") e.className = v;
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kinder.flat(Infinity)) if (k != null && k !== false) e.append(k.nodeType ? k : document.createTextNode(k));
  return e;
}
function norm(s) {
  return Array.from(s).map(c => (c.normalize("NFD").replace(/[̀-ͯ]/g, "") || c).toLowerCase()).join("");
}
function klartext(html) {
  const t = document.createElement("template");
  t.innerHTML = html;
  return t.content.textContent.replace(/\s+/g, " ").trim();
}

/* ---------- Daten ---------- */
const abschnitte = D.abschnitte;
const proId = new Map();      // Abschnitts-ID -> Abschnitt
const blockZu = new Map();    // Block-ID -> Abschnitt
const zeileZu = new Map();    // Zeilen-ID (T-, U-, F-) -> Abschnitt oder "fragen"
for (const a of abschnitte) {
  proId.set(a.id, a);
  for (const b of a.bloecke) blockZu.set(b.id, a);
  if (a.tabelle) for (const z of a.tabelle.zeilen) zeileZu.set(z.id, a);
}
for (const z of D.fragen.zeilen) zeileZu.set(z.id, "fragen");
const R = D.route;
// Bausteine und Verhalten je Status (reise.yaml, docs/produkt.md, Paket B): Ausgeschaltetes verschwindet aus der Seite,
// die Daten bleiben. schreiben: alles | nachlese (Plan gesperrt, Rückmeldungen und Aufgaben gehen) | nichts.
const BAUSTEINE = new Set(D.reise.bausteine || []);
const B = n => BAUSTEINE.has(n);
const V = D.reise.verhalten || {schreiben: "alles", fristen: true};
const KANN_RM = B("rueckmeldungen") && V.schreiben !== "nichts";
const KANN_AG = B("aufgaben") && V.schreiben !== "nichts";
const KANN_WUNSCH = B("wuensche") && V.schreiben === "alles";
if (R && !B("karte")) { R.karte = null; R.punkte = {}; }
if (R) {
  for (const t of R.tage) zeileZu.set(t.id, "plan");
  for (const id of Object.keys(R.weitere_tage)) zeileZu.set(id, "plan");
  for (const u of Object.keys(R.unterkuenfte)) zeileZu.set(u, "plan");
  for (const w of R.wahlstellen) { zeileZu.set(w.id, "plan"); for (const o of w.optionen) zeileZu.set(o.id, "plan"); }
  for (const p of R.plaene) zeileZu.set(p.id, "varianten");
}
const wahlZu = new Map((R ? R.wahlstellen : []).map(w => [w.id, w]));
const optionZu = new Map((R ? R.wahlstellen : []).flatMap(w => w.optionen.map(o => [o.id, [w, o]])));
const optionFest = oid => ((optionZu.get(oid) || [])[1] || {}).status === "gewaehlt";
const planFest = p => p.auswahl.length > 0 && p.auswahl.every(optionFest);
// Ist ein Plan vollständig gewählt, wird die Karte mit diesem Plan zur Startseite (25.10.2026); seit dem 28.10.2026
// als Reiseüberblick „Reise“ ohne Planname und ohne die anderen Pläne (ansichtReise)
const PLAN_FEST = (R ? R.plaene : []).find(planFest);
const VARIANTEN_TITEL = PLAN_FEST ? "Reise" : D.reise.varianten_titel || "Varianten";

const G = Object.assign({wissen: "Wissen", praxis: "Praxis", quelle: "Quellen"}, D.reise.gruppen || {});
const hat = typ => abschnitte.some(a => a.typ === typ);
const HAT_VARIANTEN = B("varianten") && !!(D.route && (D.route.plaene.length || D.route.karte));
const PLAN_TITEL = Array.isArray(D.reise.plan_reiter) && D.reise.plan_reiter.length ? "Überblick" : "Plan";
// Gewählter Plan: Etappe -> Tag, an dem sie gegangen wird. Die Tagesseite zeigt dann die ganze Etappe mit Karte,
// der Reiter „Etappen“ entfällt, übrige Wege stehen unter Wissen (25.10.2026)
const ETAPPE_TAG = new Map();
const PLAN_TAGE = B("tagesseiten") ? PLAN_FEST : null;   // Tagesseiten nur, wenn der Baustein an ist
if (PLAN_TAGE) for (const t of PLAN_TAGE.tage) for (const s of t.strecken)
  if ((proId.get(s.id) || {}).typ === "etappe" && !ETAPPE_TAG.has(s.id)) ETAPPE_TAG.set(s.id, t.id);
const ETAPPEN_REITER = hat("etappe") && !PLAN_TAGE;
const WUENSCHE = B("wuensche");
const REITER = [
  // Zeigt der Reiter nur den Rahmen (Route noch offen), heißt er „Überblick“, sonst neben „Pläne“ verwirrend (25.10.2026)
  ["plan", PLAN_TITEL, true], ["varianten", VARIANTEN_TITEL, HAT_VARIANTEN], ["etappen", "Etappen", ETAPPEN_REITER],
  // Praxis steht im Reiter Wissen; „Offen“ sammelt Aufgaben, Fragen und Rückmeldungen (25.10.2026)
  // Quellen stehen seit dem 25.10.2026 ebenfalls im Reiter Wissen; ihr Platz in der Leiste gehört der Suche
  ["wissen", G.wissen, hat("wissen") || hat("praxis") || hat("quelle") || (hat("etappe") && !ETAPPEN_REITER)],
  // Wünsche der Mitreisenden: eigener Reiter, wenn die Reise ihn einschaltet (reise.yaml bausteine; 25.10.2026)
  ["wuensche", "Wünsche", WUENSCHE], ["offen", "Offen", B("aufgaben") || B("fragen") || B("rueckmeldungen")],
].filter(r => r[2]);
// Startreiter steht vorn und öffnet ohne Sprungziel: reise.json „start“, sonst bei gewähltem Plan die Karte
// Unterwegs beginnt die Seite mit „Heute“ und der Karte (Verhalten je Status), sonst gilt „start“ der Reise
const START = V.start === "heute" && REITER.some(r => r[0] === "varianten") ? "varianten"
  : REITER.some(r => r[0] === D.reise.start) ? D.reise.start
  : PLAN_FEST && REITER.some(r => r[0] === "varianten") ? "varianten" : "plan";
REITER.sort((a, b) => (b[0] === START) - (a[0] === START));
const TYP_REITER = {plan: "plan", etappe: ETAPPEN_REITER ? "etappen" : "wissen", uebersicht: ETAPPEN_REITER ? "etappen" : "wissen", wissen: "wissen", praxis: "wissen", quelle: "wissen", ort: "varianten"};

/* ---------- Bausteine ---------- */
// Symbol aus dem eingebetteten Lucide-Satz (<symbol id="i-…">), für Screenreader ausgeblendet
function symbol(name, klasse) {
  const t = document.createElement("template");
  t.innerHTML = `<svg class="sym${klasse ? " " + klasse : ""}" aria-hidden="true"><use href="#i-${name}"/></svg>`;
  return t.content.firstChild;
}
// Atom Kennung: Sprechblase mit Tooltip („Anmerken“ oder „2 Rückmeldungen · 1 Aufgabe offen“), Zahl und Warnpunkt.
// Ohne die Bausteine Rückmeldungen und Aufgaben bleibt die Kennung als schlichter Text.
function zid(id) {
  if (!B("rueckmeldungen") && !B("aufgaben")) return el("span", {class: "zid"}, id);
  const n = rmZu(id).length, a = agZu(id).filter(agOffen).length;
  const rm = n === 1 ? "1 Rückmeldung" : `${n} Rückmeldungen`, ag = a === 1 ? "1 Aufgabe offen" : `${a} Aufgaben offen`;
  const knopf = el("button", {type: "button", class: "zid" + (n ? " hat-rm" : "") + (a ? " hat-ag" : ""), "data-rm": id,
    title: [n ? rm : "Anmerken", a ? ag : ""].filter(Boolean).join(" · "), "aria-label": [`Anmerken zu ${id}`, n ? rm : "", a ? ag : ""].filter(Boolean).join(", ")},
    symbol("rueckmeldungen", "zid-blase"), n ? el("span", {class: "zid-n", "aria-hidden": "true"}, String(n)) : null, a ? el("span", {class: "zid-o", "aria-hidden": "true"}) : null);
  return el("span", {class: "zid-box"}, knopf);
}
/* Bausteine nach Ebenen (Designsystem, frieda-reist#18, docs/design.md). Jede Ansicht setzt sich aus ihnen zusammen,
   statt dieselbe Sache selbst zu zeichnen; die Stile stehen im <style> in derselben Ordnung.
   Atome:     symbol, chip (Zustand), Etikett (CSS), merkmalWert (Wert mit Herkunft), zid (Kennung), planMarke
   Moleküle:  kennzahlLeiste, merkmalListe, reiseText (Reisetext mit Merkmallisten), reiterGruppe, ebeneKopf, dingEtikett,
              listenZeile, zeilenKarte, rmEintrag, agEintrag, eintragGruppen, kartenLegende, umschalter, kontoKnopf,
              nameFeld, fehltZeile, optionChips, standLeiste
   Organismen: Ding (nachtZeile, unterkunftKarte, streckeZeile), Wahl-Modul (wahlEinstieg, wahlVergleich, wahlKarte),
              tagKarte (Tageskasten mit wegVerlauf), tagEbenen, tagOrteZeilen, tagZeile, uebersichtKarte
   Vorlagen:  tagKachel, Ansichten (ansichtTag = Tagesseite, ansichtReise = Reiseüberblick, ansichtPlan …)
   Zustände haben feste Namen, die Farbe folgt der Bedeutung, nicht dem Ort:
     plan      entschieden oder im Plan (Akzent)       offen  braucht noch eine Entscheidung (Warnfarbe)
     unterwegs erst unterwegs zu entscheiden           weg    verworfen oder ersetzt (durchgestrichen)
     leise     Nebenangabe (Teil, Zuständig, Frist)    neben  Nebenroute
   ohne Zustand: einfacher Hinweis. Andere Werte (st-…, ag-…) sind eigene Zustände der Rückmeldungen und Aufgaben. */
const CHIP = {plan: " plan", offen: " offen", unterwegs: " unterwegs", weg: " weg", leise: " ag-leise", neben: " neben"};
function chip(zustand, text, attrs) {
  const {href, class: zusatz, ...rest} = attrs || {};
  return el(href ? "a" : "span", {class: "chip" + (CHIP[zustand] ?? (zustand ? " " + zustand : "")) + (zusatz ? " " + zusatz : ""), href, ...rest}, text);
}

function zeilenKarte(spalten, z) {
  const k = el("div", {class: "karte ziel", id: z.id, "data-ziel": z.id});
  const nr = /^\d+$/.test(z.zellen[0]) ? spalten[0] + " " : "";
  k.append(el("div", {class: "k"}, nr + z.zellen[0] + (z.zellen[1] && z.zellen[1] !== "–" ? " · " + z.zellen[1] : ""), zid(z.id)));
  if (z.zellen[2]) k.append(el("div", {}, z.zellen[2]));
  for (let i = 3; i < spalten.length; i++) {
    if (!z.zellen[i] || z.zellen[i] === "–") continue;
    k.append(el("div", {class: "z"}, el("b", {}, spalten[i] + ": "), z.zellen[i]));
  }
  for (const ziel of z.ziele || []) {
    const a = proId.get(ziel);
    if (a) k.append(el("div", {class: "z"}, el("a", {href: "#" + ziel}, "→ " + a.titel)));
  }
  return k;
}

// Molekül Reisetext: HTML eines Abschnitts. Steht die Kennzahlenleiste auf derselben Seite, entfallen in den
// Merkmallisten die Zeilen, die sie schon zeigt (ein Wert steht einmal; kennzahlen = die gezeigten, wie in routen.yaml).
const normKz = t => t.toLowerCase().replace(/\s+/g, " ").trim();
function reiseText(html, kennzahlen) {
  const d = el("div", {class: "inhalt", html});
  const kz = new Set(Object.keys(kennzahlen || {}).map(normKz));
  if (kz.size) for (const z of d.querySelectorAll("dl.textmerkmale>div")) {
    if (!kz.has(normKz(z.querySelector("dt").textContent))) continue;
    const dl = z.parentNode;
    z.remove();
    if (!dl.children.length) dl.closest(".tabelle").remove();
  }
  return d;
}
// Gleicher Text an einer Stelle steht einmal (z. B. dieselbe Tabelle aus Etappen- und Unterkünfte-Dossier)
function einmal(bloecke) {
  const da = new Set();
  return bloecke.filter(b => !da.has(b.html) && da.add(b.html));
}
function block(b, offen, kennzahlen) {
  const d = el("details", {class: "block ziel", id: b.id, "data-ziel": b.id, open: offen},
    el("summary", {}, b.titel, zid(b.id)),
    b.orte ? ortChips(b.orte) : null,
    wissenKarte(b.id),
    reiseText(b.html, kennzahlen));
  return d;
}
// Orte, zu denen ein Abschnitt der Recherche gehört (reise.json orte_wissen)
function ortChips(liste) {
  return el("div", {class: "chips ortchips"}, el("span", {class: "z klein"}, "Orte:"),
    ...liste.map(o => chip("", (R && R.orte[o] || {}).name || o, {href: "#" + o})));
}

function chips(a) {
  const c = el("div", {class: "chips"});
  if (a.im_plan) c.append(chip("plan", "im Plan"));
  if (a.nebenroute) c.append(chip("neben", "Nebenroute"));
  for (const oid of a.optionen || []) {
    const [w, o] = optionZu.get(oid) || [];
    // Zustand aus der Wahlstelle: unterwegs nur bei Unterwegs-Wahl, offen solange die Planung offen ist
    if (w) c.append(chip(weg(o.status) ? "weg" : w.art === "unterwegs" ? "unterwegs" : w.offen ? "offen" : "", `Variante: ${o.titel}`));
  }
  return c.childNodes.length ? c : null;
}

function abschnittKarte(a) {
  const titel = a.typ === "etappe" ? a.titel : a.titel;
  const k = el("a", {class: "karte vorschau", href: "#" + a.id}, el("div", {class: "k"}, titel, zid(a.id)));
  if (a.typ === "etappe") k.append(...[chips(a), kennzahlLeiste(a.kennzahlen)].filter(Boolean));
  return k;
}

// kennzahlen: die Kennzahlen, die die Seite schon in der Leiste zeigt
function abschnittInhalt(a, ohneTitel, kennzahlen) {
  const s = el("section", {class: "ziel", id: a.id, "data-ziel": a.id});
  if (!ohneTitel) s.append(el("h2", {}, a.titel, zid(a.id)));
  if (a.orte) s.append(ortChips(a.orte));
  if (a.intro) s.append(el("div", {html: a.intro}));
  if (a.tabelle) {
    for (const z of a.tabelle.zeilen) s.append(zeilenKarte(a.tabelle.spalten, z));
    if (a.nach) s.append(el("div", {html: a.nach}));
  }
  if (a.route_ansicht === "tagesplan") tagesplan(s);
  if (a.route_ansicht === "unterkuenfte") unterkuenfte(s);
  einmal(a.bloecke).forEach((b, i) => s.append(block(b, i === 0, kennzahlen)));
  return s;
}

/* ---------- Route: Tage, Unterkünfte, Wahlstellen ---------- */
const STATUS_TEXT = {vorgeschlagen: "vorgeschlagen", favorisiert: "favorisiert", gewaehlt: "gewählt", verworfen: "verworfen", ersetzt: "ersetzt"};
const ART_TEXT = {bus: "Bus", bahn: "Bahn", flug: "Flug", faehre: "Fähre", mietwagen: "Mietwagen", rad: "Rad", wandern: "zu Fuß"};
const weg = s => s === "verworfen" || s === "ersetzt";
const optionZustand = s => weg(s) ? "weg" : s === "gewaehlt" ? "plan" : "";
const link = (id, text) => el("a", {href: "#" + id}, text);
const ortName = id => (R.orte[id] || {}).name || id || "?";
// Herkunft eines Kartenpunkts: Quelle und Prüfdatum (Feld geprueft oder stand der Punktdatei)
function punktHerkunft(p) { return [p.quelle, p.geprueft && "geprüft " + p.geprueft.split("-").reverse().map(Number).join(".")].filter(Boolean).join(" · "); }
function datumText(iso, wt) { const [, m, d] = iso.split("-"); return `${wt} ${+d}.${+m}.`; }
function dauer(min) { return `${Math.floor(min / 60)}:${String(min % 60).padStart(2, "0")} h`; }
function summeText(s) {
  if (!s) return "";
  const t = [s.tage === 1 ? "1 Tag" : `${s.tage} Tage`];
  if (s.km) t.push(`${String(s.km).replace(".", ",")} km`, `↑ ${s.auf} / ↓ ${s.ab} Hm`, `${dauer(s.min)} Gehzeit`);
  const ty = Object.entries(s.unterkunftstypen || {}).map(([k, v]) => `${v}× ${k}`);
  if (ty.length) t.push(ty.join(", "));
  return t.join(" · ") + (s.unvollstaendig && s.km ? " (nicht alle Strecken mit Kennzahlen)" : "");
}

// Molekül Kennzahlenleiste: Gehzeit, Aufstieg, Abstieg, Strecke mit Etikett; Namen aus routen.yaml werden vereinheitlicht
function kennzahlPaar(n, v) {
  return /^aufstieg/i.test(n) ? ["Aufstieg", `↑ ${v} m`] : /^abstieg/i.test(n) ? ["Abstieg", `↓ ${v} m`]
    : /^(gehzeit|dauer)/i.test(n) ? ["Gehzeit", v] : /^l(ä|ae)nge/i.test(n) ? ["Strecke", /^[\d.,]+$/.test(v) ? `${v} km` : v] : [n, v];
}
// Je Kennzahl eine Kachel; die bekannten tragen ihr Symbol im Etikett
const KZ_SYM = {Gehzeit: "gehzeit", Aufstieg: "aufstieg", Abstieg: "abstieg", Strecke: "strecke", Tage: "plan", "Höhenmeter": "aufstieg", "Nächte": "unterkunft", Orte: "ort", "Übernachtungen": "unterkunft"};
function kennzahlLeiste(kennzahlen) {

// Neu zeichnen nur des Moduls (nicht der ganzen Seite); der Fokus bleibt auf dem bedienten Element
function vglNeu(id, fokus) {
  const {w, liste, datum} = vglTeile(id);
  document.querySelectorAll(`[data-vgl="${CSS.escape(id)}"]`).forEach(x => x.replaceWith(wahlVergleich(w, liste, datum)));
  document.querySelectorAll(`[data-vgl-auf="${CSS.escape(id)}"]`).forEach(x => x.replaceWith(wahlEinstieg(w, liste, datum)));
  if (fokus) { const f = document.querySelector(fokus); if (f) f.focus(); }
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-vgl-auf], [data-vgl-opt], [data-vgl-ansicht]");
  if (!b) return;
  if (b.dataset.vglAuf) {
    const id = b.dataset.vglAuf, z = VGL.get(id);
    z.offen = !z.offen;
    return vglNeu(id, `[data-vgl-auf="${CSS.escape(id)}"]`);
  }
  const [id, wert] = (b.dataset.vglOpt || b.dataset.vglAnsicht).split("|"), z = VGL.get(id);
  if (b.dataset.vglAnsicht) z.ansicht = wert;
  else if (z.wahl.includes(wert)) { if (z.wahl.length > 2) z.wahl = z.wahl.filter(x => x !== wert); }
  else {
    // Ist kein Platz mehr, weicht die am längsten gezeigte Möglichkeit, die nicht im Plan steht
    z.wahl.push(wert);
    const {w} = vglTeile(id), imPlan = x => (w.optionen.find(o => o.id === x) || {}).aktiv;
    if (z.wahl.length > vglMax()) z.wahl.splice(Math.max(0, z.wahl.findIndex(x => !imPlan(x) && x !== wert)), 1);
  }
  vglNeu(id, `[${b.dataset.vglOpt ? "data-vgl-opt" : "data-vgl-ansicht"}="${CSS.escape(b.dataset.vglOpt || b.dataset.vglAnsicht)}"]`);
});
document.addEventListener("change", e => {
  const c = e.target.closest("[data-vgl-nur]");
  if (!c) return;
  VGL.get(c.dataset.vglNur).nur = c.checked;
  vglNeu(c.dataset.vglNur, `[data-vgl-nur="${CSS.escape(c.dataset.vglNur)}"]`);
});

/* Regeln zwischen Optionen (Paket 4, #18): „setzt voraus“ (geht nur zusammen mit jener) und „schließt aus“ (nie beide).
   Jede Zeile sagt, ob die andere Option im Plan steht. */
const REGEL_ZEILEN = [{id: "_erfordert", name: "Setzt voraus"}, {id: "_schliesst", name: "Schließt aus"}];
const regelStand = x => !x.gueltig ? "verworfen" : x.im_plan ? "im Plan" : "nicht im Plan";
const regelWert = liste => (liste || []).length ? {wert: liste.map(x => `${x.id} ${x.titel} (${regelStand(x)})`).join("; ")} : null;
function regelZeilen(o) {
  return [["Setzt voraus: ", o.erfordert], ["Schließt aus: ", o.schliesst_aus]].filter(([, l]) => (l || []).length).map(([t, l]) =>
    el("div", {class: "z klein"}, el("b", {}, t), l.flatMap((x, i) => [i ? "; " : "", link(x.id, x.titel), ` (${regelStand(x)})`])));
}
// Zustand einer Option und ob sie im Plan steht (Option im Wahl-Modul und in der Liste)
function optionChips(w, o) {
  return el("span", {class: "chips"},
    chip(optionZustand(o.status), STATUS_TEXT[o.status] || o.status),
    o.aktiv && !w.optionen.every(x => x.aktiv) ? chip("", w.art === "unterwegs" ? "Standard" : (w.offen ? "vorläufig im Plan" : "im Plan")) : null);
}
// ohneMerkmale: Die Merkmale stehen schon im Wahl-Modul darüber
function optionBlock(w, o, ohneMerkmale) {
  const b = el("div", {class: "option ziel" + (o.aktiv ? " aktiv" : ""), id: o.id, "data-ziel": o.id});
  b.append(el("div", {class: "k"}, o.titel, zid(o.id)), optionChips(w, o));
  if (o.ausloeser) b.append(el("div", {class: "z"}, el("b", {}, "Wann: "), o.ausloeser));
  if (o.text) b.append(el("div", {class: "z"}, o.text));
  // Kennzahlen eigener Strecken stehen schon unter der Strecke
  const mk = ohneMerkmale ? null : merkmalListe(w.kriterien.filter(k => !(k.auto && (o.strecken || []).length)), o.merkmale), luecke = fehltZeile(w, o);
  if (mk) b.append(mk);
  if (luecke) b.append(luecke);
  b.append(...regelZeilen(o));

  if (o.plus.length) b.append(el("ul", {}, o.plus.map(x => el("li", {}, "+ " + x))));

  for (const sid of o.strecken || []) b.append(streckeZeile(sid));

  if (o.tage && o.tage.length) {

    if (aktivTage.length) {
      const z = el("div", {class: "z klein"}, "Im Tagesplan: ");
      aktivTage.forEach((tid, i) => { const t = R.tage.find(x => x.id === tid); if (i) z.append(", "); z.append(link(tid, `Tag ${t.nr}`)); });
      b.append(z);

      for (const tid of andere) d.append(tagKarte(R.weitere_tage[tid]));

    }

  if (o.siehe && proId.has(o.siehe)) b.append(el("div", {class: "z klein"}, link(o.siehe, "→ " + proId.get(o.siehe).titel)));

  if (o.verlauf.length) b.append(el("div", {class: "verlauf"}, o.verlauf.map(v =>
    `${v.datum.split("-").reverse().join(".")}: ${STATUS_TEXT[v.status] || v.status}${v.wer ? " (" + v.wer + ")" : ""}${v.grund ? " – " + v.grund : ""}${v.durch ? " → " + v.durch : ""}`).join(" · ")));

}

function wahlKarte(w) {
  const k = el("div", {class: "karte ziel", id: w.id, "data-ziel": w.id});
  const gueltig = w.optionen.filter(o => !weg(o.status));
  const offen = w.art === "planung" && w.offen && gueltig.length > 1;
  k.append(el("div", {class: "k"}, w.titel, zid(w.id)),
    el("div", {class: "chips"},
      chip(w.art === "unterwegs" ? "unterwegs" : "", w.art === "unterwegs" ? "unterwegs entscheiden" : "Planung"),
      w.art === "planung" ? chip(offen ? "offen" : "", offen ? "offen" : "entschieden") : null,
      w.frage ? link(w.frage, w.frage) : null));
  if (w.text) k.append(el("div", {class: "z"}, w.text));
  if (w.an.length) {
    const z = el("div", {class: "z klein"}, "Betrifft: ");
    w.an.forEach((tid, i) => { if (i) z.append(", "); const t = R.tage.find(x => x.id === tid); z.append(t ? link(tid, `Tag ${t.nr}`) : tid + " (nicht im aktuellen Plan)"); });
    k.append(z);
  }
  // Liste der Entscheidungen: Vergleich gleich offen, die Optionen darunter ohne die Merkmale (stehen im Vergleich)
  const tage = w.an.map(tid => R.tage.find(t => t.id === tid)).filter(Boolean), datum = tage.length === 1 ? tage[0].datum : null;
  const vgl = wahlVergleich(w, true, datum);
  if (vgl) k.append(el("div", {class: "chips"}, wahlEinstieg(w, true, datum)), vgl);
  for (const o of gueltig) k.append(optionBlock(w, o, !!vgl && gueltig.some(x => gefuellt(w, x))));
  const verw = w.optionen.filter(o => weg(o.status));
  if (verw.length) {
    const d = el("details", {class: "weg"}, el("summary", {}, `Verworfen (${verw.length})`));
    for (const o of verw) d.append(optionBlock(w, o));

function warnungen(liste) {
  return el("div", {class: "warnungen"}, el("b", {}, "Geht noch nicht auf:"),
    el("ul", {}, liste.map(w => el("li", {}, w.text, " ", /^[TV]-/.test(w.bezug) ? link(w.bezug, "→") : null))));
}

function entscheidungen(m) {
  const offen = R.wahlstellen.filter(w => w.art === "planung" && w.offen && w.optionen.filter(o => !weg(o.status)).length > 1);
  const s = el("section", {class: "ziel", id: "entscheidungen"}, el("h2", {}, "Entscheidungen und Varianten"));
  const andere = R.warnungen.filter(w => /^V-/.test(w.bezug));

  if (offen.length) {
    s.append(el("h3", {}, `Noch zu entscheiden (${offen.length})`));
    for (const w of offen) s.append(wahlKarte(w));
  }
  const unterwegs = R.wahlstellen.filter(w => w.art === "unterwegs");
  if (unterwegs.length) {
    s.append(el("h3", {}, "Unterwegs entscheiden"));
    for (const w of unterwegs) s.append(wahlKarte(w));
  }

  if (fest.length) {
    const d = el("details", {class: "block"}, el("summary", {}, `Entschieden (${fest.length})`));
    const inh = el("div", {class: "inhalt"});
    for (const w of fest) inh.append(wahlKarte(w));

/* ---------- Varianten: Pläne nebeneinander, schematische Karte ----------
    Pläne rechnet der Generator vollständig durch;

// null = noch nichts gewählt: dann zeigt die Karte den fest entschiedenen Plan (ansichtVarianten)

const planFarbe = p => `var(--plan-${p.farbe || "a"})`;

const umschalter = (titel, knoepfe) => el("fieldset", {class: "umschalter"}, el("legend", {class: "unsichtbar"}, titel),
  ...knoepfe.map(([daten, an, ...inhalt]) => el("button", {type: "button", ...daten, "aria-pressed": String(an)}, ...inhalt)));
const planUmschalter = alle => umschalter("Plan wählen", [[{"data-variante": ""}, !VARIANTE, `Alle ${alle.length}`],
  ...alle.map(p => [{"data-variante": p.id}, VARIANTE === p.id, planMarke(p, "linie"), `${p.kurz}${planFest(p) ? " (gewählt)" : !TIEFE && p.aktuell ? " (aktuell)" : ""}`])]);
const PLAN_BREITE = [8, 5, 2.6, 1.6];
// Übernachtungskategorie (hotel, gasthaus, huette …; routen.py KATEGORIEN) bestimmt die Farbe auf Karte und im Vergleich
function nachtKat(n) {
  if (!n || n.an_bord) return n && n.an_bord ? "unterwegs" : "";
  if (n.unterkunft && R.unterkuenfte[n.unterkunft]) return R.unterkuenfte[n.unterkunft].kategorie || "sonstige";
  return n.kategorie || "offen";
}
const katKlasse = k => k && k !== "offen" ? " kat-" + k : "";
function nachtTyp(n) {
  if (!n || n.an_bord) return "";
  if (n.unterkunft && R.unterkuenfte[n.unterkunft]) return R.unterkuenfte[n.unterkunft].typ || "";
  return n.typ || "offen";
}
function nachtName(n) {
