function agKnopf() { offenZahl(); }

function agEintrag(a, mitBezug) {
  const zu = !agOffen(a);
  const d = el("div", {class: "rmeintrag ag" + (zu ? " zu" : "")});
  d.append(el("button", {type: "button", class: "haken" + (a.status === "erledigt" ? " an" : ""), "data-ag-haken": a.id,
    "aria-label": a.status === "erledigt" ? `${a.id} wieder öffnen` : `${a.id} abhaken`}, a.status === "erledigt" ? "✓" : ""));
  const t = el("div", {class: "ag-text"});
  t.append(el("div", {}, el("span", {class: "titel"}, a.titel), " ", el("span", {class: "zid"}, a.id)));
  const c = el("div", {class: "chips"});
  if (a.status === "in_arbeit" || a.status === "entfaellt") c.append(el("span", {class: "chip ag-leise"}, AG_STATUS[a.status]));
  if (a.prioritaet === "hoch") c.append(el("span", {class: "chip ag-hoch"}, "wichtig"));
  if (a.prioritaet === "niedrig") c.append(el("span", {class: "chip ag-leise"}, "kann warten"));
  if (a.frist) c.append(el("span", {class: "chip" + (ueberfaellig(a) ? " ag-ueber" : "")}, (ueberfaellig(a) ? "überfällig seit " : "bis ") + tagMonat(a.frist)));
  if (a.ab && agOffen(a)) c.append(el("span", {class: "chip ag-leise"}, "ab " + tagMonat(a.ab)));
  if (a.zustaendig) c.append(el("span", {class: "chip ag-leise"}, a.zustaendig));
  if (a.status === "erledigt" && a.erledigt) c.append(el("span", {class: "chip ag-leise"}, "erledigt " + tagMonat(a.erledigt)));
  if (c.childNodes.length) t.append(c);
  if (mitBezug && (a.bezug || []).length) t.append(el("div", {class: "kopfzeile"}, "an: ",
    a.bezug.map((b, i) => [i ? ", " : "", el("a", {href: "#" + b}, b + (titelZu(b) ? " " + titelZu(b) : ""))])));
  if (a.notiz) t.append(el("div", {class: "text"}, a.notiz));
  t.append(el("button", {type: "button", class: "outline klein", "data-ag-edit": a.id}, "Bearbeiten"));
  d.append(t);
  return d;
}

function agFormular(agid, bezug, zurueck) {
  const a = AG.find(x => x.id === agid);
  const dlg = $("#rm");
  const feld = (name, label, inhalt) => [el("label", {for: "ag-" + name}, label), inhalt];
  const datum = (name, wert) => el("input", {id: "ag-" + name, type: "date", value: wert || ""});
  const namen = [...new Set(AG.map(x => x.zustaendig).concat(RM.map(x => x.name), NAME).filter(Boolean))];
  dlg.replaceChildren(
    el("div", {class: "rmkopf"},
      el("div", {}, el("div", {class: "k"}, a ? "Aufgabe " + a.id : "Neue Aufgabe"),
        el("div", {class: "meldung"}, a ? a.titel : (bezug.length ? "an " + bezug.map(b => b + (titelZu(b) ? " " + titelZu(b) : "")).join(", ") : "allgemein zur Reise"))),
      zurueck ? el("button", {type: "button", class: "outline klein", "data-rm": zurueck}, "Zurück") : null,
      el("button", {type: "button", class: "outline klein", "data-schliessen": "1"}, "Schließen")),
    el("div", {class: "rminhalt"},
      el("form", {id: "agForm"},
        ...feld("titel", "Was ist zu tun?", el("input", {id: "ag-titel", required: true, maxlength: 200, value: a ? a.titel : "", autocomplete: "off"})),
        ...feld("bezug", "Gehört zu (IDs, mit Komma getrennt; leer = allgemein)",
          el("input", {id: "ag-bezug", maxlength: 400, value: (a ? a.bezug : bezug).join(", "), autocomplete: "off", autocapitalize: "characters"})),
        el("div", {class: "zwei"},
          el("div", {}, ...feld("zustaendig", "Zuständig", el("input", {id: "ag-zustaendig", maxlength: 80, value: a ? a.zustaendig : "", list: "ag-namen", autocomplete: "off"}))),
          el("div", {}, ...feld("prioritaet", "Priorität", el("select", {id: "ag-prioritaet"},
            AG_PRIO.map(p => el("option", {value: p, selected: (a ? a.prioritaet : "normal") === p}, p))))),
          el("div", {}, ...feld("ab", "Ab wann möglich", datum("ab", a && a.ab))),
          el("div", {}, ...feld("frist", "Frist (erledigt bis)", datum("frist", a && a.frist)))),
        el("datalist", {id: "ag-namen"}, namen.map(n => el("option", {value: n}))),
        a ? feld("status", "Status", el("select", {id: "ag-status"},
          Object.entries(AG_STATUS).map(([k, t]) => el("option", {value: k, selected: a.status === k}, t)))) : null,
        ...feld("notiz", "Notiz (optional: Details, Link, Kontakt)", el("textarea", {id: "ag-notiz", maxlength: 2000}, a ? a.notiz : "")),
        a ? feld("kommentar", "Kommentar für den Verlauf (optional)", el("input", {id: "ag-kommentar", maxlength: 500, autocomplete: "off",
          placeholder: "z. B. angerufen, Rückruf am Montag"})) : null,
        ...feld("name", "Dein Name", el("input", {id: "ag-name", required: true, maxlength: 80, value: NAME, autocomplete: "name"})),
        el("p", {class: "meldung", id: "agMeldung"}, AG_OK === false ? "Gerade keine Verbindung: Ändern geht erst wieder mit Netz." :
          "Gilt sofort für alle, auch in der Claude-App."),
        el("button", {type: "submit"}, a ? "Speichern" : "Anlegen")),
      a ? el("div", {class: "verlauf"}, el("h4", {}, "Verlauf"), a.verlauf.slice().reverse().map(v => el("div", {class: "rmeintrag"},
        el("div", {class: "kopfzeile"}, `${(v.zeit || "").slice(0, 10).split("-").reverse().join(".")} · ${v.wer} · ${v.was}`),
        v.felder ? el("div", {}, Object.entries(v.felder).map(([k, [alt, neu]]) => `${AG_FELD[k] || k}: ${agWert(k, alt)} → ${agWert(k, neu)}`).join("; ")) : null,
        v.kommentar ? el("div", {class: "text"}, v.kommentar) : null))) : null));
  dlg.dataset.ag = agid || "";
  dlg.dataset.ziel = zurueck || "";   // leer: aus der Übersicht geöffnet, kein „Zurück“
  if (!dlg.open) dlg.showModal();
  if (!a) $("#ag-titel").focus();
}

async function agSpeichern() {
  const dlg = $("#rm"), agid = dlg.dataset.ag, m = $("#agMeldung");
  const name = $("#ag-name").value.trim();
  if (!name) return;
  NAME = name; try { localStorage.setItem("rh-name", NAME); } catch (e) {}
  const body = {name, titel: $("#ag-titel").value.trim(), bezug: $("#ag-bezug").value.split(/[,\s]+/).filter(Boolean),
    zustaendig: $("#ag-zustaendig").value.trim(), prioritaet: $("#ag-prioritaet").value,
    ab: $("#ag-ab").value, frist: $("#ag-frist").value, notiz: $("#ag-notiz").value.trim()};
  if (agid) { body.status = $("#ag-status").value; body.kommentar = $("#ag-kommentar").value.trim(); }
  const fremd = body.bezug.filter(b => !titelZu(b));
  if (fremd.length && !confirm(`Diese IDs kennt das Handbuch nicht: ${fremd.join(", ")}. Trotzdem speichern?`)) return;
  try {
    const a = await agSenden(agid ? "PATCH" : "POST", agid ? AG_API + "/" + encodeURIComponent(agid) : AG_API, body);
    const zurueck = dlg.dataset.ziel;
    agKnopf(); route(true);
    if (zurueck && a.bezug.includes(zurueck)) rmFormular(zurueck); else agFormular(a.id, [], zurueck);
    const ok = $("#agMeldung"); if (ok) ok.textContent = `Gespeichert als ${a.id}.`;
  } catch (f) { m.textContent = "Nicht gespeichert: " + f; }
}

async function agHaken(agid) {
  const a = AG.find(x => x.id === agid);
  if (!a) return;
  const name = nameHolen();
  if (!name) return;
  try { await agSenden("PATCH", AG_API + "/" + encodeURIComponent(agid), {name, status: a.status === "erledigt" ? "offen" : "erledigt"}); }
  catch (f) { alert("Nicht gespeichert: " + f); return; }
  rmNeuZeichnen();
}

function ansichtAufgaben(m) {
  m.append(el("h2", {}, "Aufgaben"));
  m.append(el("p", {class: "meldung"}, "Aufgaben hängen an einer Stelle im Handbuch (z. B. U-13 oder T-07) oder an der Reise allgemein. Alle können sie anlegen, abhaken und ändern; jede Änderung steht im Verlauf. Auch über das ☐ an jeder Nummer."));
  m.append(el("button", {type: "button", class: "outline", "data-ag-neu": ""}, "+ Neue Aufgabe"));
  if (AG_OK === false) m.append(el("p", {class: "meldung"}, "Gerade keine Verbindung – angezeigt wird der zuletzt geladene Stand."));
  const f = el("div", {class: "agfilter"});
  const filter = [["alle", "Alle"], ...(NAME ? [["meine", "Meine (" + NAME + ")"]] : []), ["ohne", "Ohne Zuständige"]];
  if (!filter.some(([k]) => k === AG_FILTER)) AG_FILTER = "alle";
  for (const [k, t] of filter) f.append(el("button", {type: "button", class: "outline klein" + (AG_FILTER === k ? " on" : ""), "data-ag-filter": k}, t));
  m.append(f);
  const passt = a => AG_FILTER === "alle" || (AG_FILTER === "meine" ? (a.zustaendig || "").toLowerCase() === NAME.toLowerCase() : !a.zustaendig);
  const l = AG.filter(passt).sort(agSortierung);
  const gruppen = [["Überfällig", ueberfaellig], ["Offen", a => agOffen(a) && !ueberfaellig(a) && !spaeter(a)],
    ["Später möglich", a => spaeter(a) && !ueberfaellig(a)]];
  for (const [t, g] of gruppen) {
    const x = l.filter(g);
    if (x.length) { m.append(el("h3", {}, `${t} (${x.length})`)); for (const a of x) m.append(agEintrag(a, true)); }
  }
  const zu = l.filter(a => !agOffen(a));
  if (zu.length) m.append(el("details", {}, el("summary", {}, `Erledigt oder entfallen (${zu.length})`), zu.map(a => agEintrag(a, true))));
  if (!l.length) m.append(el("div", {class: "leer"}, AG.length ? "Keine Aufgaben für diesen Filter." : "Noch keine Aufgaben."));
}

document.addEventListener("click", e => {
  const n = e.target.closest("[data-ag-neu]");
  if (n) { e.preventDefault(); const z = n.dataset.agNeu; agFormular(null, z && z !== "allgemein" ? [z] : [], z || null); return; }
  const b = e.target.closest("[data-ag-edit]");
  if (b) { e.preventDefault(); const dlg = $("#rm"); agFormular(b.dataset.agEdit, [], dlg.open && !dlg.dataset.ag ? dlg.dataset.ziel : null); return; }
  const h = e.target.closest("[data-ag-haken]");
  if (h) { e.preventDefault(); agHaken(h.dataset.agHaken); return; }
  const f = e.target.closest("[data-ag-filter]");
  if (f) { AG_FILTER = f.dataset.agFilter; route(true); }
}, true);
window.addEventListener("online", () => agLaden().then(rmNeuZeichnen));

/* ---------- Router ---------- */
let reiter = "plan";
function zeigeReiter(name) {
  reiter = name;
  const nav = $("#nav");
  nav.classList.toggle("viele", REITER.length > 5);
  nav.style.flexGrow = REITER.length;   // jeder Reiter so breit wie der Suchknopf
  nav.replaceChildren(...REITER.map(([k, t]) => el("a", {href: "#" + k, class: k === name ? "on" : false, "aria-current": k === name ? "page" : false},
    symbol(k === "varianten" && START === "varianten" ? "karte" : k), el("span", {}, t), k === "offen" ? el("span", {class: "zahl", hidden: true}) : null)));
  offenZahl();
}
// Zahl am Reiter „Offen“; Warnfarbe bei überfälligen Aufgaben oder nicht gesendeten Rückmeldungen
function offenZahl() {
  const k = document.querySelector('#nav a[href="#offen"]');
  if (!k) return;
  const z = k.querySelector(".zahl");
  const ag = AG.filter(agOffen), ueber = ag.filter(ueberfaellig).length, aus = AUSGANG.length;
  const n = ag.length + aus;
  z.hidden = !n; z.textContent = n || "";
  k.classList.toggle("warn", ueber > 0 || aus > 0);
  const teile = [`${ag.length} Aufgaben offen`, ueber ? `${ueber} überfällig` : "", aus ? `${aus} Rückmeldungen noch nicht gesendet` : ""].filter(Boolean);
  k.setAttribute("aria-label", "Offen: " + teile.join(", "));
  k.title = k.getAttribute("aria-label");
}

function zumZiel(id) {
  const e = document.getElementById(id);
  if (!e) return;
  for (let p = e.parentElement; p; p = p.parentElement) if (p.tagName === "DETAILS") p.open = true;
  if (e.tagName === "DETAILS") e.open = true;
  e.scrollIntoView({block: "start"});
  e.classList.remove("blitz");
  void e.offsetWidth;
  e.classList.add("blitz");
}

function route(behalten) {
  const q = $("#suche").value.trim();
  const m = $("#main");
  const y = window.scrollY;
  if (KARTE) { KARTE.remove(); KARTE = null; }
  for (const k of EKARTEN) { k.sicht.disconnect(); if (k.karte) k.karte.remove(); }
  EKARTEN = [];
  m.replaceChildren();
  m.classList.remove("breit");
  let ziel = null;
  const h = decodeURIComponent(location.hash.slice(1));
  if (q.length >= 2) { zeigeReiter(reiter); ansichtSuche(m, q); window.scrollTo(0, 0); return; }
  if (!h && START === "varianten") { zeigeReiter("varianten"); ansichtVarianten(m); }
  else if (!h || h === "plan") { zeigeReiter("plan"); ansichtPlan(m); }
  else if (h === "etappen" && ETAPPEN_REITER) { zeigeReiter("etappen"); ansichtEtappen(m); }
  else if (h === "etappen") { zeigeReiter("wissen"); ansichtWissen(m); ziel = "weitere-wege"; }
  // Etappe des gewählten Plans (oder ein Block daraus): zum Tag, an dem sie gegangen wird
  else if (ETAPPE_TAG.has(h) || (blockZu.has(h) && ETAPPE_TAG.has(blockZu.get(h).id))) {
    zeigeReiter(TIEFE ? "varianten" : "plan"); ansichtTag(m, ETAPPE_TAG.get(ETAPPE_TAG.has(h) ? h : blockZu.get(h).id)); ziel = h; }
  else if (!TIEFE && PLAN_FEST && PLAN_FEST.tage.some(t => t.id === h)) { zeigeReiter("plan"); ansichtTag(m, h); }
  else if (h === "wissen") { zeigeReiter("wissen"); ansichtWissen(m); }
  else if (h === "orte") { zeigeReiter("wissen"); ansichtWissen(m); ziel = "orte"; }
  else if (h === "praxis") { zeigeReiter("wissen"); ansichtWissen(m); ziel = "praxis"; }
  else if (h === "quellen") { zeigeReiter("wissen"); ansichtWissen(m); ziel = "quellen"; }
  else if (h === "offen") { zeigeReiter("offen"); ansichtOffen(m); }
  else if (h === "wuensche" && WUENSCHE) { zeigeReiter("wuensche"); ansichtWuensche(m); }
  else if (h === "rueckmeldungen" || h === "aufgaben" || h === "fragen") { zeigeReiter("offen"); ansichtOffen(m); ziel = h; }
  else if (/^F-\d+$/.test(h) && zeileZu.get(h) === "fragen") { zeigeReiter("offen"); ansichtOffen(m); ziel = h; }
  else if (h === "varianten" && HAT_VARIANTEN) { zeigeReiter("varianten"); ansichtVarianten(m); }
  else if (TIEFE && planZu(h)) { zeigeReiter("varianten"); ansichtPlanDetail(m, planZu(h)); }
  else if (TIEFE && tagBekannt(h)) { zeigeReiter("varianten"); ansichtTag(m, h); }
  else if (TIEFE && ortAbschnitt(h)) { zeigeReiter("varianten"); ansichtOrt(m, ortAbschnitt(h)); }
  else if (TIEFE && blockZu.has(h) && blockZu.get(h).typ === "ort") { zeigeReiter("varianten"); ansichtOrt(m, blockZu.get(h)); ziel = h; }
  else if (proId.has(h)) { const a = proId.get(h); zeigeReiter(TYP_REITER[a.typ]); ansichtAbschnitt(m, a); }
  else if (blockZu.has(h)) { const a = blockZu.get(h); zeigeReiter(TYP_REITER[a.typ]); ansichtAbschnitt(m, a); ziel = h; }
  else if (zeileZu.get(h) === "varianten") { zeigeReiter("varianten"); ansichtVarianten(m); ziel = h; }
  else if (zeileZu.has(h)) { zeigeReiter("plan"); ansichtPlan(m); ziel = h; }
  else { zeigeReiter("plan"); ansichtPlan(m); }
  m.classList.toggle("breit", reiter === "varianten");
  if (behalten === true) window.scrollTo(0, y);
  else if (ziel) zumZiel(ziel); else window.scrollTo(0, 0);
}

document.title = D.reise.titel;
$("#titel").textContent = D.reise.titel;
$("#untertitel").textContent = D.reise.untertitel;
let wartet;
$("#suche").addEventListener("input", () => { clearTimeout(wartet); wartet = setTimeout(route, 150); });
$("#main").addEventListener("click", e => {
  const a = e.target.closest("a[href^='#']");
  if (a && document.body.classList.contains("sucht")) { $("#suche").value = ""; suche(false); }
});
// Suche: runder Knopf neben der Leiste öffnet das Suchfeld an ihrer Stelle; × oder Esc schließt, „/“ öffnet
function suche(an) {
  document.body.classList.toggle("sucht", an);
  $("#suchfeld").hidden = !an;
  $("#suchKnopf").setAttribute("aria-expanded", String(an));
  if (an) $("#suche").focus();
  else { const war = $("#suche").value; $("#suche").value = ""; if (war) route(); $("#suchKnopf").focus(); }
}
$("#suchKnopf").addEventListener("click", () => suche(true));
$("#suchZu").addEventListener("click", () => suche(false));
$("#suchfeld").addEventListener("submit", e => { e.preventDefault(); $("#suche").blur(); });
$("#suche").addEventListener("keydown", e => { if (e.key === "Escape") suche(false); });
document.addEventListener("keydown", e => {
  if (e.key === "/" && !document.body.classList.contains("sucht") && !e.target.closest("input, textarea, select, [contenteditable]") && !$("#rm").open) { e.preventDefault(); suche(true); }
});
window.addEventListener("hashchange", () => { if (document.body.classList.contains("sucht")) { $("#suche").value = ""; document.body.classList.remove("sucht"); $("#suchfeld").hidden = true; } route(); });
route();
rmKnopf();
agKnopf();
Promise.all([rmLaden(), agLaden()]).then(() => route(true));

/* ---------- Offline (PWA, Issue #6): Service Worker sw.js im Pfad der Reise ----------
   Neue Version wartet, bis „Aktualisieren“ getippt wird; danach einmal neu laden. */
function netzAnzeigen() { $("#offline").hidden = navigator.onLine; }
window.addEventListener("online", netzAnzeigen);
window.addEventListener("offline", netzAnzeigen);
netzAnzeigen();
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  // Neu laden nur bei einem Wechsel der Version, nicht beim ersten Besuch (da übernimmt der Worker nur die Kontrolle)
  let neuGeladen = false, gewollt = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (neuGeladen || !gewollt) return; neuGeladen = true; location.reload();
  });
  // Offline-Karte und Bilder sollen nicht verdrängt werden, wenn das Telefon Platz braucht
  if ((R && R.karte && R.karte.grundkarte || WK) && navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  navigator.serviceWorker.register("sw.js").then(reg => {
    const zeigen = () => { if (reg.waiting && navigator.serviceWorker.controller) $("#neu").hidden = false; };
    zeigen();
    reg.addEventListener("updatefound", () => {
      const sw = reg.installing;
      sw && sw.addEventListener("statechange", () => { if (sw.state === "installed") zeigen(); });
    });
    $("#neuLaden").addEventListener("click", () => {
      gewollt = true;
      if (reg.waiting) reg.waiting.postMessage({typ: "uebernehmen"}); else location.reload();
    });
    // Als App vom Home-Bildschirm prüft iOS selten von sich aus; beim Zurückholen selbst nachsehen.
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible" && navigator.onLine) reg.update().catch(() => {});
    });
  }).catch(() => {});
}
