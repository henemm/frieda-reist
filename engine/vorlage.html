  if (n.an_bord) return "an Bord";
  if (n.wahl) { const w = wahlZu.get(n.wahl); const k = w.optionen.filter(o => !weg(o.status)); return k.length > 1 ? `${ortName(n.ort)}: ${k.length} Kandidaten` : k[0].titel; }
  if (n.unterkunft) return R.unterkuenfte[n.unterkunft].name;
  return n.hinweis || ortName(n.ort);
}
function tagMin(t) {
  let m = 0;
  for (const s of t.strecken) { const st = R.strecken[s.id] || {}; if ((st.art || "wandern") !== "wandern") continue;
    const g = Object.entries(st.kennzahlen || {}).find(([k]) => /^(gehzeit|dauer)/i.test(k));
    const x = g && /(\d+):(\d{2})/.exec(g[1]); if (x) m += +x[1] * 60 + +x[2]; }
  return m;
}

function steckbrief(p, imPlan) {
  const s = p.summe, f = s.fehlend || [];
  const k = imPlan ? el("div", {class: "karte steckbrief", style: `--farbe:${planFarbe(p)}`})
    : el("div", {class: "karte steckbrief ziel" + (VARIANTE === p.id ? " an" : ""), id: p.id, "data-ziel": p.id, "data-variante": p.id, style: `--farbe:${planFarbe(p)}`});
  if (!imPlan) k.append(el("div", {class: "k"}, p.kurz, zid(p.id)), el("div", {class: "z klein"}, p.titel));
  if (TIEFE ? planFest(p) : p.aktuell) k.append(el("div", {class: "chips"}, chip("plan", TIEFE ? "gewählt" : "entspricht dem aktuellen Plan")));
  if (TIEFE && p.text && !imPlan) k.append(el("p", {class: "z klein"}, p.text.length > 220 ? p.text.slice(0, 220).replace(/\s\S*$/, "") + " …" : p.text));
  const ty = Object.entries(s.unterkunftstypen).map(([a, n]) => `${n} ${a === "offen" ? "noch offen" : a}`).join(" · ");
  // Gehzeit, Strecke, Höhenmeter nur bei Plänen mit Wanderdaten (Wanderung ja, Rundreise mit Bahn nein)
  const wandern = s.min || s.km || s.auf;
  const zeilen = [["Tage", `${s.tage}`], ["Gehzeit", f.includes("min") ? "unvollständig" : `${f.length ? "" : ""}${dauer(s.min)}`],
    ["Strecke", f.includes("km") ? "– (Angaben fehlen)" : `${String(s.km).replace(".", ",")} km`],
    ["Höhenmeter", f.includes("auf") ? "– (Angaben fehlen)" : `↑ ${s.auf} / ↓ ${s.ab}`],
    ["Längster Tag", s.laengster ? `${dauer(s.laengster.min)} (Tag ${s.laengster.nr})` : "–"], ["Nächte", ty]]
    .filter(([a]) => wandern || !["Gehzeit", "Strecke", "Höhenmeter", "Längster Tag"].includes(a));
  k.append(el("dl", {}, zeilen.flatMap(([a, b]) => [el("dt", {}, a), el("dd", {}, b)])));
  if (p.plus.length) k.append(el("ul", {}, p.plus.map(x => el("li", {}, "+ " + x))));
  if (p.minus.length) k.append(el("ul", {}, p.minus.map(x => el("li", {}, "– " + x))));
  if (p.warnungen.length) k.append(warnungen(p.warnungen));
  const z = el("div", {class: "z klein"}, "Besteht aus: ");
  p.auswahl.forEach((oid, i) => { if (i) z.append(", "); z.append(link(oid, (optionZu.get(oid) || [, {titel: oid}])[1].titel)); });
  k.append(z);
  if (TIEFE && !imPlan) k.append(el("a", {class: "weiter", href: "#" + p.id}, "Plan öffnen: Tage und Orte →"));
  return k;
}

function vergleichTabelle(plaene) {
  const t = el("table", {class: "vergleich"});
  if (plaene.length === 1) {
    const p = plaene[0];
    t.append(el("tr", {}, ["Tag", "Datum", "Etappe", "Zeit", "Nacht"].map(x => el("th", {}, x))));
    for (const d of p.tage) {
      const m = tagMin(d), n = d.nacht;
      const tr = el("tr", {"data-tag": d.id},
        el("td", {class: "nr plan-nr", style: `--farbe:${planFarbe(p)}`}, String(d.nr)), el("td", {}, datumText(d.datum, d.wochentag)),
        el("td", {}, link(d.id, d.titel)), el("td", {}, m ? dauer(m) : "–"),
        el("td", {}, n ? el("span", {class: "nacht " + nachtKat(n) + katKlasse(nachtKat(n))}, nachtTyp(n) || "–") : "", n ? el("div", {class: "z klein"}, nachtName(n)) : ""));
      t.append(tr);
    }
    return el("div", {class: "tabelle"}, t);
  }
  t.append(el("tr", {}, el("th", {}, "Tag"), plaene.map(p => el("th", {}, planMarke(p), p.kurz))));
  const max = Math.max(...plaene.map(p => p.tage.length));
  for (let i = 0; i < max; i++) {
    const ds = plaene.map(p => p.tage[i]);
    const zelle = d => d ? [link(d.id, d.titel), tagMin(d) ? ` · ${dauer(tagMin(d))}` : "",
      d.nacht ? el("div", {}, el("span", {class: "nacht " + nachtKat(d.nacht) + katKlasse(nachtKat(d.nacht))}, nachtName(d.nacht))) : ""] : "–";
    const tr = el("tr", {}, el("td", {class: "nr"}, String(i + 1), el("div", {class: "z klein"}, ds[0] ? datumText(ds[0].datum, ds[0].wochentag) : "")));
    if (ds.every(d => d && d.id === ds[0].id)) tr.append(el("td", {colspan: plaene.length}, zelle(ds[0])));
    else for (const d of ds) tr.append(el("td", {}, zelle(d)));
    t.append(tr);
  }
  return el("div", {class: "tabelle"}, t);
}

/* Karte mit Leaflet 1.9.4 (BSD-2, leafletjs.com), lokal ausgeliefert (#27). Keine Kacheln aus dem Netz:
   Küste, Orte und Wege kommen aus plan/karte.yaml. Zoomen: zwei Finger bzw. +/−; das Mausrad erst nach
   einem Klick in die Karte, damit die Seite beim Scrollen nicht hängen bleibt. Farben über CSS-Klassen (rh-…). */
let KARTE = null;
function dunkel() { const t = document.documentElement.dataset.theme; return t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; }
function karteZeichnen(plaene, info, box) {
  const K = R.karte, rf = K.rahmen;
  // Offline-Grundkarte: OpenStreetMap-Vektorkarte als PMTiles, gezeichnet von protomaps-leaflet (25.10.2026).
  // Sie liegt im Speicher des Telefons; der Service Worker beantwortet die Bereichsanfragen. Ohne sie: schematische Küste.
  const osm = !!(K.grundkarte && window.protomapsL);
  const karte = KARTE = L.map(box, {zoomSnap: 0.25, scrollWheelZoom: false, dragging: osm || !L.Browser.mobile, tap: false,
    maxZoom: osm ? 17 : 18, attributionControl: !!(K.namensnennung || K.quelle),
    maxBounds: L.latLngBounds([rf.sued, rf.west], [rf.nord, rf.ost]).pad(0.15)});
  if (K.namensnennung || K.quelle) karte.attributionControl.setPrefix(false).addAttribution(K.namensnennung || K.quelle);
  karte.on("click", () => karte.scrollWheelZoom.enable());
  box.addEventListener("mouseleave", () => karte.scrollWheelZoom.disable());
  if (osm) {
    box.classList.add("osm");
    // Außerhalb des ausgeschnittenen Bereichs (breite Bildschirme) Meeresfarbe der Grundkarte statt grauer Fläche
    box.style.background = dunkel() ? "#31353f" : "#80deea";
    protomapsL.leafletLayer({url: K.grundkarte.url, flavor: dunkel() ? "dark" : "light", lang: "de", maxDataZoom: 15,
      attribution: ""}).addTo(karte);
  }
  const land = {className: "rh-land", weight: 1.2, fillOpacity: 1, interactive: false};
  if (!osm) L.polygon(K.kueste, land).addTo(karte);
  if (!osm) for (const i of K.inseln || []) L.polygon(i, land).addTo(karte);
  // Seen: Ellipsen aus der Artefakt-Vorlage (rx/ry in Pixeln bei 1400 px je Grad)
  const cx = Math.cos((rf.nord + rf.sued) / 2 * Math.PI / 180);
  for (const z of osm ? [] : K.seen || []) {
    const w = (z.drehung || 0) * Math.PI / 180, pts = [];
    for (let i = 0; i < 24; i++) { const t = i / 24 * 2 * Math.PI, x = z.rx * Math.cos(t), y = z.ry * Math.sin(t);
      pts.push([z.lage[0] - (x * Math.sin(w) + y * Math.cos(w)) / 1400, z.lage[1] + (x * Math.cos(w) - y * Math.sin(w)) / 1400 / cx]); }
    L.polygon(pts, {className: "rh-see", weight: 0, fillOpacity: 1, interactive: false}).addTo(karte);
  }
  const etikett = (lyr, text, label, klasse) => {
    const [dx, dy, anker] = label || [8, 4];
    const richtung = anker === "end" ? "left" : anker === "middle" ? (dy < 0 ? "top" : "bottom") : "right";
    lyr.bindTooltip(text, {permanent: true, direction: richtung, className: "rh-lbl " + (klasse || ""), offset: [anker === "middle" ? dx : dx + (richtung === "left" ? 6 : -6), anker === "middle" ? dy : dy - 4]});
  };
  for (const g of osm ? [] : K.gipfel || []) etikett(L.marker(g.lage, {icon: L.divIcon({className: "rh-gipfel", iconSize: [12, 11]}), interactive: false, keyboard: false}).addTo(karte), g.name, g.label, "klein");
  for (const m of osm ? [] : K.meer || []) L.marker(m.lage, {icon: L.divIcon({className: "rh-meer", html: m.name, iconSize: null}), interactive: false, keyboard: false}).addTo(karte);

  const lage = o => (K.orte[o] || {}).lage;
  // Weg einer Strecke: aus karte.yaml, sonst gerade Linie zwischen den Orten (Abstecher ohne Linie)

// Geldbetrag aus einem Merkmal („120 €“, „ca. 150–180 €“, „¥23.610“, „181 € (Nacht 26.2.)“) -> {von, bis, waehrung};
// gelesen wird nur der erste Betrag oder die erste Spanne vor einer Klammer; ohne Währung oder Zahl null, ebenso ein Preis
// pro Person (das Merkmal ist der Preis der Nacht für alle zusammen)
function betrag(text) {
  const t = String(text).split("(")[0];

// Kosten der Übernachtungen: Preis pro Nacht (Merkmal preis) am Datum der Nacht; bei offener Wahl die Spanne der
// Kandidaten. -> {text, bekannt, naechte} oder null, wenn kein Preis bekannt ist
function reiseKosten(p) {
  const summe = {}; let bekannt = 0, naechte = 0;
  for (const d of p.tage) {
    const n = d.nacht, st = nachtStand(n);
    if (!st || !st.zaehlt) continue;
    naechte++;
    const w = n.wahl && wahlZu.get(n.wahl);
    const kand = w ? w.optionen.filter(o => !weg(o.status)) : [];
    const offen = w && w.art === "planung" && w.offen && kand.length > 1;
    const uids = n.unterkunft ? [n.unterkunft] : (offen ? kand : [kand.find(o => o.aktiv) || kand[0]].filter(Boolean)).flatMap(o => o.unterkuenfte || []);
    const preise = uids.map(u => R.unterkuenfte[u] && betrag((giltAm(((R.unterkuenfte[u].merkmale || {}).preis), d.datum) || {}).wert || "")).filter(Boolean);
    if (!preise.length || new Set(preise.map(x => x.waehrung)).size > 1) continue;
    const g = summe[preise[0].waehrung] ||= {von: 0, bis: 0};
    g.von += Math.min(...preise.map(x => x.von)); g.bis += Math.max(...preise.map(x => x.bis));

  const zahl = x => Math.round(x).toLocaleString("de-DE");
  const text = Object.entries(summe).map(([w, g]) => (g.von === g.bis ? zahl(g.von) : `${zahl(g.von)}–${zahl(g.bis)}`) + " " + w).join(" + ");

function markiert(text, begriffe, laenge) {
  const n = norm(text);
  let pos = -1;
  for (const b of begriffe) { const p = n.indexOf(b); if (p >= 0 && (pos < 0 || p < pos)) pos = p; }
  let von = Math.max(0, pos - 40), bis = Math.min(text.length, von + laenge);
  const stueck = text.slice(von, bis), ns = n.slice(von, bis);
  const treffer = [];
  for (const b of begriffe) for (let i = ns.indexOf(b); i >= 0; i = ns.indexOf(b, i + b.length)) treffer.push([i, i + b.length]);
  treffer.sort((x, y) => x[0] - y[0]);
  const out = el("span", {}, von > 0 ? "…" : "");
  let c = 0;
  for (const [s, e] of treffer) {
    if (s < c) continue;
    out.append(stueck.slice(c, s), el("mark", {}, stueck.slice(s, e)));
    c = e;
  }
  out.append(stueck.slice(c), bis < text.length ? "…" : "");
  return out;
}

async function senden(e) {
  const r = await fetch(API, {method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({name: e.name, art: e.art, ziel: e.ziel, text: e.text, quelle: e.quelle || ""})});

  if (!r.ok) throw {netz: true};

    try { const neu = await senden(e); MEINE.add(neu.id); RM = [neu, ...RM.filter(x => x.id !== neu.id)]; }

  try {
    const neu = await senden(e);
    MEINE.add(neu.id); RM = [neu, ...RM.filter(x => x.id !== neu.id)];
    API_OK = true; merke("meine", [...MEINE]); merke("zwischenstand", RM);

    if (f && f.abgelehnt) return f.abgelehnt;
    if (f && f.anmelden) ANMELDEN_FEHLT = true; else API_OK = false;

}

/* ---------- Wunsch-Brett (Wünsche 25.10.2026, Brett Paket G 27.10.2026) ----------
   Ideen der Mitreisenden ohne feste Stelle: ein Ort, ein Erlebnis, ein Essen. Technisch Rückmeldungen der Art „Wunsch“
   mit Ziel „wuensche“; Senden und Ausgang ohne Netz wie bei Rückmeldungen. Das Brett (api/brett) ordnet sie in Spalten:
   eingebracht, geprüft (Claude hat sie aufgenommen, oft mit Vorschlag „passt zu …“), eingeplant (nur Bestimmer),
   erlebt (alle, unterwegs und danach), passt nicht. Punkte: wie wichtig der eigene Wunsch ist, im Kontingent je Person.
   Punkte gehen nur mit Netz; Abhaken wird ohne Netz gemerkt und nachgereicht (nur das Abhaken, nicht das Zurücknehmen,
   damit ein später nachgereichtes „nicht erlebt“ keinen fremden Haken löscht). Einplanen ist eine Entscheidung und geht
   nur in der Claude-App mit dem persönlichen Link eines Bestimmers; die Karte zeigt, wer eingeplant hat. */
const BR_API = "api/brett";
let BR = lies("brett", null);                 // letzte Antwort von api/brett (offline lesbar)
let BR_AUSGANG = lies("brett-ausgang", []);   // abgehakt ohne Netz: [{rid, name, erlebt}]
const KONTINGENT = (D.reise.regeln || {}).kontingent || {art: "punkte", je_person: 10};
const KANN_ERLEBT = WUENSCHE && V.schreiben !== "nichts" && ["unterwegs", "danach"].includes((D.reise.status || {}).wert);
const WU_SPALTEN = [["eingebracht", "Eingebracht"], ["geprueft", "Geprüft"], ["eingeplant", "Eingeplant"], ["erlebt", "Erlebt"], ["passt_nicht", "Passt nicht"]];
const gleicherName = (a, b) => (a || "").trim().toLowerCase() === (b || "").trim().toLowerCase();
const datumKurz = iso => (iso || "").slice(0, 10).split("-").reverse().join(".");

async function brLaden() {
  if (!WUENSCHE) return;
  try {
    const r = await fetch(BR_API, {cache: "no-store"});
    if (!r.ok) throw 0;
    const d = await r.json();
    if (!d || !Array.isArray(d.wuensche)) throw 0;
    BR = d; merke("brett", BR);
  } catch (e) { return; }
  if (BR_AUSGANG.length) await brAusgangSenden();
}

// Ein Wunsch auf dem Brett ändern (PATCH). -> Antwort; wirft {netz} oder {abgelehnt: Text}
async function brAendern(rid, body) {
  let r;
  try { r = await fetch(API + "/" + encodeURIComponent(rid), {method: "PATCH", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)}); }
  catch (e) { throw {netz: true}; }
  const d = await r.json().catch(() => ({}));
  if (r.status >= 500 || r.status === 429 || (r.status === 404 && !d.fehler)) throw {netz: true};   // 429: kurz zu viele, später noch einmal
  if (r.status === 401) throw {anmelden: true, abgelehnt: d.fehler || "Bitte melde dich an."};
  if (!r.ok) throw {abgelehnt: d.fehler || "abgelehnt"};
  if (BR) { const w = BR.wuensche.find(x => x.id === rid); if (w) Object.assign(w, {punkte: d.punkte, eingeplant: d.eingeplant, erlebt: d.erlebt, verlauf: d.verlauf}); merke("brett", BR); }
  return d;
}

async function brAusgangSenden() {
  const rest = [];
  for (const a of BR_AUSGANG) {
    if (rest.length) { rest.push(a); continue; }   // nach dem ersten Fehlschlag später weiter, in derselben Reihenfolge
    try { await brAendern(a.rid, {name: a.name, erlebt: true}); }
    catch (f) { if (!(f && f.abgelehnt) || f.anmelden) rest.push(a); }
  }
  BR_AUSGANG = rest; merke("brett-ausgang", BR_AUSGANG);
  if (!rest.length) await brLaden();
}

// Spalte wie im Dienst (rueckmeldungen.spalte): passt nicht, erlebt, eingeplant, geprüft, eingebracht
function wuSpalte(w) {
  if (w.status === "verworfen") return "passt_nicht";
  if (w.erlebt) return "erlebt";
  if (w.eingeplant || (w.vorschlag && w.vorschlag.gewaehlt)) return "eingeplant";
  return w.status === "uebernommen" ? "geprueft" : "eingebracht";
}

// Alle Wünsche mit Brett-Angaben: nicht Gesendete, dann der Dienst-Stand; Abgehaktes ohne Netz schon eingerechnet
function wuAlle() {
  const br = new Map(((BR || {}).wuensche || []).map(w => [w.id, w]));
  const alle = [...AUSGANG.filter(e => e.art === "Wunsch").map(e => ({...e, status: ""})),
    ...RM.filter(e => e.art === "Wunsch").map(e => ({punkte: 0, eingeplant: null, erlebt: null, vorschlag: null, verlauf: [], ...br.get(e.id), ...e}))];
  for (const a of BR_AUSGANG) {
    const w = alle.find(x => x.id === a.rid);
    if (w && !w.erlebt) { w.erlebt = {wer: a.name, datum: heute()}; w.nachreichen = true; }
  }
  for (const w of alle) w.spalte = w.status ? wuSpalte(w) : "eingebracht";
  return alle;
}

function wuBilanz(alle) {
  const namen = new Map();
  for (const p of D.reise.personen || []) if (p.rolle !== "reisend") namen.set(p.name.toLowerCase(), p.name);
  for (const w of alle) if (w.name && !namen.has(w.name.toLowerCase())) namen.set(w.name.toLowerCase(), w.name);
  const punkte = KONTINGENT.art === "punkte";
  return [...namen.values()].sort((a, b) => a.localeCompare(b, "de")).map(n => {
    const eigene = alle.filter(w => gleicherName(w.name, n));
    const aktiv = eigene.filter(w => w.status !== "verworfen");
    const vergeben = aktiv.reduce((s, w) => s + (w.punkte || 0), 0);
    const z = s => eigene.filter(w => w.spalte === s).length;
    return {name: n, wuensche: eigene.length, eingeplant: z("eingeplant"), erlebt: z("erlebt"), passt_nicht: z("passt_nicht"),
      frei: Math.max(0, KONTINGENT.je_person - (punkte ? vergeben : aktiv.length)), vergeben};
  });
}

function wuKarte(w) {
  const k = el("div", {class: "wu-karte" + (w.spalte === "erlebt" ? " erlebt" : "") + (w.spalte === "passt_nicht" ? " weg" : ""), id: w.id ? "wu-" + w.id : false});
  const gesendet = !!w.status, offen = gesendet && w.status !== "verworfen";

  if (KONTINGENT.art === "punkte" && w.punkte) c.append(chip("", "●".repeat(Math.min(w.punkte, 5)) + " " + w.punkte + (w.punkte === 1 ? " Punkt" : " Punkte"), {title: "So wichtig ist der Wunsch der Person"}));
  if (w.nachreichen) c.append(chip("offen", "wird nachgereicht"));
  k.append(c);
  k.append(el("div", {class: "kopfzeile"}, `${w.name || "?"} · ${datumKurz(w.erstellt)}`,
    w.quelle ? [" · ", /^https?:\/\//.test(w.quelle) ? el("a", {href: w.quelle, target: "_blank", rel: "noopener"}, "Link") : w.quelle] : ""));
  const links = ids => ids.map((b, i) => [i ? ", " : "", el("a", {href: "#" + b, title: b}, titelZu(b) || "eine Stelle im Handbuch")]);
  if (w.kommentar) k.append(el("div", {class: "antwort"}, el("b", {}, "Frieda: "), w.kommentar));
  const v = w.vorschlag;

    el("b", {}, "Vorschlag: "), (v.bezug || []).length ? ["passt zu ", links(v.bezug)] : "", v.notiz ? el("div", {}, v.notiz) : null,
    v.option ? el("div", {class: "kopfzeile"}, v.gewaehlt ? "Option gewählt: " : "Als Option zur Wahl: ", links([v.option])) : null));
  if (w.eingeplant) k.append(el("div", {class: "kopfzeile"}, `Eingeplant von ${w.eingeplant.wer} am ${datumKurz(w.eingeplant.datum)}`,
    (w.eingeplant.bezug || []).length ? [": ", links(w.eingeplant.bezug)] : ""));
  if (w.erlebt) k.append(el("div", {class: "kopfzeile"}, `Erlebt ✓ ${w.erlebt.wer} am ${datumKurz(w.erlebt.datum)}`));
  const knoepfe = el("div", {class: "wu-knoepfe"});
  const eigen = gleicherName(w.name, NAME);
  if (KANN_WUNSCH && offen && eigen && KONTINGENT.art === "punkte") knoepfe.append(
    el("span", {class: "kopfzeile"}, "Punkte "),
    el("button", {type: "button", class: "outline klein", "data-wu-punkte": w.id, "data-delta": "-1", disabled: !w.punkte, "aria-label": "Ein Punkt weniger"}, "−"),
    el("span", {class: "wu-zahl"}, String(w.punkte || 0)),
    el("button", {type: "button", class: "outline klein", "data-wu-punkte": w.id, "data-delta": "1", "aria-label": "Ein Punkt mehr"}, "+"));
  if (w.status === "neu" && MEINE.has(w.id) && !w.erlebt && !w.eingeplant) knoepfe.append(el("button", {type: "button", class: "outline klein", "data-zurueck": w.id}, "Zurückziehen"));
  if (!gesendet) knoepfe.append(el("button", {type: "button", class: "outline klein", "data-verwerfen": w.lokal}, "Nicht senden"));
  if (knoepfe.childNodes.length) k.append(knoepfe);
  return k;
}

  WU_ENTWURF = {text: "", quelle: ""};

async function wuPunkte(rid, delta) {
  const w = wuAlle().find(x => x.id === rid);
  if (!w || !NAME) return;
  try { await brAendern(rid, {name: NAME, punkte: Math.max(0, (w.punkte || 0) + delta)}); }
  catch (f) { alert(f && f.abgelehnt ? f.abgelehnt : "Gerade keine Verbindung. Punkte lassen sich nur mit Netz ändern."); return; }
  route(true);
}

async function wuErlebt(rid) {
  const w = wuAlle().find(x => x.id === rid);
  const name = nameHolen();
  if (!w || !name) return;
  if (w.nachreichen) {   // eigener, noch nicht gesendeter Haken: einfach wieder streichen
    BR_AUSGANG = BR_AUSGANG.filter(a => a.rid !== rid); merke("brett-ausgang", BR_AUSGANG); route(true); return;
  }
  try { await brAendern(rid, {name, erlebt: !w.erlebt}); }
  catch (f) {
    if (f && f.abgelehnt) { alert("Nicht gespeichert: " + f.abgelehnt); return; }
    if (w.erlebt) { alert("Gerade keine Verbindung. Einen Haken zurücknehmen geht nur mit Netz."); return; }
    BR_AUSGANG = [...BR_AUSGANG, {rid, name}];   // ohne Netz: abhaken merken, später nachreichen
  }
  merke("brett-ausgang", BR_AUSGANG);
  route(true);
}

/* ---------- Aufgaben (AG-…, 24.10.2026) ----------
   Hängen an einer oder mehreren IDs. Alle dürfen sie sofort anlegen, ändern und abhaken; der Dienst
   führt den Verlauf (wer, wann, was). Gelöscht wird nie: nicht mehr Nötiges „entfällt“. Ohne Netz
   zeigt die Seite den zuletzt geladenen Stand; Änderungen gehen dann nicht (kein Ausgang wie bei
   Rückmeldungen, weil sich gleichzeitige Änderungen sonst still überschreiben könnten). */
const AG_API = "api/aufgaben";
let AG = lies("aufgaben", []);
let AG_OK = null;
let AG_FILTER = "alle";
const AG_STATUS = {offen: "offen", in_arbeit: "in Arbeit", erledigt: "erledigt", entfaellt: "entfällt"};
const AG_PRIO = ["hoch", "normal", "niedrig"];
const AG_FELD = {titel: "Titel", bezug: "Bezug", zustaendig: "Zuständig", prioritaet: "Priorität", ab: "Ab", frist: "Frist", notiz: "Notiz", status: "Status"};
function agWert(k, v) {
  if (v == null || v === "" || (Array.isArray(v) && !v.length)) return "–";
  if (k === "status") return AG_STATUS[v] || v;
  if (k === "ab" || k === "frist") return v.split("-").reverse().join(".");
  if (k === "notiz") return v.length > 60 ? v.slice(0, 60) + "…" : v;
  return [].concat(v).join(", ");
}
const agOffen = a => a.status === "offen" || a.status === "in_arbeit";
function heute() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }
const ueberfaellig = a => V.fristen && agOffen(a) && a.frist && a.frist < heute();   // Fristen zählen ab Status „fest“
const spaeter = a => agOffen(a) && a.ab && a.ab > heute();
function agZu(id) { return AG.filter(a => (a.bezug || []).includes(id)); }
function agSortierung(a, b) {
  const s = x => Object.keys(AG_STATUS).indexOf(x.status), p = x => AG_PRIO.indexOf(x.prioritaet || "normal");
  return s(a) - s(b) || p(a) - p(b) || (a.frist || "9999").localeCompare(b.frist || "9999") || a.id.localeCompare(b.id, "de", {numeric: true});
}
function tagMonat(iso) { const [j, m, d] = iso.split("-"); return `${+d}.${+m}.${j === String(new Date().getFullYear()) ? "" : j}`; }

async function agLaden() {
  try {
    const r = await fetch(AG_API, {cache: "no-store"});
    if (!r.ok) throw 0;
    const d = await r.json();
    if (!Array.isArray(d)) throw 0;
    AG = d; AG_OK = true; merke("aufgaben", AG);
  } catch (e) { AG_OK = false; }
  agKnopf();
}

async function agSenden(methode, url, body) {
  let r;
  try {
    r = await fetch(url, {method: methode, headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  } catch (e) { throw "Gerade keine Verbindung. Aufgaben lassen sich nur mit Netz ändern."; }
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw r.status >= 500 || r.status === 404 && !d.fehler ? "Dienst gerade nicht erreichbar." : (d.fehler || "abgelehnt");
  AG = [...AG.filter(a => a.id !== d.id), d].sort((a, b) => a.id.localeCompare(b.id, "de", {numeric: true}));
  AG_OK = true; merke("aufgaben", AG);

}

let reiter = "plan";

  offenZahl();
}
// Zahl am Reiter „Offen“; Warnfarbe bei überfälligen Aufgaben oder nicht gesendeten Rückmeldungen
function offenZahl() {
  const k = document.querySelector('#nav a[href="#offen"]');
  if (!k) return;
  const z = k.querySelector(".zahl");
  const ag = AG.filter(agOffen), ueber = ag.filter(ueberfaellig).length, aus = AUSGANG.length;
  const n = ag.length + aus;
  z.hidden = !n; z.textContent = n || "";
  k.classList.toggle("warn", ueber > 0 || aus > 0);
  const teile = [`${ag.length} Aufgaben offen`, ueber ? `${ueber} überfällig` : "", aus ? `${aus} Rückmeldungen noch nicht gesendet` : ""].filter(Boolean);
  k.setAttribute("aria-label", "Offen: " + teile.join(", "));
  k.title = k.getAttribute("aria-label");
}

function zumZiel(id) {
  const e = document.getElementById(id);
  if (!e) return;
  // Teil eines Reiters (Tagesseite): erst den Reiter wählen
  if (e.matches("[role=tabpanel][hidden]")) reiterWaehlen(e.closest(".reiter"), e.dataset.teil);
  for (let p = e.parentElement; p; p = p.parentElement) if (p.tagName === "DETAILS") p.open = true;
  const kurz = e.closest(".weg-text.kurz");
  if (kurz) { kurz.classList.remove("kurz"); if (kurz.nextElementSibling && kurz.nextElementSibling.matches(".weiterlesen")) kurz.nextElementSibling.hidden = true; }
  if (e.tagName === "DETAILS") e.open = true;
  e.scrollIntoView({block: "start"});
  e.classList.remove("blitz");
  void e.offsetWidth;
  e.classList.add("blitz");
}

function route(behalten) {
  const q = $("#suche").value.trim();
  const m = $("#main");
  const y = window.scrollY;
  if (KARTE) { KARTE.remove(); KARTE = null; }
  for (const k of EKARTEN) { k.sicht.disconnect(); if (k.karte) k.karte.remove(); }
  EKARTEN = [];
  m.replaceChildren();
  let ziel = null;
  const h = decodeURIComponent(location.hash.slice(1));
  if (q.length >= 2) { zeigeReiter(reiter); ansichtSuche(m, q); window.scrollTo(0, 0); return; }
  if (!h && START === "varianten") { zeigeReiter("varianten"); ansichtStart(m); }
  else if (!h || h === "plan") { zeigeReiter("plan"); ansichtPlan(m); }
  else if (h === "etappen" && ETAPPEN_REITER) { zeigeReiter("etappen"); ansichtEtappen(m); }
  else if (h === "etappen") { zeigeReiter("wissen"); ansichtWissen(m); ziel = "weitere-wege"; }
  // Etappe des gewählten Plans (oder ein Block daraus): zum Tag, an dem sie gegangen wird
  else if (ETAPPE_TAG.has(h) || (blockZu.has(h) && ETAPPE_TAG.has(blockZu.get(h).id))) {
    zeigeReiter(TIEFE ? "varianten" : "plan"); ansichtTag(m, ETAPPE_TAG.get(ETAPPE_TAG.has(h) ? h : blockZu.get(h).id)); ziel = h; }
  else if (!TIEFE && PLAN_TAGE && PLAN_TAGE.tage.some(t => t.id === h)) { zeigeReiter("plan"); ansichtTag(m, h); }
  else if (h === "wissen") { zeigeReiter("wissen"); ansichtWissen(m); }
  else if (h === "bausteine") { zeigeReiter(""); ansichtBausteine(m); }
  else if (h === "orte") { zeigeReiter("wissen"); ansichtWissen(m); ziel = "orte"; }
  else if (h === "praxis") { zeigeReiter("wissen"); ansichtWissen(m); ziel = "praxis"; }
  else if (h === "quellen") { zeigeReiter("wissen"); ansichtWissen(m); ziel = "quellen"; }
  else if (h === "offen") { zeigeReiter("offen"); ansichtOffen(m); }
  else if (h === "wuensche" && WUENSCHE) { zeigeReiter("wuensche"); ansichtWuensche(m); }
  else if ((h === "rueckmeldungen" || h === "aufgaben" || h === "fragen") && B(h)) { zeigeReiter("offen"); ansichtOffen(m); ziel = h; }
  else if (/^F-\d+$/.test(h) && zeileZu.get(h) === "fragen" && B("fragen")) { zeigeReiter("offen"); ansichtOffen(m); ziel = h; }
  else if (h === "varianten" && HAT_VARIANTEN) { zeigeReiter("varianten"); ansichtStart(m); }
  else if (TIEFE && planZu(h)) { zeigeReiter("varianten"); ansichtPlanDetail(m, planZu(h)); }
  else if (TIEFE && tagBekannt(h)) { zeigeReiter("varianten"); ansichtTag(m, h); }
  else if (TIEFE && ortAbschnitt(h)) { zeigeReiter("varianten"); ansichtOrt(m, ortAbschnitt(h)); }
  else if (TIEFE && blockZu.has(h) && blockZu.get(h).typ === "ort") { zeigeReiter("varianten"); ansichtOrt(m, blockZu.get(h)); ziel = h; }
  else if (proId.has(h)) { const a = proId.get(h); zeigeReiter(TYP_REITER[a.typ]); ansichtAbschnitt(m, a); }
  else if (blockZu.has(h)) { const a = blockZu.get(h); zeigeReiter(TYP_REITER[a.typ]); ansichtAbschnitt(m, a); ziel = h; }
  else if (zeileZu.get(h) === "varianten") { zeigeReiter("varianten"); ansichtStart(m); ziel = h; }
  else if (zeileZu.has(h)) { zeigeReiter("plan"); ansichtPlan(m); ziel = h; }
  else { zeigeReiter("plan"); ansichtPlan(m); }
  if (behalten === true) window.scrollTo(0, y);
  else if (ziel) zumZiel(ziel); else window.scrollTo(0, 0);
}

// Suche: runder Knopf neben der Leiste öffnet das Suchfeld an ihrer Stelle; × oder Esc schließt, „/“ öffnet
function suche(an) {
  document.body.classList.toggle("sucht", an);
  $("#suchfeld").hidden = !an;
  $("#suchKnopf").setAttribute("aria-expanded", String(an));
  if (an) $("#suche").focus();
  else { const war = $("#suche").value; $("#suche").value = ""; if (war) route(); $("#suchKnopf").focus(); }
}
$("#suchKnopf").addEventListener("click", () => suche(true));
$("#suchZu").addEventListener("click", () => suche(false));
$("#suchfeld").addEventListener("submit", e => { e.preventDefault(); $("#suche").blur(); });
$("#suche").addEventListener("keydown", e => { if (e.key === "Escape") suche(false); });
document.addEventListener("keydown", e => {
  if (e.key === "/" && !document.body.classList.contains("sucht") && !e.target.closest("input, textarea, select, [contenteditable]") && !$("#rm").open) { e.preventDefault(); suche(true); }
});
window.addEventListener("hashchange", () => { if (document.body.classList.contains("sucht")) { $("#suche").value = ""; document.body.classList.remove("sucht"); $("#suchfeld").hidden = true; } route(); });
route();
rmKnopf();
agKnopf();
Promise.all([ichLaden(), rmLaden(), agLaden(), brLaden()]).then(() => route(true));

/* ---------- Höhe als App vom Home-Bildschirm (iOS) ----------
   Nach dem Schließen der Tastatur bleibt die Höhe des Fensters manchmal auf dem Stand mit Tastatur stehen, bis die App
   neu startet: Die Leiste schwebt dann in der Mitte (WebKit, iOS 26, in Safari selbst nicht). Gemerkt wird die größte
   Höhe je Breite (die Breite trennt Hoch- und Querformat); ohne Eingabefeld im Fokus rückt alles Untere um den
   Fehlbetrag nach unten. Ein zu kleiner Messwert zur falschen Zeit schadet nicht, das Maximum übergeht ihn. Mit Fokus
   ist die Tastatur wirklich offen, dann bleibt die Leiste über ihr (die Suche steht in der Leiste). */
(function () {
  const alsApp = (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
  if (!alsApp) return;
  const hoechste = new Map();   // Breite in px -> größte gesehene Höhe
  const tippt = () => {
    const e = document.activeElement;
    return !!e && (e.isContentEditable || e.matches("textarea, select, input:not([type=checkbox],[type=radio],[type=button],[type=submit],[type=reset],[type=range],[type=color],[type=file])"));
  };
  function messen() {
    const breite = window.innerWidth, hoehe = window.innerHeight;
    if (!breite || !hoehe) return;   // im Hintergrund kann 0 kommen, das ist keine Messung
    const max = Math.max(hoechste.get(breite) || 0, hoehe);
    hoechste.set(breite, max);
    const fehlt = tippt() ? 0 : max - hoehe;
    document.documentElement.style.setProperty("--hoehe-fehlt", (fehlt > 1 ? fehlt : 0) + "px");
  }
  messen();
  for (const ev of ["resize", "orientationchange", "pageshow", "focusin"]) window.addEventListener(ev, messen);
  // Beim Verlassen eines Felds erst messen, wenn der Fokus angekommen ist und die Tastatur zu
  window.addEventListener("focusout", () => { setTimeout(messen, 50); setTimeout(messen, 400); });
  document.addEventListener("visibilitychange", () => { if (!document.hidden) messen(); });
  if (window.visualViewport) visualViewport.addEventListener("resize", messen);
})();

/* ---------- Offline (PWA, Issue #6): Service Worker sw.js im Pfad der Reise ----------
   Neue Version wartet, bis „Aktualisieren“ getippt wird; danach einmal neu laden. */
function netzAnzeigen() { $("#offline").hidden = navigator.onLine; }
window.addEventListener("online", netzAnzeigen);
window.addEventListener("offline", netzAnzeigen);
netzAnzeigen();
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  // Neu laden nur bei einem Wechsel der Version, nicht beim ersten Besuch (da übernimmt der Worker nur die Kontrolle)
  let neuGeladen = false, gewollt = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (neuGeladen || !gewollt) return; neuGeladen = true; location.reload();
  });
  // Offline-Karte und Bilder sollen nicht verdrängt werden, wenn das Telefon Platz braucht
  if ((R && R.karte && R.karte.grundkarte || WK) && navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  navigator.serviceWorker.register("sw.js").then(reg => {
    const zeigen = () => { if (reg.waiting && navigator.serviceWorker.controller) $("#neu").hidden = false; };
    zeigen();
    reg.addEventListener("updatefound", () => {
      const sw = reg.installing;
      sw && sw.addEventListener("statechange", () => { if (sw.state === "installed") zeigen(); });
    });
    $("#neuLaden").addEventListener("click", () => {
      gewollt = true;
      if (reg.waiting) reg.waiting.postMessage({typ: "uebernehmen"}); else location.reload();
    });
    // Als App vom Home-Bildschirm prüft iOS selten von sich aus; beim Zurückholen selbst nachsehen.
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible" && navigator.onLine) reg.update().catch(() => {});
    });
  }).catch(() => {});
}
